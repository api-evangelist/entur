description: Partner APIs have separate Staging and Dev environments, each with its own OAuth2 authentication service and audience. You create client credentials per environment in Entur Partner. The docs publish no test cards, test accounts or time-simulation tools.
environments:
- name: Production
  auth_service: https://partner.entur.org
  audience: https://api.entur.io
- name: Staging
  auth_service: https://partner.staging.entur.org
  audience: https://api.staging.entur.io
  client_admin: https://entur-partner.staging.entur.org/permission-admin/clients
- name: Dev
  auth_service: https://partner.dev.entur.org
  audience: https://api.dev.entur.io
