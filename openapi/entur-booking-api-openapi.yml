        pricingPlan:
          type:
          - string
          - 'null'
      required:
      - coordinates
      - customerNumber
      - priceAdjustments
      - recurringPaymentId
    BookingResponse:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        transportOperatorBookingId:
          type: string
        transportOperatorLegId:
          type: string
        state:
