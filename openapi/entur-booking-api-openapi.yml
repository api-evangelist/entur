        paymentStatus:
          type: string
          enum:
          - UNPAID
          - PAID
          - PAYMENT_FAILED
        surcharge:
          type:
          - string
          - 'null'
      required:
      - currentAmount
      - originalAmount
      - paymentStatus
      - priceAdjustments
      title: Pricing
    Coordinates:
