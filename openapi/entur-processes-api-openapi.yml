components:
  schemas:
    refundOptionInput:
      required:
      - type
      type: object
      properties:
        type:
          pattern: ^(claim_refund_option|confirm_refund_option)$
          type: string
        optionId:
          $ref: '#/components/schemas/uuid'
    httpStatus:
      maximum: 599
      minimum: 100
      type: integer
      description: HTTP status code (100–599)
    travelPartyRequirements:
      type: object
      properties:
        organisational:
          type: array
          items:
            $ref: '#/components/schemas/organisationalParameter'
        spotReservations:
          type: array
          items:
            $ref: '#/components/schemas/spotReservationParameter'
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/distributionParameter'
        network:
          type: array
          items:
            $ref: '#/components/schemas/networkParameter'
        routing:
          type: array
          items:
            $ref: '#/components/schemas/routingParameter'
        service:
          type: array
          items:
            $ref: '#/components/schemas/serviceParameter'
        temporal:
          type: array
          items:
            $ref: '#/components/schemas/temporalParameter'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/equipmentParameter'
        cancellation:
          type: array
          items:
            $ref: '#/components/schemas/cancellationParameter'
        purchase:
          type: array
          items:
            $ref: '#/components/schemas/purchaseParameter'
    enturRecommendationControl:
      type: object
      properties:
        enabled:
          type: boolean
          description: Enable recommendation-driven bundling based on Offers `recommendations` and `offersToBuy`.
          default: false
        types:
          minItems: 1
          type: array
          description: 'Entur recommendation categories to request when `enabled` is true.

            If omitted, the API defaults to `["CHEAPEST", "NON_FLEXIBLE", "SEMI_FLEXIBLE", "FLEXIBLE"]`.

            '
          items:
            $ref: '#/components/schemas/enturRecommendationType'
        stripDuplicates:
          type: boolean
          description: 'Deduplicate recommendation-driven plans by provider offer + traveller groups + ancillary selections + quantity.

            '
          default: false
      description: 'Entur recommendation behavior control for Offers.

        If omitted, the API defaults to raw mode (recommendation-driven bundling disabled).

        '
    removeTravellerInput:
      required:
      - packageId
      - travellerId
      - type
      type: object
      properties:
        type:
          pattern: ^(traveller)$
          type: string
        travellerId:
          $ref: '#/components/schemas/travellerReference'
        packageId:
          $ref: '#/components/schemas/packageReference'
    spotReservationParameter:
      required:
      - spot
      - spotType
      - type
      type: object
      properties:
        type:
          pattern: ^(spot_reservation)$
          type: string
        spotType:
          type: string
          enum:
          - VEHICLE_SPOT
          - PASSENGER_SPOT
          - LUGGAGE_SPOT
        deck:
          $ref: '#/components/schemas/externalReference'
        space:
          $ref: '#/components/schemas/externalReference'
        spot:
