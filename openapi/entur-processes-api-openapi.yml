            description: Number of items available in stock (inventory). Useful for creating urgency in GUI.
          service:
            type: array
            description: Service characteristics covered by this ancillary, such as service journey, class of use, asset, or accommodation.
            items:
              $ref: '#/components/schemas/serviceParameter'
          reservationRequirements:
            type: array
            description: Reservation rules carried by this ancillary.
            items:
              $ref: '#/components/schemas/reservationRequirement'
          links:
            type: array
            items:
              $ref: '#/components/schemas/link'
        x-tm: ANCILLARY
    uuid:
      type: string
      description: https://en.wikipedia.org/wiki/Universally_unique_identifier see also https://www.ietf.org/rfc/rfc4122.txt (ae76f51c-a1a6-46af-b9ab-8233564adcae)
      x-preferred-pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    geojson:
      type: object
      properties:
        type:
          pattern: ^(FeatureCollection)$
          type: string
        features:
          type: array
          items:
            $ref: '#/components/schemas/geojsonFeature'
        properties:
          type: object
        crs:
          type: object
          properties:
            type:
              type: string
            properties:
              type: object
              properties:
                name:
                  type: string
        numberMatched:
          type: integer
        numberReturned:
          type: integer
        links:
          type: array
          description: actions that can be performed on this package, but also alternative (rel=alternative+1, alternative+2) offers or references to other resources In case it is an alternative, specify clearly in the description what the financial consequences are.
          items:
            $ref: '#/components/schemas/link'
    blackoutUse:
      type: string
      description: How the validity period interacts with blackout periods.
      enum:
      - MAY_TRAVEL_ANYTIME
      - NO_TRAVEL_WITHIN_PERIOD
      - NO_TRAVEL_WITHIN_TIMEBAND
      - MAY_COMPLETE_IF_STARTED_BEFORE
    updateTravellerInput:
      required:
      - packageId
      - travellerId
      - type
      type: object
      properties:
        type:
          pattern: ^(traveller)$
          type: string
        packageId:
          $ref: '#/components/schemas/packageReference'
        travellerId:
          $ref: '#/components/schemas/travellerReference'
        individualTraveller:
          $ref: '#/components/schemas/individualTraveller'
        userProfile:
          $ref: '#/components/schemas/userProfile'
        travellingAsset:
          $ref: '#/components/schemas/travellingAsset'
    assetInput:
      allOf:
      - $ref: '#/components/schemas/legInput'
      - required:
        - assetId
        - type
        type: object
        properties:
          type:
            pattern: ^(asset)$
            type: string
          assetId:
            $ref: '#/components/schemas/assetReference'
          replaceAssetId:
            $ref: '#/components/schemas/assetReference'
    packageReference:
      $ref: '#/components/schemas/normalString'
  parameters:
    acceptLanguage:
      name: Accept-Language
      in: header
      required: true
      style: simple
      explode: false
      schema:
        $ref: '#/components/schemas/shortString'
      x-externalDocs:
        description: A comma-separated list of BCP 47 (RFC 5646) language tags and optional weights as described in IETF RFC7231 section 5.3.5. A list of the languages/localizations the user would like to see the results in. For user privacy and ease of use on the TO side, this list should be kept as short as possible
    limit:
      name: limit
      in: query
      description: 'The optional limit parameter limits the number of items that are presented in the response document.

        Only items are counted that are on the first level of the collection in the response document.

        Nested objects contained within the explicitly requested items shall not be counted. Minimum = 1. Maximum = 10000. Default = 100.'
      required: false
      style: form
      explode: false
      schema:
        maximum: 10000
        minimum: 1
        type: integer
        default: 100
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    EnturDistributionChannelHeaderRequired:
      name: Entur-Distribution-Channel
      in: header
      description: Distribution channel identifier used by downstream sales and ticket distribution services.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
    EnturPOSHeaderRequired:
      name: Entur-POS
      in: header
      description: Point-of-sale identifier used by downstream sales and ticket distribution services.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    authorization:
      name: authorization
      in: header
      description: Header field, JWT must be supplied
      required: true
      style: simple
      explode: false
      schema:
        type: string
    offset:
      name: offset
      in: query
      description: 'The optional offset parameter representing the starting index of the returned collection.

        Only items are counted that are on the first level of the collection in the response document.

        Nested objects contained within the explicitly requested items shall not be counted.

        Default = 0.'
      required: false
      style: form
      explode: false
      schema:
        minimum: 0
        type: integer
        default: 0
    bbox:
      name: bbox
      in: query
      description: 'Only features that have a geometry that intersects the bounding box are selected. The bounding box is provided as four or six numbers, depending on whether the coordinate reference system includes a vertical axis (height or depth): * Lower left corner, coordinate axis 1 * Lower left corner, coordinate axis 2 * Minimum value, coordinate axis 3 (optional) * Upper right corner, coordinate axis 1 * Upper right corner, coordinate axis 2 * Maximum value, coordinate axis 3 (optional)

        If the value consists of four numbers, the coordinate reference system is WGS 84 longitude/latitude (http://www.opengis.net/def/crs/OGC/1.3/CRS84)

        unless a different coordinate reference system is specified in the parameter `bbox-crs`.

        If the value consists of six numbers, the coordinate reference system is WGS 84 longitude/latitude/ellipsoidal height (http://www.opengis.net/def/crs/OGC/0/CRS84h) unless a different coordinate reference system is specified in the parameter `bbox-crs`.

        The query parameter `bbox-crs` is specified in OGC API - Features - Part 2: Coordinate Reference Systems by Reference.

        For WGS 84 longitude/latitude the values are in most cases the sequence of minimum longitude, minimum latitude, maximum longitude and maximum latitude.

        However, in cases where the box spans the antimeridian the first value (west-most box edge) is larger than the third value (east-most box edge).

        If the vertical axis is included, the third and the sixth number are the bottom and the top of the 3-dimensional bounding box.

        If a feature has multiple spatial geometry properties, it is the decision of the server whether only a single spatial geometry property is used to determine the extent or all relevant geometries.'
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: number
  headers:
    enturOrderVersion:
      description: order version from Entur Orders API for the returned package
      required: false
      style: simple
      explode: false
      schema:
        minimum: 1
        type: integer
    contentLanguage:
      description: The language/localization of user-facing content, One IETF BCP 47 (RFC 5646) language tag (nl-NL)
      required: true
      style: simple
      explode: false
      schema:
        pattern: ^[a-zA-Z]+-[a-zA-Z]+$
        type: string
    version:
      description: the version used to format the response
      required: true
      style: simple
      explode: false
      schema:
        type: string
  responses:
    packageResponse:
      description: a geojson response, containing the package details in the main properties and the legs are represented in the features
      headers:
        Version:
          $ref: '#/components/headers/version'
        Entur-Order-Version:
          $ref: '#/components/headers/enturOrderVersion'
        Content-Language:
          $ref: '#/components/headers/contentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/package'
    errorResponse:
      description: Bad request.
      headers:
        Version:
          $ref: '#/components/headers/version'
        Content-Language:
          $ref: '#/components/headers/contentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    searchOfferResponse:
      description: a search offer response
      headers:
        Version:
          $ref: '#/components/headers/version'
        Content-Language:
          $ref: '#/components/headers/contentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/offerCollection'
  securitySchemes:
    OpenData:
      type: http
      description: this data set is open. If it is one of the options, it is up to the implementing party whether it is open or not.
      scheme: none
    BearerAuth:
      type: http
      description: This authentication is the basic one. If you have obtained a JWT (somewhere), you can use this token to identify you at endpoints.
      scheme: bearer
      bearerFormat: JWT
    OAuth:
      type: oauth2
      description: This flow facilitates to get access tokens based on username/password. These can be obtained by the owner of the service, look at the landing page to find out how to contact it.
      flows:
        authorizationCode:
          authorizationUrl: /
          tokenUrl: /oauth/token
          scopes:
            processes: Access to /processes/
    OAuthPKI:
      type: oauth2
      description: OAuth 2.0 with PKI and mutual TLS for client authentication The client sends its X.509 during the handshake. The server validates and accepts the certificate. The call to the /oauth/token can use the provided credentials (O or CN) to provide a access_token (JWT).
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            processes: Access to /processes/
