    Order:
      title: Order
      type: object
      description: A purchase Order for one or more Travellers
      allOf:
      - required:
        - balance
        - createdAt
        - currency
        - failed
        - fees
        - id
        - orderLines
        - organisationId
        - paymentRefs
        - reservations
        - status
        - totalAmount
        - totalTaxAmount
        - travellers
        - version
        type: object
        properties:
          id:
            type: string
            description: ID of Order.
            examples:
            - 3N7URR0X
          version:
            type: integer
            description: 'The system increments an Order’s version number whenever some change occurs that causes the Order’s status to go from CONFIRMED to DRAFT.

              The user has to perform an action that causes the status to go from DRAFT to CONFIRMED (such as paying for the Order) before the time given in expireAt. If the Order is not confirmed within this time, the system will scrap all changes (including the incremented version) and return the Order to its last confirmed version.'
            format: int32
            default: 1
            examples:
            - 2
          status:
            $ref: '#/components/schemas/WorkflowStatus'
          totalAmount:
            type: string
            description: The total amount due for this Order.
            default: '0.00'
          balance:
            type: string
            description: The balance amount for this Order.
            default: '0.00'
          totalTaxAmount:
            type: string
            description: The total tax amount for this Order.
            default: '0.00'
          currency:
            type: string
            description: The currency for this Order.
            default: NOK
          orderLines:
            type: array
            description: OrderLines in the given Order.
            items:
              $ref: '#/components/schemas/OrderLine'
            default: []
          paymentRefs:
            type: array
            description: Payment references used on this Order.
            items:
              $ref: '#/components/schemas/PaymentRef'
            default: []
          reservations:
            type: array
            description: Seating Reservations connected to this Order.
            items:
              $ref: '#/components/schemas/PurchasedReservation'
            default: []
          travellers:
            type: array
            description: Unique Travellers in this Order.
            items:
              $ref: '#/components/schemas/Traveller'
            default: []
          organisationId:
            type: integer
            description: ID of the organisation which created/sold this Order.
            format: int64
            examples:
            - 1
          createdAt:
            type: string
            description: Timestamp for when Order was created.
            format: date-time
            examples:
            - '2020-05-13T07:19:30.389Z'
          lastConfirmedAt:
            type: string
            description: Timestamp for when Order was last confirmed.
            format: date-time
            examples:
            - '2020-05-13T07:19:30.389Z'
          fees:
            type: array
            description: Fees contained in the Order.
            items:
              $ref: '#/components/schemas/Fee'
            default: []
          pos:
            type: string
            description: Point-of-sale reference of request used when Order was created
            examples:
            - POS-123
          distributionChannelId:
            type: string
            description: Distribution channel ID of request used when Order was created
            examples:
            - ENT:DistributionChannel:Sor
          failed:
            type: boolean
            description: Indicates that the order version has failed and needs to be credited.
            default: false
      - $ref: '#/components/schemas/OrderRequest'
