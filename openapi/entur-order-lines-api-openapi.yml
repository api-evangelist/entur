    LocalPriceWithTax:
      required:
      - amount
      - currency
      - exchangeRate
      - taxAmount
      - taxCountry
      - taxRate
      type: object
      properties:
        amount:
          type: string
          description: Amount including tax amount.
          examples:
          - '372.90'
        currency:
          type: string
          description: Currency
          examples:
          - SEK
        exchangeRate:
          type: string
          description: Exchange rate used at creation time to convert the local currency into the order's currency. It is the number of units of the order currency paid for 1 (one) unit of the local currency. Must be in valid BigDecimal format. E.g., if the order currency is NOK and the local currency is EUR, and 1 EUR = 10 NOK, then the exchange rate is 10.0000. If the order currency is NOK and the local currency is SEK, and 100 SEK = 96.21 NOK, then the exchange rate is 0.9621.
          examples:
          - '0.9621'
        taxAmount:
          type: string
          description: Tax amount
          examples:
          - '22.37'
        taxCountry:
          pattern: ^[A-Z]{2}$
          type: string
          description: ISO 3166-1 alpha-2 country code
          examples:
          - SE
        taxRate:
          type: string
          description: Tax rate. Must be in valid BigDecimal format
          examples:
          - '6.00'
      description: The original price, with tax, in the local currency of the tax country.
