components:
  schemas:
    SeqUsageValidityPeriodInsert:
      type: object
      properties:
        empty:
          type: boolean
        traversableAgain:
          type: boolean
    SteppedDuration:
      required:
      - initialDuration
      - stepUnit
      - subsequentStepsDuration
      type: object
      properties:
        initialDuration:
          type: string
          description: Initial duration. Represented as a string formatted according to ISO-8601
          examples:
          - PT1H
        maximumDuration:
          type: string
          description: Maximum duration. Represented as a string formatted according to ISO-8601
          examples:
          - PT1H
        stepUnit:
          type: string
          description: Step unit.
          enum:
          - STOPS
          - STOPS_INCLUDING_PASS_THROUGH_STOPS
          - SECTIONS
          - ZONES
          - NETWORKS
          - OPERATORS
          - COUNTRIES
          examples:
          - ZONES
        subsequentStepsDuration:
          type: string
          description: Subsequent duration. Represented as a string formatted according to ISO-8601
          examples:
          - PT1H
      description: Stepped duration.
    VersionOfObjectRef:
      required:
      - nameOfClass
      - ref
      - version
      type: object
      properties:
        nameOfClass:
          minLength: 1
          type: string
          description: Name of class.
        ref:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: The netex id reference to the object.
        version:
          type: string
          description: Version.
      description: Fare frame ref.
    UsageValidityPeriod:
      required:
      - changed
      - created
      - fareFrameRef
      - fareTableRefs
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        activationMeans:
          type: array
          description: Activation Means. Describes how a product can be activated.
          items:
            type: string
        changed:
          type: string
          description: Changed datetime.
          format: date-time
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
          description: Created datetime.
          format: date-time
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        fareTableRefs:
          type: array
          description: References to FareTable.
          items:
            $ref: '#/components/schemas/FareTableRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:UsageValidityPeriod:Child
        limitingRuleRef:
          $ref: '#/components/schemas/LimitingRule'
        modification:
          type: string
          description: Modification status.
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: UsageValidityPeriod Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          examples:
          - UsageValidityPeriod
        standardDuration:
          type: string
          description: Standard duration. Represented as a string formatted according to ISO-8601
          examples:
          - PT1H
        status:
          type: string
          description: Status
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        steppedDuration:
          $ref: '#/components/schemas/SteppedDuration'
        usageEnd:
          type: string
          description: Usage end.
          enum:
          - STANDARD_DURATION
          - END_OF_CALENDAR_PERIOD
          - END_OF_RIDE
          - END_OF_TRIP
          - END_OF_FARE_DAY
          - END_OF_FARE_PERIOD
          - PRODUCT_EXPIRY
          - PROFILE_EXPIRY
          - DEREGISTRATION
          - UOTHER
        usageEnds:
          type: array
          description: Usage ends. This field is deprecated, please use the field usageEnd
          deprecated: true
          items:
            type: string
        usageStartConstraintType:
          type: string
          description: Usage start constraint.
          enum:
          - VARIABLE
          - FIXED
          - FIXED_WINDOW
        usageTrigger:
          type: string
          description: Usage trigger.
          enum:
          - START_OF_PERIOD
          - START_OUT_BOUND_RIDE
          - END_OUT_BOUND_RIDE
          - START_RETURN_RIDE
          - PURCHASE
          - SPECIFIED_START_DATE
          - FULFILMENT
          - DAY_OFFSET_BEFORE_CALENDAR_PERIOD
        usageValidityType:
          type: string
          description: Usage validity type.
          enum:
          - SINGLE_RIDE
          - SINGLE_TRIP
          - RETURN_TRIP
          - CARNET
          - DAY_PASS
          - WEEKLY_PASS
          - WEEKEND_PASS
          - MONTHLY_PASS
          - SEASON_TICKET
          - PROFILE_MEMBERSHIP
          - OPEN_ENDED
          - OTHER
        usageValidityTypes:
          type: array
          description: Usage validity type list.
          items:
            type: string
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: UsageValidityPeriod version.
          examples:
          - NSB:Version:V1
      description: A UsageValidityPeriod response
    FareTableRef:
      type: object
      properties:
        nameOfRefClass:
          type: string
        ref:
          type: string
        version:
          type: string
    LimitingRule:
      required:
      - changed
      - created
      - fareFrameRef
      - id
      - modification
      - nameOfClass
      - status
      type: object
      properties:
        canBeCumulative:
          type: boolean
          description: CanBeCumulative.
        changed:
          type: string
          description: Changed datetime.
          readOnly: true
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
          description: Created datetime.
          readOnly: true
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        description:
          type: array
          description: Description.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        discountAsPercentage:
          type: number
          description: DiscountAsPercentage.
          format: float
        discountAsValue:
          type: number
          description: DiscountAsValue.
          format: float
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
        maximumPrice:
          type: string
          description: MaximumPrice.
          examples:
          - '164.0'
        maximumPriceAsPercentage:
          type: number
          description: MaximumPriceAsPercentage.
          format: double
        minimumLimitPrice:
          type: string
          description: MinimumLimitPrice.
          examples:
          - '164.0'
        minimumPrice:
          type: string
          description: MinimumPrice.
          examples:
          - '164.0'
        modification:
          type: string
          description: Modification status.
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - LimitingRule
        status:
          type: string
          description: Status.
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
