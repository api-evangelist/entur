openapi: 3.2.0
info:
  title: Entur Collections API
  version: 2026.10.0
  contact:
    name: Team Selgerintegrasjoner
    url: https://github.com/entur/omsa
  x-stability-level: draft
  description: 'Operations tagged collections across 2 of this provider''s published API definitions: entur-omsa-openapi.json, entur-omsa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.entur.io/omsa/v1
  description: Production environment
- url: https://api.dev.entur.io/omsa/v1
  description: Development environment
- url: https://api.staging.entur.io/omsa/v1
  description: Staging environment
tags:
- name: Collections
  description: Collection endpoints for retrieving resources and query results.
paths:
  /collections/assets/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List assets for package or leg
      description: Retrieves asset information for a package, optionally filtered by leg.
      operationId: assetCollectionHandler
      parameters:
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/legId'
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/bbox'
      responses:
        '200':
          $ref: '#/components/responses/geojsonResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - OpenData: []
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/ancillaries/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List ancillaries for package or leg
      description: Retrieves ancillary products for a package, optionally filtered by leg.
      operationId: ancillariesCollectionHandler
      parameters:
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/legId'
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          $ref: '#/components/responses/ancillariesResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - OpenData: []
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/change-options/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List available change options
      description: Retrieves available change options for a package.
      operationId: changeOptionHandler
      parameters:
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/optionalLegId'
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/EnturDistributionChannelHeaderRequired'
      - $ref: '#/components/parameters/EnturPOSHeaderRequired'
      responses:
        '200':
          $ref: '#/components/responses/changeOptionsResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - OpenData: []
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/refund-options/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List available refund options
      description: Retrieves available refund options for a package.
      operationId: refundOptionHandler
      parameters:
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/optionalLegId'
      - $ref: '#/components/parameters/optionalTravellerId'
      - $ref: '#/components/parameters/optionalAncillaryId'
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/EnturDistributionChannelHeaderRequired'
      responses:
        '200':
          $ref: '#/components/responses/refundOptionsResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - OpenData: []
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/travel-documents/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List travel documents for package
      description: Retrieves travel documents for a package with optional status filtering.
      operationId: traveldocumentsCollectionHandler
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/EnturDistributionChannelHeaderRequired'
      - $ref: '#/components/parameters/EnturPOSHeaderRequired'
      - $ref: '#/components/parameters/packageId'
      - $ref: '#/components/parameters/optionalLegId'
      - name: status
        in: query
        description: Filter travel documents by status
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/travelDocumentStatus'
      responses:
        '200':
          $ref: '#/components/responses/travelDocumentResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - OpenData: []
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/datasources/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List configured external data sources
      description: Retrieves all datasources
      operationId: getDataSources
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          $ref: '#/components/responses/dataSourceResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - OpenData: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/packages/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List purchased packages
      description: Returns a paginated list of packages belonging to the authenticated user.
      operationId: packageCollectionHandler
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/optionalPackageId'
      - $ref: '#/components/parameters/optionalPackageOwnerCustomerId'
      - $ref: '#/components/parameters/optionalPackageContactCustomerId'
      - $ref: '#/components/parameters/optionalPackageBalance'
      - $ref: '#/components/parameters/optionalPackageCreatedAt'
      - $ref: '#/components/parameters/optionalPackageCurrency'
      - $ref: '#/components/parameters/optionalPackageDatedServiceJourneyId'
      - $ref: '#/components/parameters/optionalPackageDistributionChannelId'
      - $ref: '#/components/parameters/optionalPackageEndTime'
      - $ref: '#/components/parameters/optionalPackageExternalReference'
      - $ref: '#/components/parameters/optionalPackageFromStopPlaceId'
      - $ref: '#/components/parameters/optionalPackageLastConfirmedAt'
      - $ref: '#/components/parameters/optionalPackageOrderBy'
      - $ref: '#/components/parameters/optionalPackageLegExternalReference'
      - $ref: '#/components/parameters/optionalPackageLegId'
      - $ref: '#/components/parameters/optionalPackageOrganisationId'
      - $ref: '#/components/parameters/optionalPackageOriginalDatedServiceJourneyId'
      - $ref: '#/components/parameters/optionalPackagePos'
      - $ref: '#/components/parameters/optionalPackageReservationId'
      - $ref: '#/components/parameters/optionalPackageProductId'
      - $ref: '#/components/parameters/optionalPackageFareProductVersion'
      - $ref: '#/components/parameters/optionalPackageServiceJourneyId'
      - $ref: '#/components/parameters/optionalPackageSortBy'
      - $ref: '#/components/parameters/optionalPackageStartTime'
      - $ref: '#/components/parameters/optionalPackageToStopPlaceId'
      - $ref: '#/components/parameters/optionalPackageTotalAmount'
      - $ref: '#/components/parameters/optionalPackageTotalTaxAmount'
      - $ref: '#/components/parameters/optionalPackageVersion'
      - name: status
        in: query
        description: Filter packages by their lifecycle status (e.g. CONFIRMED, CANCELLED)
        required: false
        style: form
        explode: true
        schema:
          $ref: '#/components/schemas/packageStatus'
      responses:
        '200':
          $ref: '#/components/responses/packageCollectionResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/packages/items/{packageId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: Get package by ID
      description: Retrieves a single package by identifier.
      operationId: getPackage
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - name: packageId
        in: path
        description: The unique identifier of the package to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/packageResponse'
        '404':
          $ref: '#/components/responses/errorResponse'
      security:
      - BearerAuth: []
      - OAuth: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/customers/items:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: List customers with filters
      description: Retrieve customers with optional filters and pagination.
      operationId: customerCollectionHandler
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/optionalCustomerId'
      - $ref: '#/components/parameters/optionalCustomerExternalReference'
      - $ref: '#/components/parameters/optionalCustomerFirstName'
      - $ref: '#/components/parameters/optionalCustomerLastName'
      - $ref: '#/components/parameters/optionalCustomerEmail'
      - $ref: '#/components/parameters/optionalCustomerPhoneNumber'
      responses:
        '200':
          $ref: '#/components/responses/customerCollectionResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    post:
      tags:
      - Collections
      summary: Create customer record
      description: Create a customer record that can be used for purchases.
      operationId: createCustomerHandler
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customerInput'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/customerResponse'
        '201':
          $ref: '#/components/responses/customerResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
  /collections/customers/items/{customerId}:
    parameters:
    - $ref: '#/components/parameters/customerId'
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Collections
      summary: Get customer by ID
      description: Retrieves a single customer by identifier.
      operationId: getCustomerHandler
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      responses:
        '200':
          $ref: '#/components/responses/customerResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    put:
      tags:
      - Collections
      summary: Replace customer record
      description: Replace the customer record.
      operationId: updateCustomerHandler
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customerInput'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/customerResponse'
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    delete:
      tags:
      - Collections
      summary: Delete customer record
      description: Delete the customer record.
      operationId: deleteCustomerHandler
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - $ref: '#/components/parameters/authorization'
      responses:
        '204':
          description: Customer deleted successfully
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - BearerAuth: []
      - OAuth: []
      - OAuthPKI: []
    servers:
    - url: https://api.entur.io/omsa/v1
      description: Production environment
    - url: https://api.dev.entur.io/omsa/v1
      description: Development environment
    - url: https://api.staging.entur.io/omsa/v1
      description: Staging environment
components:
  parameters:
    optionalPackageOwnerCustomerId:
      name: customerId
      in: query
      description: optional owner customer identifier filter (maps to Orders createdBy, exact match only)
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/customerReference'
    optionalCustomerId:
      name: customerId
      in: query
      description: optional customer identifier filter
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/customerReference'
    legId:
      name: legId
      in: query
      description: leg identifier
      required: true
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/legReference'
    authorization:
      name: authorization
      in: header
      description: Header field, JWT must be supplied
      required: true
      style: simple
      explode: false
      schema:
        type: string
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    optionalPackageProductId:
      name: productId
      in: query
      description: optional package product ID filter, mapped to Orders fareProductId
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageBalance:
      name: balance
      in: query
      description: optional package balance filter, passed through to Orders balance filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageOriginalDatedServiceJourneyId:
      name: originalDatedServiceJourneyId
      in: query
      description: optional package original dated service journey ID filter, passed through to Orders originalDatedServiceJourneyId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageTotalTaxAmount:
      name: totalTaxAmount
      in: query
      description: optional package total tax amount filter, passed through to Orders totalTaxAmount filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageFromStopPlaceId:
      name: fromStopPlaceId
      in: query
      description: optional package from stop place ID filter, passed through to Orders fromStopPlaceId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageCreatedAt:
      name: createdAt
      in: query
      description: optional package created-at filter, passed through to Orders createdAt filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageContactCustomerId:
      name: contactCustomerId
      in: query
      description: optional contact customer identifier filter (maps to Orders contact, exact match only)
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/customerReference'
    limit:
      name: limit
      in: query
      description: 'The optional limit parameter limits the number of items that are presented in the response document.

        Only items are counted that are on the first level of the collection in the response document.

        Nested objects contained within the explicitly requested items shall not be counted. Minimum = 1. Maximum = 10000. Default = 100.'
      required: false
      style: form
      explode: false
      schema:
        maximum: 10000
        minimum: 1
        type: integer
        default: 100
    optionalPackageVersion:
      name: version
      in: query
      description: optional package version filter, passed through to Orders version filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalAncillaryId:
      name: ancillaryId
      in: query
      description: ancillary identifier
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/externalReference'
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
    optionalLegId:
      name: legId
      in: query
      description: leg identifier
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/legReference'
    optionalPackageFareProductVersion:
      name: fareProductVersion
      in: query
      description: optional package fare product version filter, passed through to Orders fareProductVersion filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalCustomerPhoneNumber:
      name: phoneNumber
      in: query
      description: optional phone number filter
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/normalString'
    optionalPackageToStopPlaceId:
      name: toStopPlaceId
      in: query
      description: optional package to stop place ID filter, passed through to Orders toStopPlaceId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageLastConfirmedAt:
      name: lastConfirmedAt
      in: query
      description: optional package last-confirmed-at filter, passed through to Orders lastConfirmedAt filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageDistributionChannelId:
      name: distributionChannelId
      in: query
      description: optional package distribution channel ID filter, passed through to Orders distributionChannelId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    EnturPOSHeaderRequired:
      name: Entur-POS
      in: header
      description: Point-of-sale identifier used by downstream sales and ticket distribution services.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    optionalCustomerFirstName:
      name: firstName
      in: query
      description: optional first name filter
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/shortString'
    optionalPackageServiceJourneyId:
      name: serviceJourneyId
      in: query
      description: optional package service journey ID filter, passed through to Orders serviceJourneyId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageDatedServiceJourneyId:
      name: datedServiceJourneyId
      in: query
      description: optional package dated service journey ID filter, passed through to Orders datedServiceJourneyId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageSortBy:
      name: sortBy
      in: query
      description: optional package sort direction (ASC or DESC), passed through to Orders sortBy
      required: false
      style: form
      explode: true
      schema:
        type: string
    optionalPackageLegExternalReference:
      name: legExternalReference
      in: query
      description: optional package leg external reference filter, mapped to Orders orderLineExternalReference
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageEndTime:
      name: endTime
      in: query
      description: optional package end-time filter, passed through to Orders endTime filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageCurrency:
      name: currency
      in: query
      description: optional package currency filter, passed through to Orders currency filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    packageId:
      name: packageId
      in: query
      description: the identifier of a package
      required: true
      style: form
      explode: true
      schema:
        type: string
    optionalPackageOrderBy:
      name: orderBy
      in: query
      description: optional package orderBy value, passed through to Orders orderBy
      required: false
      style: form
      explode: true
      schema:
        type: string
    customerId:
      name: customerId
      in: path
      description: customer identifier
      required: true
      style: simple
      explode: false
      schema:
        $ref: '#/components/schemas/customerReference'
    optionalPackageOrganisationId:
      name: organisationId
      in: query
      description: optional package organisation ID filter, passed through to Orders organisationId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalPackageReservationId:
      name: reservationId
      in: query
      description: optional package reservation ID filter, passed through to Orders reservationId filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    offset:
      name: offset
      in: query
      description: 'The optional offset parameter representing the starting index of the returned collection.

        Only items are counted that are on the first level of the collection in the response document.

        Nested objects contained within the explicitly requested items shall not be counted.

        Default = 0.'
      required: false
      style: form
      explode: false
      schema:
        minimum: 0
        type: integer
        default: 0
    optionalPackageLegId:
      name: legId
      in: query
      description: optional package leg identifier filter, mapped to Orders orderLineId
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalCustomerEmail:
      name: email
      in: query
      description: optional email filter
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/normalString'
    optionalPackageStartTime:
      name: startTime
      in: query
      description: optional package start-time filter, passed through to Orders startTime filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    acceptLanguage:
      name: Accept-Language
      in: header
      required: true
      style: simple
      explode: false
      schema:
        $ref: '#/components/schemas/shortString'
      x-externalDocs:
        description: A comma-separated list of BCP 47 (RFC 5646) language tags and optional weights as described in IETF RFC7231 section 5.3.5. A list of the languages/localizations the user would like to see the results in. For user privacy and ease of use on the TO side, this list should be kept as short as possible
    optionalPackagePos:
      name: pos
      in: query
      description: optional package POS filter, passed through to Orders pos filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    bbox:
      name: bbox
      in: query
      description: 'Only features that have a geometry that intersects the bounding box are selected. The bounding box is provided as four or six numbers, depending on whether the coordinate reference system includes a vertical axis (height or depth): * Lower left corner, coordinate axis 1 * Lower left corner, coordinate axis 2 * Minimum value, coordinate axis 3 (optional) * Upper right corner, coordinate axis 1 * Upper right corner, coordinate axis 2 * Maximum value, coordinate axis 3 (optional)

        If the value consists of four numbers, the coordinate reference system is WGS 84 longitude/latitude (http://www.opengis.net/def/crs/OGC/1.3/CRS84)

        unless a different coordinate reference system is specified in the parameter `bbox-crs`.

        If the value consists of six numbers, the coordinate reference system is WGS 84 longitude/latitude/ellipsoidal height (http://www.opengis.net/def/crs/OGC/0/CRS84h) unless a different coordinate reference system is specified in the parameter `bbox-crs`.

        The query parameter `bbox-crs` is specified in OGC API - Features - Part 2: Coordinate Reference Systems by Reference.

        For WGS 84 longitude/latitude the values are in most cases the sequence of minimum longitude, minimum latitude, maximum longitude and maximum latitude.

        However, in cases where the box spans the antimeridian the first value (west-most box edge) is larger than the third value (east-most box edge).

        If the vertical axis is included, the third and the sixth number are the bottom and the top of the 3-dimensional bounding box.

        If a feature has multiple spatial geometry properties, it is the decision of the server whether only a single spatial geometry property is used to determine the extent or all relevant geometries.'
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: number
    optionalPackageExternalReference:
      name: externalReference
      in: query
      description: optional package external reference filter, passed through to Orders externalReference filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    EnturDistributionChannelHeaderRequired:
      name: Entur-Distribution-Channel
      in: header
      description: Distribution channel identifier used by downstream sales and ticket distribution services.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    optionalPackageId:
      name: packageId
      in: query
      description: the identifier of a package (maps to Orders id)
      required: false
      style: form
      explode: true
      schema:
        type: string
    optionalTravellerId:
      name: travellerId
      in: query
      description: traveller identifier
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/travellerReference'
    optionalCustomerLastName:
      name: lastName
      in: query
      description: optional last name filter
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/shortString'
    optionalPackageTotalAmount:
      name: totalAmount
      in: query
      description: optional package total amount filter, passed through to Orders totalAmount filter
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    optionalCustomerExternalReference:
      name: externalReference
      in: query
      description: optional filter on the client's own customer reference
      required: false
      style: form
      explode: true
      schema:
        maxLength: 40
        type: string
