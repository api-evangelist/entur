        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        exception:
          type: string
        error:
          type: string
        message:
          type: string
        path:
          type: string
      required:
      - detail
      - error
      - exception
      - instance
      - message
      - path
      - status
      - timestamp
      - title
      - type
    Notification:
      type: object
      properties:
        originOperator:
          type: string
        message:
          type:
          - string
          - 'null'
      required:
      - originOperator
  securitySchemes:
    Authorization:
      type: http
      description: Authorization header
      scheme: bearer
