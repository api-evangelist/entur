  /bookings/leg/{transportOperatorLegId}/event:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - SharedMobilityInternal
      description: Change the leg event for a one-stop booking
      operationId: updateBookingWithLegsIdEventsPost
      parameters:
      - name: Operator-Id
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: transportOperatorLegId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: oneStopState
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - PREPARE
          - START
          - PAUSE
          - RESUME
          - START_FINISHING
          - FINISH
          - CANCEL
      responses:
        '400':
          description: Invalid request data
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Insufficient permissions
          content:
