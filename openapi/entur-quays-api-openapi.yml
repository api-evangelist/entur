            name: Latitude
        longitude:
          type: number
          xml:
            name: Longitude
        pos:
          $ref: '#/components/schemas/DirectPositionType'
          xml:
            namespace: http://www.opengis.net/gml/3.2
        precision:
          type: number
          xml:
            name: Precision
        srsName:
          type: string
          xml:
            attribute: true
    TypeOfZoneRefStructure:
      type: object
      properties:
        changed:
