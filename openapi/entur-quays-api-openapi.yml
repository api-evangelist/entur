            attribute: true
        derivedFromVersionRef_BasicModificationDetailsGroup:
          type: string
          xml:
            name: derivedFromVersionRef
            attribute: true
        description:
          $ref: '#/components/schemas/MultilingualString'
          xml:
            name: Description
        extensions:
          $ref: '#/components/schemas/ExtensionsStructure'
          xml:
            name: Extensions
        fromDate:
          type: string
          format: date-time
          xml:
            name: FromDate
        id:
          type: string
          xml:
            attribute: true
        keyList:
          $ref: '#/components/schemas/KeyListStructure'
        modification:
          type: string
          enum:
          - NEW
          - REVISE
          - DELETE
          - UNCHANGED
          - DELTA
          xml:
            attribute: true
        name:
          $ref: '#/components/schemas/MultilingualString'
          xml:
            name: Name
        nameOfClass:
          type: string
          xml:
            attribute: true
        publication:
          type: string
          enum:
          - PUBLIC
          - RESTRICTED
          - PRIVATE
          - CONFIDENTIAL
          - AUTHORISED
          - TEST
          xml:
            attribute: true
        responsibilitySetRef:
          type: string
          xml:
            attribute: true
        status_BasicModificationDetailsGroup:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - OTHER
          xml:
