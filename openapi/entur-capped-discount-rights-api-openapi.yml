openapi: 3.2.0
info:
  title: Products Capped Discount Rights API
  description: This API provides services to read and maintain products and fare data for public transport in Norway.
  version: 2026.10.0
servers:
- url: https://api.entur.io/products
  description: Production environment
- url: https://api.staging.entur.io/products
  description: Staging environment
- url: https://api.dev.entur.io/products
  description: Development environment
security:
- jwt: []
tags:
- name: capped-discount-rights
paths:
  /capped-discount-rights:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - capped-discount-rights
      summary: Retrieves a capped discount right, filtered by given parameter(s)
      operationId: capped-discount-rights_getAll
      parameters:
      - name: orgId
        in: query
        description: The unique id to identify a organisation
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: fareFrameId
        in: query
        description: The unique id to identify data owned by organisation
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: languageCode
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: gpaDataSet
        in: query
        description: 'Deprecated: this parameter is ignored. Only E-variant GPAs are returned.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: statusFilter
        in: query
        description: 'Filter by status. Allowed values: DRAFT, PROPOSED, VERSIONED, DEPRECATED, ALL. Mutually exclusive with validOnDate.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        examples:
          default:
            value:
            - DRAFT
            - PROPOSED
      - name: validOnDate
        in: query
        description: 'Return the CappedDiscountRights valid on this date, example: 2024-06-01T00:00:00Z. Note that, if called in the production environment, only VERSIONED CappedDiscountRights are returned. And in the staging environment, PROPOSED CappedDiscountRights are preferred to VERSIONED ones. Mutually exclusive with statusFilter.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: language
        in: query
        description: The unique id for the language
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Used to make conditional requests. It allows the client to provide an ETag value, and the server will process the request only if the ETag does not match the current version of the resource.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CappedDiscountRight'
        '304':
          description: Not Modified
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:les
    post:
      tags:
      - capped-discount-rights
      summary: Create a capped discount right
      operationId: capped-discount-rights_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CappedDiscountRightInsert'
        required: true
      responses:
        '204':
          description: Entity created successfully
        '400':
          description: Validation errors
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                type: string
        '409':
          description: Already registered
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:endre
  /capped-discount-rights/{id}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - capped-discount-rights
      summary: Retrieves a capped discount right by id.
      operationId: capped-discount-rights_getById
      parameters:
      - name: id
        in: path
        description: The unique id to identify the capped discount right
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: version
        in: query
        description: The id of the version of the capped discount right
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: languageCode
        in: query
        description: The language code from ISO-639-3
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: gpaDataSet
        in: query
        description: 'Deprecated: this parameter is ignored. Only E-variant GPAs are returned.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: findActiveInEnvironment
        in: query
        description: 'Deprecated: this parameter is ignored. The endpoint now returns the version valid today (environment-aware) by default.'
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          type: boolean
      - name: validOnDate
        in: query
        description: Return the version valid on the given date (ISO-8601). Overrides 'version'. In prod returns the VERSIONED element; in staging/dev PROPOSED is preferred over VERSIONED.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: If-None-Match
        in: header
        description: Used to make conditional requests. It allows the client to provide an ETag value, and the server will process the request only if the ETag does not match the current version of the resource.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappedDiscountRight'
        '304':
          description: Not Modified
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:les
  /capped-discount-rights/{id}/{version}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - capped-discount-rights
      summary: Retrieves a capped discount right by id and version
      operationId: capped-discount-rights_getByIdAndVersion
      parameters:
      - name: id
        in: path
        description: The unique id to identify the capped discount right
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
      - name: version
        in: path
        description: The id of the version of the capped discount right
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
      - name: gpaDataSet
        in: query
        description: 'Deprecated: this parameter is ignored. Only E-variant GPAs are returned.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: The language code from ISO-639-3
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Used to make conditional requests. It allows the client to provide an ETag value, and the server will process the request only if the ETag does not match the current version of the resource.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CappedDiscountRight'
        '304':
          description: Not Modified
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:les
    put:
      tags:
      - capped-discount-rights
      summary: Update a capped discount right
      operationId: capped-discount-rights_update
      parameters:
      - name: id
        in: path
        description: The unique id to identify the capped discount right
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
      - name: version
        in: path
        description: The id of the version of the capped discount right
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CappedDiscountRightInsert'
        required: true
      responses:
        '204':
          description: Entity updated successfully
        '400':
          description: Validation errors
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                type: string
        '409':
          description: Already registered
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:endre
components:
  schemas:
    VersionOfObjectRef:
      required:
      - nameOfClass
      - ref
      - version
      type: object
      properties:
        nameOfClass:
          minLength: 1
          type: string
          description: Name of class.
        ref:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: The netex id reference to the object.
        version:
          type: string
          description: Version.
      description: Fare frame ref.
    FarePrice:
      required:
      - changed
      - created
      - fareFrameRef
      - id
      - modification
      - nameOfClass
      - status
      type: object
      properties:
        amount:
          type: string
          description: Amount
          examples:
          - '164.0'
        canBeCumulative:
          type: boolean
          description: canBeCumulative.
          examples:
          - true
        changed:
          type: string
          description: Changed datetime.
          readOnly: true
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
          description: Created datetime.
          readOnly: true
        currency:
          type: string
          description: Currency.
          examples:
          - NOK
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        discountPercentageUsed:
          maximum: 100
          minimum: -100
          type: integer
          description: discountPercentageUsed.
          format: int32
          examples:
          - 5
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          type: string
          description: Id.
          examples:
          - NSB:FarePrice:1005TEN
        isAllowed:
          type: boolean
          description: isAllowed.
          examples:
          - true
        limitingRule:
          $ref: '#/components/schemas/LimitingRule'
        modification:
          type: string
          description: Modification status.
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - FarePrice
        ranking:
          type: integer
          description: Ranking.
          format: int32
          examples:
          - 1
        rounding:
          $ref: '#/components/schemas/Rounding'
        roundingRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        status:
          type: string
          description: Status.
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        vatRegisterGroup:
          type: string
          description: vatRegisterGroup.
          enum:
          - EXCEPTION_FROM_VAT
          - GENERAL_VAT
          - FOOD_VAT
          - TRANSPORT_AND_TICKETS_VAT
          examples:
          - TRANSPORT_AND_TICKETS_VAT
        version:
          type: string
          description: Version.
          readOnly: true
          examples:
          - NSB:Version:V1
      description: A description of the price and factor for a set fare
    GenericParameterAssignment:
      required:
      - changed
      - created
      - fareFrameRef
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        canIgnoreInOffering:
          type: boolean
          description: Indicates whether gpa leaf node is supposed to be ignored when generating offer.
          examples:
          - true
        changed:
          type: string
          description: Changed datetime.
        chargingBasisType:
          type: string
          description: ChargingBasisType.
          enum:
          - FREE
          - DISCOUNTED
          - NORMAL
          - ANY
          examples:
          - FREE
        comparisonOperatorVariant:
          type: string
          description: 'Deprecated: this parameter will be ignored'
          examples:
          - E
        compatibleWithVersionRef:
          type: string
          description: CompatibleWithVersionRef.
          examples:
          - NSB:Version:V1
        created:
          type: string
          description: Created datetime.
        derivedFromVersionRef:
          type: string
          description: Derived from version.
          examples:
          - NSB:Version:V1
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        fareProductRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        fareStructureElementRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:GenericParameterAssignment:AllowedOperators
        includes:
          type: array
          description: Includes genericParameterAssignments.
          items:
            $ref: '#/components/schemas/GenericParameterAssignment'
        includesGroupingType:
          type: string
          description: Includes grouping type.
          enum:
          - AND
          - OR
          - XOR
          - NOT
          examples:
          - AND
        limitationGroupingType:
          type: string
          description: Limitation grouping type.
          enum:
          - AND
          - OR
          - XOR
          - NOT
          examples:
          - AND
        limitations:
          type: array
          description: Limitations as UsageParameters.
          items:
            $ref: '#/components/schemas/VersionOfObjectRef'
        modification:
          type: string
          description: Modification status.
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class
          examples:
          - GenericParameterAssignment
        parentParameterAssignmentRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        requiredElements:
          type: array
          description: Required elements.
          items:
            type: string
        requiredInContext:
          type: string
          description: Required in context.
          enum:
          - OFFERING
          - BOOKING
          - RESERVATION
          - SALE
          - FULFILMENT
          - ACTIVATION
          - CONSUMPTION
          - REVALIDATION
        requiredType:
          type: string
          description: Required type.
          enum:
          - SERVICE_JOURNEY_REF
          - TARIFF_ZONE_REF
          - PASSENGER_SEAT_REF
          - USER_PROFILE_REF
          - USAGE_VALIDITY_PERIOD_REF
          - DATED_SERVICE_JOURNEY_REF
          - DYNAMIC_DISTANCE_MATRIX_ELEMENT
          - USAGE_VALIDITY_PERIOD
          - DISTANCE_MATRIX_ELEMENT_REF
          - SCHEDULED_STOP_POINT_REF
          - GROUP_TICKET_REF
          - GROUP_TICKET
          - GROUP_OF_TARIFF_ZONES_REF
          - FARE_ZONE_REF
          examples:
          - SERVICE_JOURNEY_REF
        salesPackageRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        status:
          type: string
          description: Status
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        temporalValidityParameters:
          type: array
          description: Temporal validity parameter.
          items:
            $ref: '#/components/schemas/TemporalValidityParameter'
        typeOfAccessRightAssignment:
          $ref: '#/components/schemas/TypeOfAccessRightAssignment'
        validableElementRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        validityParameterAssignmentType:
          type: string
          description: Validity parameter assignment type.
          enum:
          - EQ
          - NE
          - GT
          - LT
          - GE
          - LE
          examples:
          - EQ
        validityParameterGroupingType:
          type: string
          description: Validity parameter grouping type.
          enum:
          - AND
          - OR
          - XOR
          - NOT
          examples:
          - AND
        validityParameterSetSelectionType:
          type: string
          description: Validity parameter set operator.
          enum:
          - ONE_OF_ANY_ONE_SET
          - ONE_OF_EACH_SET
          - SOME_OF_ANY_SET
          - ALL_OF_ONE_SET
          - ALL_OF_ALL_SETS
        validityParameters:
          type: array
          description: Validity parameters as scoping validity parameters
          items:
            $ref: '#/components/schemas/ScopingValidityParameter'
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version
          examples:
          - NSB:Version:V2
      description: A GenericParameterAssignment
    TypeOfFareProduct:
      required:
      - changed
      - created
      - fareFrameRef
      - id
      - nameOfClass
      - version
      type: object
      properties:
        changed:
          type: string
          description: Changed datetime.
          readOnly: true
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
          description: Created datetime.
          readOnly: true
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:TypeOfFareProduct:Ordinary
        modification:
          type: string
          description: Modification status.
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - TypeOfFareProduct
        status:
          type: string
          description: Type of fare product status.
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Type of fare product version.
          examples:
          - NSB:Version:V1
      description: A classification of FARE PRODUCTs.
    FarePriceInsert:
      required:
      - fareFrameRef
      - id
      - name
      type: object
      properties:
        amount:
          type: string
          description: Amount.
          examples:
          - '164.0'
        canBeCumulative:
          type: boolean
          description: canBeCumulative.
          examples:
          - true
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        currency:
          type: string
          description: Currency.
          examples:
          - NOK
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        discountPercentageUsed:
          type: integer
          description: discountPercentageUsed.
          format: int32
          examples:
          - 5
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:FarePrice:1005TEN
        isAllowed:
          type: boolean
          description: isAllowed.
          examples:
          - true
        limitingRule:
          $ref: '#/components/schemas/LimitingRule'
        name:
          type: array
          description: Name.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        ranking:
          type: integer
          description: Ranking.
          format: int32
          examples:
          - 1
        rounding:
          $ref: '#/components/schemas/RoundingInsert'
        roundingRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        vatRegisterGroup:
          type: string
          description: vatRegisterGroup.
          enum:
          - EXCEPTION_FROM_VAT
          - GENERAL_VAT
          - FOOD_VAT
          - TRANSPORT_AND_TICKETS_VAT
          examples:
          - TRANSPORT_AND_TICKETS_VAT
        version:
          type: string
    GroupOfTimeBands:
      required:
      - changed
      - created
      - id
      - members
      - modification
      - nameOfClass
      - status
      - validityConditions
      type: object
      properties:
        changed:
          type: string
          description: Changed datetime.
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
