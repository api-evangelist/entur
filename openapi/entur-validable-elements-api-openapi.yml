    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - validable-elements
      summary: Retrieves validable elements by id and latest version
      operationId: validable-elements_getById
      parameters:
      - name: id
        in: path
        description: The unique id to identify a validable element
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: version
        in: query
        description: The id of the version of the given validable element
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: languageCode
        in: query
        description: The language code from ISO-639-3
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: gpaDataSet
        in: query
        description: 'Deprecated: this parameter is ignored. Only E-variant GPAs are returned.'
