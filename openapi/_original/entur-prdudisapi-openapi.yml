  /fare-zones/distances/stops:
    post:
      tags:
      - Fare Zone
      summary: Return zone distance between two stop places
      description: Resolves stop places to coordinates, then determines which overlapping fare zones each stop belongs to. Because a stop place can belong to multiple overlapping fare zones, all zone combinations are evaluated and one result per combination is returned. The request does support mixing zones into the stop places. If only doing zones the recommended url is /fare-zones/distances/zones as it is faster
      operationId: findFromToWithStopPlaces
      requestBody:
        description: Ordered list of stop place IDs, with optional preOwned zones and organisation filter
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonalStopPlaceDistanceRequest'
        required: true
      responses:
        '200':
          description: OK
