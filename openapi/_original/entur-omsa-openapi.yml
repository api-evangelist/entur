    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
  /processes/{processID}:
    get:
      tags:
      - discovery
      summary: Get process description
      description: 'The process description contains information about inputs and outputs and a link to the execution-endpoint for the process. The Core does not mandate the use of a specific process description to specify the interface of a process. That said, the Core requirements class makes the following recommendation: Implementations SHOULD consider supporting the OGC process description. For more information, see [Section 7.10](https://docs.ogc.org/is/18-062/18-062.html#sc_process_description).

        '
      operationId: getProcessDescription
      parameters:
      - $ref: '#/components/parameters/acceptLanguage'
      - name: processID
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - search-offers
          - select-offers
          - add-traveller
          - update-traveller
          - remove-traveller
          - assign-asset
          - assign-ancillary
          - purchase-offers
          - purchase-package
          - confirm-package
          - release-package
          - extend-expiry-time
          - update-travel-document-validity
          - cancel-package
          - claim-refund-option
          - confirm-refund-option
      responses:
        '200':
          description: A process description.
          headers:
            Content-Language:
              $ref: '#/components/headers/contentLanguage'
            Version:
              $ref: '#/components/headers/version'
          content:
            application/json:
              schema:
                type: object
                externalDocs:
                  url: https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/schemas/processes-core/process.yaml
        default:
          $ref: '#/components/responses/errorResponse'
      security:
      - OpenData: []
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
  /oauth/token:
    post:
      tags:
      - authentication
      summary: Issue OAuth access token
      description: This endpoint is used to obtain an access token and optionally an ID token through different OAuth 2.0 grant types, including Client Credentials Flow. Whenever the mTLS flow is taken, the properties will be ignored, and the access token will be generated based on the credentials in the certificate (O or CN).
      operationId: oauthTokenPost
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - grant_type
              type: object
              properties:
                grant_type:
                  type: string
                  description: 'The grant type: ''client_credentials'', ''password'', or ''refresh_token''.'
                  default: client_credentials
                  enum:
                  - client_credentials
                  - password
                  - refresh_token
                username:
                  type: string
                  description: The username
                password:
                  type: string
                  description: The password
                client_id:
                  type: string
                  description: The client ID (Client Credentials Flow)
                client_secret:
                  type: string
                  description: The client secret (Client Credentials Flow)
        required: true
      responses:
        '200':
          description: Successful token issuance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The issued access token.
                  refresh_token:
                    type: string
                    description: The optional refresh token.
                  token_type:
                    type: string
                    description: The type of the token.
                    default: Bearer
                  expires_in:
                    type: integer
                    description: The lifetime of the access token in seconds.
        '400':
          description: 'Bad Request: Invalid request or wrong grant type.'
        '401':
          description: 'Unauthorized: Invalid client ID or secret.'
        '500':
          description: 'Internal Server Error: Something went wrong.'
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
components:
  schemas:
    subscriber:
      required:
      - successUrl
      type: object
      properties:
        successUri:
          type: string
          format: uri
        inProgressUri:
          type: string
          format: uri
        failedUri:
          type: string
          format: uri
      description: 'Optional URIs for callbacks for this job.


        Support for this parameter is not required and the parameter may be

        removed from the API definition, if conformance class **''callback''**

        is not listed in the conformance declaration under `/conformance`.'
      externalDocs:
        url: https://github.com/opengeospatial/ogcapi-processes/raw/refs/heads/master/openapi/schemas/processes-core/subscriber.yaml
    confClasses:
      required:
      - conformsTo
      type: object
      properties:
        conformsTo:
          type: array
          items:
            type: string
            examples:
            - http://www.opengis.net/spec/ogcapi-processes-1/1.0/conf/core
    searchOfferInput:
      required:
      - type
      type: object
      properties:
        type:
          pattern: ^(search_offer)
          type: string
        specification:
          allOf:
          - $ref: '#/components/schemas/travelSpecification'
          - $ref: '#/components/schemas/placeDefinitions'
        filters:
          type: array
          description: Request-wide predicates that every returned offer must satisfy.
          items:
            $ref: '#/components/schemas/searchOfferFilter'
        pattern:
          $ref: '#/components/schemas/tripPattern'
        packageToExchange:
          $ref: '#/components/schemas/packageReference'
        travellers:
          maxItems: 10
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/individualTraveller'
        profiles:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/userProfile'
        travellingAssets:
          type: array
          items:
            $ref: '#/components/schemas/travellingAsset'
        entur:
          $ref: '#/components/schemas/enturSearchOfferInput'
      description: A package planning request, resulting in package options
      anyOf:
      - required:
        - travellers
      - required:
        - profiles
    enturSearchOfferInput:
      type: object
      properties:
        recommendationControl:
          $ref: '#/components/schemas/enturRecommendationControl'
      description: Entur-specific OMSA extensions for search-offers input.
    enturRecommendationType:
      type: string
      description: Entur Offers recommendation category.
      enum:
      - FLEXIBLE
      - SEMI_FLEXIBLE
      - NON_FLEXIBLE
      - CHEAPEST
    enturRecommendationControl:
      type: object
      properties:
        enabled:
          type: boolean
          description: Enable recommendation-driven bundling based on Offers `recommendations` and `offersToBuy`.
          default: false
        types:
          minItems: 1
          type: array
          description: 'Entur recommendation categories to request when `enabled` is true.

            If omitted, the API defaults to `["CHEAPEST", "NON_FLEXIBLE", "SEMI_FLEXIBLE", "FLEXIBLE"]`.

            '
          items:
            $ref: '#/components/schemas/enturRecommendationType'
        stripDuplicates:
          type: boolean
          description: 'Deduplicate recommendation-driven plans by provider offer + traveller groups + ancillary selections + quantity.

            '
          default: false
      description: 'Entur recommendation behavior control for Offers.

        If omitted, the API defaults to raw mode (recommendation-driven bundling disabled).

        '
    selectOffersInput:
      required:
      - offerIds
      - type
      type: object
      properties:
        offerIds:
          type: array
          items:
            $ref: '#/components/schemas/offerReference'
        type:
          pattern: ^(select_offers)
          type: string
        customer:
          $ref: '#/components/schemas/customerRef'
        contact:
          $ref: '#/components/schemas/customerRef'
        externalReference:
          $ref: '#/components/schemas/externalReference'
    packageInput:
      required:
      - packageId
      - type
      type: object
      properties:
        packageId:
          $ref: '#/components/schemas/packageReference'
        type:
          pattern: ^(package)
          type: string
    legInput:
      required:
      - legId
      - packageId
      - type
      type: object
      properties:
        packageId:
          $ref: '#/components/schemas/packageReference'
        type:
          type: string
        offerId:
          $ref: '#/components/schemas/offerReference'
        legId:
          $ref: '#/components/schemas/legReference'
        location:
          $ref: '#/components/schemas/placeReference'
    refundOptionInput:
      required:
      - type
      type: object
      properties:
        type:
          pattern: ^(claim_refund_option|confirm_refund_option)$
          type: string
        optionId:
          $ref: '#/components/schemas/uuid'
    addTravellerInput:
      required:
      - packageId
      - type
      type: object
      properties:
        type:
          pattern: ^(traveller)$
          type: string
        packageId:
          $ref: '#/components/schemas/packageReference'
        individualTraveller:
          $ref: '#/components/schemas/individualTraveller'
        userProfile:
          $ref: '#/components/schemas/userProfile'
        travellingAsset:
          $ref: '#/components/schemas/travellingAsset'
    removeTravellerInput:
      required:
      - packageId
      - travellerId
      - type
      type: object
      properties:
        type:
          pattern: ^(traveller)$
          type: string
        travellerId:
          $ref: '#/components/schemas/travellerReference'
        packageId:
          $ref: '#/components/schemas/packageReference'
    updateTravellerInput:
      required:
      - packageId
      - travellerId
      - type
      type: object
      properties:
        type:
          pattern: ^(traveller)$
          type: string
        packageId:
          $ref: '#/components/schemas/packageReference'
        travellerId:
          $ref: '#/components/schemas/travellerReference'
        individualTraveller:
          $ref: '#/components/schemas/individualTraveller'
        userProfile:
          $ref: '#/components/schemas/userProfile'
        travellingAsset:
          $ref: '#/components/schemas/travellingAsset'
    assetInput:
      allOf:
      - $ref: '#/components/schemas/legInput'
      - required:
        - assetId
        - type
        type: object
        properties:
          type:
            pattern: ^(asset)$
            type: string
          assetId:
            $ref: '#/components/schemas/assetReference'
          replaceAssetId:
            $ref: '#/components/schemas/assetReference'
    ancillaryInput:
