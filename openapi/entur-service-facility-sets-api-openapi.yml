components:
  schemas:
    OnboardStay:
      required:
      - changed
      - created
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        changed:
          type: string
          description: Changed datetime
          readOnly: true
        created:
          type: string
          description: Created datetime
          readOnly: true
        duration:
          type: string
          description: Duration.
          examples:
          - PT24H
        fareClass:
          type: string
          description: Fareclass.
          enum:
          - FIRST_CLASS
          - SECOND_CLASS
          - THIRD_CLASS
          - ECONOMY_CLASS
          - BUSINESS_CLASS
          - TURISTA
          - PREFERENTE
          - STANDARD_CLASS
          - PREMIUM_CLASS
          - ANY
          - UNKNOWN
          examples:
          - FIRST_CLASS
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:OnboardStay:Sleeper
        modification:
          type: string
          description: Modification status
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - OnboardStay
        permission:
          type: string
          description: BoardingPermissionEnum.
          enum:
          - EARLYBOARDINGPOSSIBLEBEFOREDEPARTURE
          - DELAYEDALIGHTINGPOSSIBLEAFTERARRIVAL
          - OVERNIGHTSTAYONBOARDALLOWED
          examples:
          - EARLYBOARDINGPOSSIBLEBEFOREDEPARTURE
        status:
          type: string
          description: Status
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version
          examples:
          - NSB:Version:V1
      description: An OnboardStay
    Accommodation:
      required:
      - changed
      - created
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        accommodationFacility:
          type: string
          description: Accommodation facility.
          enum:
          - SLEEPER
          - SEATING
          - DOUBLE_SLEEPER
          - SINGLE_SLEEPER
          - SPECIAL_SLEEPER
          - COUCHETTE
          - SINGLE_COUCHETTE
          - DOUBLE_COUCHETTE
          - RECLINING_SEAT
          - BABY_COMPARTMENT
          - FAMILY_COMPARTMENT
          - PANORAMA_COACH
          - PULLMAN_COACH
          - STANDING
          examples:
          - SLEEPER
        changed:
          type: string
          description: Changed datetime
          readOnly: true
        created:
          type: string
          description: Created datetime
          readOnly: true
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:Accommodation:Sleeper
        modification:
          type: string
          description: Modification status
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - Accommodation
        nuisanceFacilities:
          type: array
          description: List of nuisance facilities
          items:
            type: string
        status:
          type: string
          description: Status
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version
          examples:
          - NSB:Version:V1
      description: An Accommodation
    ServiceFacilitySet:
      required:
      - changed
      - created
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        accommodation:
          $ref: '#/components/schemas/Accommodation'
        changed:
          type: string
          description: Changed datetime
          readOnly: true
        created:
          type: string
          description: Created datetime
          readOnly: true
        description:
          type: array
          description: Description
          items:
            $ref: '#/components/schemas/TextInLanguage'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id
          examples:
          - NSB:ServiceFacilitySet:Ordinary
        modification:
          type: string
          description: Modification status
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class
          readOnly: true
          examples:
          - ServiceFacilitySet
        onboardStay:
          $ref: '#/components/schemas/OnboardStay'
        status:
          type: string
          description: Status
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version
          examples:
          - NSB:Version:V1
      description: A ServiceFacilitySet
    TextInLanguage:
      required:
      - lang
      - value
      type: object
      properties:
        lang:
          minLength: 1
          type: string
          description: Language code.
          examples:
          - nob
        value:
          minLength: 1
          type: string
          description: The text.
      description: Text in a specific language.
    BoxedUnit:
      type: object
  parameters:
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
