      description: Properties of a seat. They describe both physical and logical properties of a seat.Physical properties are for example position of the seat.Logical properties describe properties that the operator use when selling the seat. For example fare class.
    RebookingOverviewResponse:
      required:
      - amountOfAcceptedRebookings
      - amountOfManualRebookings
      - amountOfSuggestedRebookings
      - datedServiceJourneyId
      type: object
      properties:
        datedServiceJourneyId:
          minLength: 1
          type: string
          description: Id of the dated service journey
        amountOfSuggestedRebookings:
          type: integer
          description: Number of rebookings suggested
          format: int32
          examples:
          - 1
        amountOfManualRebookings:
          type: integer
          description: Number of rebookings ready for manual handling
          format: int32
          examples:
          - 2
        amountOfAcceptedRebookings:
          type: integer
          description: Number of rebookings accepted
          format: int32
          examples:
          - 0
    RebookedReservationResponse:
      required:
      - createdAt
      - datedServiceJourneyId
      - destinationStopPlace
      - organisationId
      - originStopPlace
      - rebookedReservationLines
      - rebookingStatus
      - reference
      - reservationStatus
      - updatedAt
      - version
      - versionedAt
      type: object
      properties:
        reference:
          type: string
          description: The reference for this reservation, this is a randomly generated UUID
          format: uuid
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        orderId:
          type:
          - string
          - 'null'
          description: The `orderId` of the connected order where the creating client provided it. There are reservations without a connected order.
          examples:
          - ZGMCDSVS
        version:
          type: integer
          description: The highest/newest `version` of this reservation. The initial version number is `1`.
          format: int32
          examples:
          - 1
        originStopPlace:
          $ref: '#/components/schemas/StopPlaceResponseV1'
        previousOriginStopPlace:
          anyOf:
          - $ref: '#/components/schemas/StopPlaceResponseV1'
          - type: 'null'
        destinationStopPlace:
          $ref: '#/components/schemas/StopPlaceResponseV1'
        previousDestinationStopPlace:
          anyOf:
          - $ref: '#/components/schemas/StopPlaceResponseV1'
          - type: 'null'
        datedServiceJourneyId:
          type: string
          description: Id of the dated service journey
        previousDatedServiceJourneyId:
          type:
          - string
          - 'null'
          description: Id of the previous dated service journey if the dated service journey has been changed
        organisationId:
          type: integer
          description: The organisation id of the order which the `reservation` belongs to.This id is determined by the authentication used by the client.
          format: int64
          examples:
          - 20
        createdAt:
