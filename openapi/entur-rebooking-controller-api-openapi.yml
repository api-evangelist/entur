openapi: 3.2.0
info:
  title: Entur Rebooking Controller API
  version: 2026.09.0
  description: 'Operations tagged rebooking-controller across 2 of this provider''s published API definitions: entur-seating-manager-openapi.json, entur-seating-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.entur.io/seating-manager
security:
- bearer-key: []
tags:
- name: rebooking-controller
paths:
  /v1-beta/rebookings/seat-type:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - rebooking-controller
      summary: Trigger rebooking of multiple reservation to a new seat type
      description: Attempt to find new seats with a new seat type.
      operationId: rebookToSeatType
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebookToSeatTypeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/rebookings/{reference}/rebook:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    patch:
      tags:
      - rebooking-controller
      summary: Trigger rebooking of reservation
      description: Attempt to find new seats for a reservation on it's current departure. If no new seats found, keep existing reservation lines.
      operationId: rebook
      parameters:
      - name: reference
        in: path
        description: The reference of the reservation.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebookedReservationResponse'
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/rebookings:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - rebooking-controller
      summary: Fetch unhandled rebooked reservations for a dated service journey
      description: Fetch all unhandled rebooked reservations for a dated service journey. A unhandled rebooked reservation is a reservations that has `status=DRAFT` and rebooking status SUGGESTED, MANUAL or ACCEPTED.
      operationId: getRebookedReservations
      parameters:
      - name: datedServiceJourneyId
        in: query
        description: Dated service journey id to fetch rebooked reservations for.
        required: true
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: VYG:DatedServiceJourney:64_BRG-OSL_22-06-03
      - name: reservationStatus
        in: query
        description: The status of the reservations considered, defaults to DRAFT
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: DRAFT
          enum:
          - DRAFT
          - CONFIRMED
          - CANCELLED
          - DEPRECATED
        examples:
          default:
            value: CONFIRMED
      - name: rebookingStatuses
        in: query
        description: The `rebooking statuses` of the reservation that will be fetched. Defaults to SUGGESTED, MANUAL or ACCEPTED.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACCEPTED
            - MANUAL
            - SUGGESTED
            - REBOOKED_DRAFT
            - REJECTED
            - NONE
        examples:
          default:
            value: NONE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RebookedReservationResponse'
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/rebookings/dated-service-journeys:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - rebooking-controller
      operationId: getDatedServiceJourneysWithRebookingsStats
      parameters:
      - name: lineId
        in: query
        description: The line ID for which service journeys with rebooking stats should be fetched
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: VYG:Line:70
      - name: serviceJourneyId
        in: query
        description: The `serviceJourney` for which an overview of the rebookings of the connected dated service journeys that will be fetched
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: VYG:ServiceJourney:709
      - name: reservationStatus
        in: query
        description: The status of the reservations considered, defaults to DRAFT
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
          - CANCELLED
          - DEPRECATED
        examples:
          default:
            value: DRAFT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RebookingOverviewResponse'
      summary: Get dated service journeys with rebookings stats
      x-summary-source: derived
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/rebookings/dated-service-journeys/history:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - rebooking-controller
      operationId: getServiceJourneyWithRebookingHistory
      parameters:
      - name: serviceJourneyId
        in: query
        description: The `serviceJourney` for which an overview of the rebooking history of the connected dated service journeys that will be fetched
        required: true
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: VYG:ServiceJourney:709
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RebookingHistoryOverviewResponse'
      summary: Get service journey with rebooking history
      x-summary-source: derived
    servers:
    - url: https://api.entur.io/seating-manager
components:
  schemas:
    ReservationLineResponse:
      required:
      - reference
      - requestedProperties
      - requestedSeatingProperties
      - reservedProperties
      - reservedSeatingProperties
      - type
      type: object
      properties:
        reference:
          type: string
          description: Reference for this reservation line`
          format: uuid
        reservedProperties:
          type: array
          items:
            minLength: 1
            type: string
            description: The properties reserved by the reservation line.
            examples:
            - '[FareClass_STANDARD_CLASS]'
        reservedSeatingProperties:
          $ref: '#/components/schemas/SeatingPropertiesResponseV1'
        requestedProperties:
          type: array
          items:
            minLength: 1
            type: string
            description: The properties required by the traveller.
            examples:
            - '[FareClass_STANDARD_CLASS]'
        requestedSeatingProperties:
          $ref: '#/components/schemas/SeatingPropertiesResponseV1'
        orderLineId:
          type: string
          description: OrderLine ID for this reservation line.
          examples:
          - d4a599f6-6b0b-473f-a182-79f87a4a8689
        numberOfTravellers:
          type: integer
          description: Number of travellers on the reservation line.
          format: int32
          examples:
          - 2
        type:
          type: string
          description: The type of reservation line.
          examples:
          - SINGLE_SEAT
      discriminator:
        propertyName: type
        mapping:
          SINGLE_SEAT: '#/components/schemas/SingleSeatReservationLineResponse'
          COMPARTMENT: '#/components/schemas/CompartmentReservationLineResponse'
          FREE_SEATING: '#/components/schemas/FreeSeatingReservationLineResponse'
          FAILED_REBOOKING: '#/components/schemas/FailedRebookingReservationLineResponse'
    SeatingPropertiesRequestV1:
      required:
      - baggageType
      - mobilityFacilities
      - nuisanceFacilities
      - passengerCommsFacilities
      - sanitaryFacilities
      type: object
      properties:
        fareClass:
          type:
          - string
          - 'null'
          description: Fare class of the seat. Netex enumeration.
          enum:
          - UNKNOWN
          - FIRST_CLASS
          - SECOND_CLASS
          - THIRD_CLASS
          - PREFERENTE
          - PREMIUM_CLASS
          - BUSINESS_CLASS
          - STANDARD_CLASS
          - TURISTA
          - ECONOMY_CLASS
          - ANY
          examples:
          - FIRST_CLASS
        groupBooking:
          type:
          - string
          - 'null'
          description: Group booking permission of the seat. Netex enumeration.
          enum:
          - GROUPS_ALLOWED
          - GROUPS_NOT_ALLOWED
          - GROUPS_ALLOWED_WITH_RESERVATION
          - GROUP_BOOKINGS_RESTRICTED
          - UNKNOWN
          examples:
          - GROUPS_ALLOWED
        accommodationFacility:
          type:
          - string
          - 'null'
          description: Accommodation property of the seat. Netex enumeration.
          enum:
          - UNKNOWN
          - SEATING
          - FOLDING_SEAT
          - SLEEPER
          - SINGLE_SLEEPER
          - DOUBLE_SLEEPER
          - SPECIAL_SLEEPER
          - COUCHETTE
          - SINGLE_COUCHETTE
          - DOUBLE_COUCHETTE
          - SPECIAL_SEATING
          - RECLINING_SEATS
          - BABY_COMPARTMENT
          - FAMILY_CARRIAGE
          - RECREATION_AREA
          - PANORAMA_COACH
          - PULLMAN_COACH
          - PUSHCHAIR
          - WHEELCHAIR
          - STANDING
          examples:
          - SINGLE_SLEEPER
        seatAttachment:
          type:
          - string
          - 'null'
          description: Attachment of the seat. Netex enumeration.
          enum:
          - REVERSIBLE
          - FIXED
          - FOLDING
          - REMOVABLE
          - OTHER
          examples:
          - REVERSIBLE
        seatPosition:
          type:
          - string
          - 'null'
          description: Position of the seat. Netex enumeration.
          enum:
          - WINDOW
          - AISLE
          - MIDDLE
          - UPPER_BERTH
          - MIDDLE_BERTH
          - LOWER_BERTH
          - OTHER
          examples:
          - MIDDLE_BERTH
        relativeDirection:
          type:
          - string
          - 'null'
          description: Relative direction of the seat. Netex enumeration.
          enum:
          - BOTH
          - FORWARDS
          - BACKWARDS
          examples:
          - BACKWARDS
        nuisanceFacilities:
          uniqueItems: true
          type: array
          description: Set of possible nuisance factors of the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible nuisance factors of the seat. Netex enumerations.
            enum:
            - UNKNOWN
            - SMOKING
            - NO_SMOKING
            - FAMILY_AREA
            - CHILDFREE_AREA
            - ANIMALS_ALLOWED
            - NO_ANIMALS
            - BREASTFEEDING_FRIENDLY
            - MOBILE_PHONE_USE_ZONE
            - MOBILE_PHONE_FREE_ZONE
            examples:
            - FAMILY_AREA,SMOKING
          examples:
          - FAMILY_AREA,SMOKING
        passengerCommsFacilities:
          uniqueItems: true
          type: array
          description: Set of possible communication facilities available for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible communication facilities available for passenger in the seat. Netex enumerations.
            enum:
            - UNKNOWN
            - FREE_WIFI
            - PUBLIC_WIFI
            - POWER_SUPPLY_SOCKETS
            - TELEPHONE
            - AUDIO_ENTERTAINMENT
            - VIDEO_ENTERTAINMENT
            - BUSINESS_SERVICES
            - INTERNET
            - POST_OFFICE
            - POST_BOX
            examples:
            - POWER_SUPPLY_SOCKETS,TELEPHONE
          examples:
          - POWER_SUPPLY_SOCKETS,TELEPHONE
        sanitaryFacilities:
          uniqueItems: true
          type: array
          description: Set of possible sanitary facilities available for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible sanitary facilities available for passenger in the seat. Netex enumerations.
            enum:
            - NONE
            - TOILET
            - WHEELCHAIR_ACCESS_TOILET
            - SHOWER
            - WASHING_AND_CHANGE_FACILITIES
            - BABY_CHANGE
            - WHEELCHAIR_BABY_CHANGE
            - SHOE_SHINER
            - OTHER
            examples:
            - TOILET,SHOWER
          examples:
          - TOILET,SHOWER
        mobilityFacilities:
          uniqueItems: true
          type: array
          description: Set of possible mobility facilities available for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible mobility facilities available for passenger in the seat. Netex enumerations.
            enum:
            - UNKNOWN
            - LOW_FLOOR
            - STEP_FREE_ACCESS
            - SUITABLE_FOR_PUSHCHAIRS
            - SUITABLE_FOR_WHEELCHAIRS
            - SUITABLE_FOR_HEAVILIY_DISABLED
            - BOARDING_ASSISTANCE
            - ONBOARD_ASSISTANCE
            - UNACCOMPANIED_MINOR_ASSISTANCE
            - TACTILE_PLATFORM_EDGES
            - TACTILE_GUIDING_STRIPS
            examples:
            - SUITABLE_FOR_WHEELCHAIRS,LOW_FLOOR
          examples:
          - SUITABLE_FOR_WHEELCHAIRS,LOW_FLOOR
        baggageType:
          uniqueItems: true
          type: array
          description: Set of possible baggage types possible for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible baggage types possible for passenger in the seat. Netex enumerations.
            enum:
            - HANDBAG
            - HAND_LUGGAGE
            - SMALL_SUITCASE
            - SUITCASE
            - TRUNK
            - OVERSIZE_ITEM
            - BICYCLE
            - MOTORCYCLE
            - SPORTING_EQUIPMENT
            - SKIS
            - MUSICAL_INSTRUMENT
            - PUSH_CHAIR
            - WHEELCHAIR
            - MOTORIZED_WHEELCHAIR
            - LARGE_MOTORIZED_WHEELCHAIR
            - SMALL_ANIMAL
            - ANIMAL
            - GAME
            - OTHER
            examples:
            - HANDBAG,SUITCASE
          examples:
          - HANDBAG,SUITCASE
      description: Properties of a seat. They describe both physical and logical properties of a seat.Physical properties are for example position of the seat.Logical properties describe properties that the operator use when selling the seat. For example fare class.
    StopPlaceResponseV1:
      required:
      - nsrCode
      - sequenceNr
      type: object
      properties:
        nsrCode:
          type: string
          description: Stop Place id defined by National StopPlace registry.
          examples:
          - NSR:StopPlace:337
        sequenceNr:
          type: integer
          description: The ordering of the station in the journey.
          format: int32
          examples:
          - 0
      description: Destination `StopPlace` of the `reservation`
    RebookedReservationLineDataResponse:
      required:
      - reservationLineType
      - reservedProperties
      type: object
      properties:
        reservationLineType:
          type: string
          description: The type of reservation line.
          examples:
          - SINGLE_SEAT
        reservedProperties:
          type: array
          items:
            type: string
            description: The properties required by the traveller.
            examples:
            - '[FareClass_STANDARD_CLASS]'
      discriminator:
        propertyName: reservationLineType
        mapping:
          SINGLE_SEAT: '#/components/schemas/SingleSeatDataResponse'
          COMPARTMENT: '#/components/schemas/CompartmentDataResponse'
          FREE_SEATING: '#/components/schemas/FreeSeatingDataResponse'
          FAILED_REBOOKING: '#/components/schemas/FailedRebookingDataResponse'
    SeatingPropertiesResponseV1:
      type: object
