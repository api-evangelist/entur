              schema:
                type: string
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:les
