openapi: 3.2.0
info:
  title: Distances and zones Distance API
  description: Calculates distances between Stop Places
  contact:
    name: Team Avstand og Nettverk
  version: 2026.08.0
servers:
- url: https://api.entur.io/distance
security:
- enturOpen: []
tags:
- name: Distance
paths:
  /stop-place-distances/{fromStopPlaceId}/{toStopPlaceId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Distance
      summary: Shortest distance
      description: Returns the distance between two stops as JSON, it includes metadata on the two stops
      operationId: calculateStopPlaceDistanceFromToPlainText
      parameters:
      - name: fromStopPlaceId
        in: path
        description: The start point of the Stop Place in NeTEx format
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: toStopPlaceId
        in: path
        description: The end point of the Stop Place in NeTEx format
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: time
        in: query
        description: The time at which the distance is active. This defaults to now
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: organisationId
        in: query
        description: The organisation owning the distance. This is defaulted to 1 if not supplied
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
          default: 1
      - name: withPath
        in: query
        description: RFU
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              examples:
                default:
                  value: 1
            '*/*':
              examples:
                default:
                  value: 1
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceCalculationResponse'
        '400':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type:
                    - string
                    - 'null'
                  errors:
                    type: array
                    items:
                      type: string
                examples:
                - instance: https://api.entur.io/distance/request/path
                  title: Reason for error
                  status: 400
                  errors:
                  - Detail on first error
                  - Detail on second error
                  detail: Human readable error
        '401':
          description: Not Authorized
          content:
