components:
  schemas:
    DistancePath:
      type: object
      properties:
        id:
          type: string
        distance:
          type: integer
          format: int32
      examples:
      - id: NSR:StopPlace:20
        distance: 10
    DistanceCalculationResponse:
      type: object
      properties:
        organisationId:
          type: integer
          format: int64
        fromStopPlaceId:
          type: string
        toStopPlaceId:
          type: string
        distance:
          type: integer
          format: int32
        paths:
          type:
          - array
          - 'null'
          items:
            type: array
            items:
              $ref: '#/components/schemas/DistancePath'
      examples:
      - organisationId: 1
        fromStopPlaceId: NSR:StopPlace:337
        toStopPlaceId: NSR:StopPlace:94
        distance: 10
        paths:
        - - id: NSR:StopPlace:20
            distance: 10
  parameters:
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    enturOpen:
      type: apiKey
      name: ET-Client-Name
      in: header
