openapi: 3.2.0
info:
  title: Distances and zones Fare Zone API
  description: Calculates distances between Stop Places
  contact:
    name: Team Avstand og Nettverk
  version: 2026.08.0
servers:
- url: https://api.entur.io/distance
security:
- enturOpen: []
tags:
- name: Fare Zone
paths:
  /fare-zones/distances/zones:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - Fare Zone
      summary: Return distance between two fare zones
      description: Calculates the shortest-path distance between two fare zones, where 'distance' is the number of fare zone borders crossed. All shortest paths of equal length are returned. Nested zones are transparently mapped to their parent overlapping zone before the path is calculated.
      operationId: findFromToVia
      requestBody:
        description: Origin and destination fare zones, with optional via zones, preOwned zones, organisation filter, and path inclusion flag
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FareZoneDistanceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareZoneDistanceResponse'
        '400':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type:
                    - string
                    - 'null'
                  errors:
                    type: array
                    items:
                      type: string
                examples:
                - instance: https://api.entur.io/distance/request/path
                  title: Reason for error
                  status: 400
                  errors:
                  - Detail on first error
                  - Detail on second error
                  detail: Human readable error
        '401':
          description: Not Authorized
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type:
                    - string
                    - 'null'
                examples:
                - instance: https://api.entur.io/distance/request/path
                  title: Reason for error
                  status: 400
                  detail: Human readable error
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type:
                    - string
                    - 'null'
                examples:
                - instance: https://api.entur.io/distance/request/path
                  title: Reason for error
                  status: 400
                  detail: Human readable error
        '404':
          description: Resource Not Found
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type:
                    - string
                    - 'null'
                examples:
                - instance: https://api.entur.io/distance/request/path
                  title: Reason for error
                  status: 400
                  detail: Human readable error
        '500':
          description: Internal Error
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type:
                    - string
                    - 'null'
                examples:
                - instance: https://api.entur.io/distance/request/path
                  title: Reason for error
                  status: 400
                  detail: Human readable error
      security:
      - enturOpen: []
  /fare-zones/distances/stops:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - Fare Zone
      summary: Return zone distance between two stop places
      description: Resolves stop places to coordinates, then determines which overlapping fare zones each stop belongs to. Because a stop place can belong to multiple overlapping fare zones, all zone combinations are evaluated and one result per combination is returned. The request does support mixing zones into the stop places. If only doing zones the recommended url is /fare-zones/distances/zones as it is faster
      operationId: findFromToWithStopPlaces
      requestBody:
        description: Ordered list of stop place IDs, with optional preOwned zones and organisation filter
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZonalStopPlaceDistanceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FareZoneDistanceResponse'
        '400':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
