  /fare-zones/distances/polyline:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - Fare Zone
      summary: Return distance from polyline
      description: Finds all zones that a polyline passes through
      operationId: polylineDistance
      parameters:
      - name: organisationId
        in: query
        description: List of organisations that one might request zones through
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: time
        in: query
        description: The time at which the distance is active. This defaults to now
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: excludePolylineCoordinates
        in: query
        description: Removes the polyline coordinates from the response
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      requestBody:
        description: A polyline string
        content:
          text/plain:
            schema:
              type: string
              examples:
              - cxk~Fhy~uO
          application/json:
            schema:
              type: string
              examples:
              - cxk~Fhy~uO
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
