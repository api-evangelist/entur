components:
  schemas:
    CoordinateDistanceResponse:
      type: object
      properties:
        from:
          type: array
          items:
            type: string
        to:
          type: array
          items:
            type: string
        polylineCoordinates:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ZoneCoordinate'
        allZonesCrossed:
          type: array
          items:
            type: string
        orgBasedDistances:
          type: array
          items:
            $ref: '#/components/schemas/OrgBasedDistances'
      examples:
      - from:
        - ENT:FareZone:337
        to:
        - ENT:FareZone:94
        polylineCoordinates:
        - latitude: 1
          longitude: 1
        allZonesCrossed:
        - RUT:FareZone:1
        orgBasedDistances:
        - from: ENT:FareZone:337
          to: ENT:FareZone:337
          organisation: 1
          zonesCrossed:
          - ENT:FareZone:337
          shortestDistance: 1
          shortestPath: []
    ZonalStopPlaceDistanceRequest:
      required:
      - stopPlaces
      type: object
      properties:
        stopPlaces:
          minItems: 1
          type: array
          description: Ordered list of stop place IDs (first is origin, last is destination, any in between are via-points) the path must pass through. If needed the list can also contain Zones
          items:
            type: string
            description: Ordered list of stop place IDs (first is origin, last is destination, any in between are via-points) the path must pass through. If needed the list can also contain Zones
        organisationId:
          type:
          - integer
          - 'null'
          format: int64
        codespaces:
          maxLength: 3
          minLength: 3
          type:
          - string
          - 'null'
        time:
          type:
          - string
          - 'null'
          format: date-time
        preOwned:
          uniqueItems: true
          type:
          - array
          - 'null'
          items:
            type: string
      examples:
      - stopPlaces:
        - NSR:StopPlace:337
        - NSR:StopPlace:11
        organisationId: 1
        codespaces: ENT
        time: '2026-08-26T10:53:07.820698178Z'
        preOwned:
        - ENT:FareZone:1
    FareZoneDistanceResponse:
      type: object
      properties:
        fromZoneId:
          type: string
        toZoneId:
          type: string
        organisationId:
          type: integer
          format: int64
        distance:
          type: integer
          format: int32
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zones'
        directPath:
          type:
          - array
          - 'null'
          description: This field only gets populated if the direct path from-to is shorter than the via path
          items:
            $ref: '#/components/schemas/Zones'
      examples:
      - fromZoneId: ENT:FareZone:1
        toZoneId: ENT:FareZone:4
        organisationId: 1
        distance: 10
        zones:
        - requiredZones:
          - ENT:FareZone:1
          - ENT:FareZone:2
          - ENT:FareZone:4
          path:
          - ENT:FareZone:1
          - ENT:FareZone:2
          - ENT:FareZone:4
        directPath:
        - requiredZones:
          - ENT:FareZone:1
          - ENT:FareZone:4
          path:
          - ENT:FareZone:1
          - ENT:FareZone:4
    ZoneCoordinate:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      examples:
      - latitude: 1
        longitude: 1
    OrgBasedDistances:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        organisation:
          type: integer
          format: int64
        zonesCrossed:
          type: array
          items:
            type: string
        shortestDistance:
          type: integer
          format: int32
        shortestPath:
          type: array
          items:
            type: array
            items:
              type: string
      examples:
      - from: ENT:FareZone:337
        to: ENT:FareZone:337
        organisation: 1
        zonesCrossed:
        - ENT:FareZone:337
        shortestDistance: 1
        shortestPath: []
    FareZoneDistanceRequest:
      type: object
      properties:
        from:
          type: string
          examples:
          - ENT:FareZone:1
        to:
          type: string
          examples:
          - ENT:FareZone:1
        organisationId:
          type:
          - integer
          - 'null'
          format: int64
        time:
          type:
          - string
          - 'null'
          format: date-time
        via:
          type:
          - array
          - 'null'
          description: Use 'via' to force the path through one or more intermediate zones.
          items:
            type: string
        preOwned:
          uniqueItems: true
          type:
          - array
          - 'null'
          description: Use 'preOwned' to exclude zones the traveller already owns — these zones are not counted toward the distance.
          items:
            type: string
      examples:
      - from: ENT:FareZone:1
        to: ENT:FareZone:2
        organisationId: 1
        time: '2026-08-26T10:53:07.737812629Z'
        via:
        - ENT:FareZone:1
        preOwned:
        - ENT:FareZone:2
    Zones:
      type: object
      properties:
        requiredZones:
          uniqueItems: true
          type: array
          items:
            type: string
        path:
          type:
          - array
          - 'null'
          items:
            type: string
      examples:
      - requiredZones:
        - ENT:FareZone:1
        - ENT:FareZone:2
        - ENT:FareZone:4
        path:
        - ENT:FareZone:1
        - ENT:FareZone:2
        - ENT:FareZone:4
  parameters:
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    enturOpen:
      type: apiKey
      name: ET-Client-Name
      in: header
