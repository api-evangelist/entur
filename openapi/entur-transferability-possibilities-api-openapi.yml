          type: string
      - name: Accept-Language
        in: header
        description: The language code for the name and description fields.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: Entur-Distribution-Channel
        in: header
        description: The id of the distribution channel.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: Used to make conditional requests. It allows the client to provide an ETag value, and the server will process the request only if the ETag does not match the current version of the resource.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the resource.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transferability'
        '304':
          description: Not Modified
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:les
