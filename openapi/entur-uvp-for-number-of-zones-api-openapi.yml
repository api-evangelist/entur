components:
  schemas:
    VersionOfObjectRef:
      required:
      - nameOfClass
      - ref
      - version
      type: object
      properties:
        nameOfClass:
          minLength: 1
          type: string
          description: Name of class.
        ref:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: The netex id reference to the object.
        version:
          type: string
          description: Version.
      description: Fare frame ref.
    SeqUVPForNumberOfZonesInsert:
      type: object
      properties:
        empty:
          type: boolean
        traversableAgain:
          type: boolean
    UVPForNumberOfZonesInsert:
      required:
      - authorityId
      - fareFrameRef
      - id
      - numberOfZones
      - usageValidityPeriodId
      type: object
      properties:
        authorityId:
          type: string
          description: Reference to authority.
          examples:
          - RUT:Authority:RUT
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:UVPForNumberOFZones:123
        numberOfZones:
          type: integer
          description: Number of zones.
          format: int64
          examples:
          - 3
        usageValidityPeriodId:
          type: string
          description: Reference to usage validity period.
          examples:
          - NSB:UsageValidityPeriod:Child
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version.
          examples:
          - NSB:Version:V1
        zoneRange:
          type: string
          description: Zone range.
          examples:
          - '4:9'
    UVPForNumberOfZones:
      required:
      - authorityId
      - fareFrameRef
      - id
      - nameOfClass
      - numberOfZones
      - status
      - usageValidityPeriodId
      - version
      type: object
      properties:
        authorityId:
          type: string
          description: Reference to authority.
          examples:
          - RUT:Authority:RUT
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - RUT:UVPForNumberOfZones:example
        nameOfClass:
          type: string
          description: Name of class.
          examples:
          - UVPForNumberOfZones
        numberOfZones:
          type: integer
          description: Number of zones.
          format: int64
          examples:
          - 3
        status:
          type: string
          description: Status.
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        usageValidityPeriodId:
          type: string
          description: Reference to usage validity period.
          examples:
          - NSB:UsageValidityPeriod:Child
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version.
          examples:
          - NSB:Version:V1
        zoneRange:
          type: string
          description: Zone range.
          examples:
          - '4:9'
  parameters:
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
