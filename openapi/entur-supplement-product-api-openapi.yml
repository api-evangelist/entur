        usageValidityPeriodRef:
          pattern: ^([A-Z]{3}):UsageValidityPeriod:([0-9A-Za-z_\-]*)$
          type: string
          description: 'NeTEx ID of a UsageValidityPeriod instance (limitations/usage-validity-period).

