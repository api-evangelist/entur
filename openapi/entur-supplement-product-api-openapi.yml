      - CAPPED_FLAT_FARE
      - CAPPED_POINT_TO_POINT_FARE
      - CAPPED_ZONAL_FARE
      - LINE_FLAT_FARE
      - NETWORK_FLAT_FARE
      - POINT_TO_POINT_FARE
      - POINT_TO_POINT_DISTANCE_FARE
      - STAGE_FARE
      - ZONE_FLAT_FARE
