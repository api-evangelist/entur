openapi: 3.2.0
info:
  title: Products V3 Supplement product API
  description: '**This API specification is a draft and is not yet implemented. Endpoints, schemas, and

    behavior are subject to change without notice.**


    This API provides services to read and maintain products and fare data for public transport in Norway.'
  contact:
    name: Team Produkt
    email: teamprodukt@entur.org
  version: 2026.10.1
  x-stability-level: draft
servers:
- url: https://api.entur.io/products
  description: Production environment
- url: https://api.staging.entur.io/products
  description: Staging environment
- url: https://api.dev.entur.io/products
  description: Development environment
security:
- jwt: []
tags:
- name: Supplement product
  description: 'A supplement product can be purchased in addition to a preassigned fare product. Examples of supplement product types include:

    - Seat reservation

    - Bicycle

    - Animal

    - Meal

    - Wi-fi

    - Luggage

    - Parking'
paths:
  /v3/supplement-products:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - Supplement product
      summary: Create a new supplement product
      description: Create a new supplement product. A new version will be created with version number 1.
      operationId: createSupplementProduct
      requestBody:
        description: Supplement product to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplementProductRequest'
            examples:
              bicycle:
                $ref: '#/components/examples/bicycle'
              seatReservation:
                $ref: '#/components/examples/seatReservation'
              dog:
                $ref: '#/components/examples/dog'
              luggage:
                $ref: '#/components/examples/luggage'
              parking:
                $ref: '#/components/examples/parking'
              upgrade:
                $ref: '#/components/examples/upgrade'
        required: true
      responses:
        '201':
          description: Supplement product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplementProductResponse'
              examples:
                parking:
                  $ref: '#/components/examples/parking-2'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflict - Supplement product already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                conflict:
                  summary: Supplement product already exists
                  value:
                    type: https://developer.entur.org/errors/conflict
                    title: Conflict
                    status: 409
                    detail: Supplement product with privateCode '123' already exists.
      x-entur-permissions:
        value: product-api-access:endre
  /v3/supplement-products/{id}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Supplement product
      summary: Get the active version of a supplement product
      description: Retrieve the version of the supplement product that is active on the given date.
      operationId: getSupplementProduct
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/validOnDate'
      responses:
        '200':
          description: The supplement product version active on the given date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplementProductResponse'
              examples:
                parking:
                  $ref: '#/components/examples/parking-2'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Supplement product not found, or no version is active on the given travel date
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                notFound:
                  summary: Supplement product not found
                  value:
                    type: https://developer.entur.org/errors/not-found
                    title: Not Found
                    status: 404
                    detail: SupplementProduct 'EXA:SupplementProduct:456' not found.
                noActiveVersion:
                  summary: No version active on the travel date
                  value:
                    type: https://developer.entur.org/errors/not-found
                    title: Not Found
                    status: 404
                    detail: No version of SupplementProduct 'EXA:SupplementProduct:456' is active on 2026-12-01.
      x-entur-permissions:
        value: product-api-access:les
    post:
      tags:
      - Supplement product
      summary: Create a new version of a supplement product
      description: Create a new version of existing supplement product. The added version will be in DRAFT status, and will be created with version number n+1. The version will not be active until a start date is set and the version is published.
      operationId: createSupplementProductVersion
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        description: The updated version of supplement product. The existing data in supplement product will be replaced by this one.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplementProductRequest'
            examples:
              bicycle:
                $ref: '#/components/examples/bicycle'
              seatReservation:
                $ref: '#/components/examples/seatReservation'
              dog:
                $ref: '#/components/examples/dog'
              luggage:
                $ref: '#/components/examples/luggage'
              parking:
                $ref: '#/components/examples/parking'
              upgrade:
                $ref: '#/components/examples/upgrade'
        required: true
      responses:
        '201':
          description: Supplement product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplementProductResponse'
              examples:
                parking:
                  $ref: '#/components/examples/parking-2'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Conflict - Supplement product already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                conflict:
                  summary: Supplement product already exists
                  value:
                    type: https://developer.entur.org/errors/conflict
                    title: Conflict
                    status: 409
                    detail: Supplement product with privateCode '123' already exists.
      x-entur-permissions:
        value: product-api-access:endre
  /v3/supplement-products/{id}/versions:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Supplement product
      summary: List versions of a supplement product
      description: 'Retrieve all versions of a supplement product by its NeTEx ID, including drafts and

        proposals.'
      operationId: getSupplementProductVersions
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: List of supplement product versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionResponse'
              examples:
                versionHistory:
                  $ref: '#/components/examples/versionHistory'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Supplement product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                notFound:
                  summary: Supplement product not found
                  value:
                    type: https://developer.entur.org/errors/not-found
                    title: Not Found
                    status: 404
                    detail: SupplementProduct 'EXA:SupplementProduct:456' not found.
      x-entur-permissions:
        value: product-api-access:les
  /v3/supplement-products/{id}/{version}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Supplement product
      summary: Get a supplement product version
      description: 'Retrieve the complete supplement product for a specific version,

        identified by NeTEx version ID or version number.'
      operationId: getSupplementProductVersion
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/version'
      responses:
        '200':
          description: Supplement product version found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplementProductResponse'
              examples:
                parking:
                  $ref: '#/components/examples/parking-2'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Supplement product or version not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                notFound:
                  summary: Supplement product version not found
                  value:
                    type: https://developer.entur.org/errors/not-found
                    title: Not Found
                    status: 404
                    detail: Version 'EXA:Version:SP-abc123-v1' not found for SupplementProduct 'EXA:SupplementProduct:456'.
      x-entur-permissions:
        value: product-api-access:les
    put:
      tags:
      - Supplement product
      summary: Update a version of a supplement product
      description: Update the version of a supplement product. The version will not be active until a start date is set and the version is published.
      operationId: updateSupplementProductVersion
      parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/version'
      requestBody:
        description: The updated version of supplement product. The existing data in supplement product will be replaced by this one.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplementProductRequest'
            examples:
              bicycle:
                $ref: '#/components/examples/bicycle'
              seatReservation:
                $ref: '#/components/examples/seatReservation'
              dog:
                $ref: '#/components/examples/dog'
              luggage:
                $ref: '#/components/examples/luggage'
              parking:
                $ref: '#/components/examples/parking'
              upgrade:
                $ref: '#/components/examples/upgrade'
        required: true
      responses:
        '200':
          description: Supplement product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplementProductResponse'
              examples:
                parking:
                  $ref: '#/components/examples/parking-2'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Supplement product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                conflict:
                  summary: Supplement product not found
                  value:
                    type: https://developer.entur.org/errors/conflict
                    title: Not Found
                    status: 404
                    detail: Supplement product not found.
      x-entur-permissions:
        value: product-api-access:endre
components:
  examples:
    dog:
      summary: Dog onboard
      value:
        ownerOrganisationId: 1
        names:
        - lang: en-GB
          value: Dog
        - lang: nb-NO
          value: Hund
        descriptions:
        - lang: en-GB
          value: Bring your dog onboard the train.
        - lang: nb-NO
          value: Ta med hunden din ombord på toget.
        status: DRAFT
        startDate: '2025-01-01'
        supplementProductType: DOG
        chargingMomentType: BEFORE_TRAVEL
        conditionsSummary:
          exchangeable: true
          refundable: true
          fareStructureType: POINT_TO_POINT_FARE
        vatGroup: TRANSPORT_AND_TICKETS_VAT
        purchaseWindowRef: EXA:PurchaseWindow:90days
        usageValidityPeriodRef: EXA:UsageValidityPeriod:60minutes
        entitlementRequiredRefs:
        - EXA:EntitlementRequired:StandardTicket
        validityParameters:
        - groupingType: OR
          validityParameterType: ZONE
          validityParameterRefs:
          - EXA:FareZone:A
          - EXA:FareZone:B
    seatReservation:
      summary: Seat reservation
      value:
        ownerOrganisationId: 1
        names:
        - lang: en-GB
          value: Seat reservation
        - lang: nb-NO
          value: Setereservasjon
        descriptions:
