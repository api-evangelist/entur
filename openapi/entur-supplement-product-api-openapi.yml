        usageValidityPeriodRef:
          pattern: ^([A-Z]{3}):UsageValidityPeriod:([0-9A-Za-z_\-]*)$
          type: string
          description: 'NeTEx ID of a UsageValidityPeriod instance (limitations/usage-validity-period).

            Available values are listed in the Product Parameters API.


            **Not yet implemented:** this endpoint currently accepts but does not persist or return this field.

            '
          x-implementation-status: not-persisted
          examples:
          - ENT:UsageValidityPeriod:DuringTravel
        entitlementRequiredRefs:
          minItems: 1
          type: array
          description: 'List of NeTEx IDs of EntitlementRequired instances (limitations/entitlement-required).

            Available values are listed in the Product Parameters API.


