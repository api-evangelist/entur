openapi: 3.2.0
info:
  title: Entur Fare Structure Elements API
  version: 2026.10.0
  description: 'Operations tagged fare-structure-elements across 2 of this provider''s published API definitions: entur-products-openapi.json, entur-products-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.entur.io/products
  description: Production environment
- url: https://api.staging.entur.io/products
  description: Staging environment
- url: https://api.dev.entur.io/products
  description: Development environment
security:
- jwt: []
tags:
- name: fare-structure-elements
paths:
