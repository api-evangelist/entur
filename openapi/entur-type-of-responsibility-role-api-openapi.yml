openapi: 3.2.0
info:
  title: Products Type Of Responsibility Role API
  description: This API provides services to read and maintain products and fare data for public transport in Norway.
  version: 2026.10.0
servers:
- url: https://api.entur.io/products
  description: Production environment
- url: https://api.staging.entur.io/products
  description: Staging environment
- url: https://api.dev.entur.io/products
  description: Development environment
security:
- jwt: []
tags:
- name: type-of-responsibility-role
paths:
  /type-of-responsibility-role:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - type-of-responsibility-role
      summary: Retrieve all typeOfResponsibilityRoles
      operationId: type-of-responsibility-role_getAll
      parameters:
      - name: orgId
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: fareFrameId
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: minimizeDataLoad
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: validOnDate
        in: query
        description: Return only the versions valid on the given date (ISO-8601).
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: If-None-Match
        in: header
        description: Used to make conditional requests. It allows the client to provide an ETag value, and the server will process the request only if the ETag does not match the current version of the resource.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FareProduct'
        '304':
          description: Not Modified
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Authorization failed
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:les
  /type-of-responsibility-role/{id}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - type-of-responsibility-role
      summary: Retrieves the type of responsibility role valid on a given date
      description: Optional validOnDate query parameter (defaults to now). In prod returns the VERSIONED element; in staging/dev PROPOSED is preferred over VERSIONED.
      operationId: type-of-responsibility-role_getByIdAndValidOnDate
      parameters:
      - name: id
        in: path
        description: The id to identify a TypeOfResponsibilityRole
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: validOnDate
        in: query
        description: Return the version valid on the given date (ISO-8601).
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: If-None-Match
        in: header
        description: Used to make conditional requests. It allows the client to provide an ETag value, and the server will process the request only if the ETag does not match the current version of the resource.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeOfResponsibilityRole'
        '304':
          description: Not Modified
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                type: string
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                type: string
      security:
      - basic_auth: []
      x-entur-permissions:
        value: product-api-access:les
components:
  schemas:
    FareProduct:
      required:
      - accessRightParameterAssignments
      - accessRightsInProduct
      - changed
      - chargingMoment
      - created
      - fareFrameRef
      - id
      - modification
      - nameOfClass
      - status
      - validityConditions
      type: object
      properties:
        accessRightParameterAssignments:
          type: array
          description: AccessRightParameterAssignments.
          items:
            $ref: '#/components/schemas/GenericParameterAssignment'
        accessRightsInProduct:
          type: array
          description: AccessRightsInProduct.
          items:
            $ref: '#/components/schemas/AccessRightInProduct'
        activeComparisonOperatorVariant:
          type: string
          description: 'Deprecated: this parameter will be ignored.'
          examples:
          - E
        changed:
          type: string
          description: SalesPackage changed datetime.
        chargingMoment:
          $ref: '#/components/schemas/ChargingMoment'
        chargingMomentType:
          type: string
          description: ChargingMomentType. Default value is BEFORE_TRAVEL.
          enum:
          - BEFORE_TRAVEL
          - ON_START_OF_TRAVEL
          - BEFORE_END_OF_TRAVEL
          - ON_START_THEN_ADJUST_AT_END_OF_TRAVEL
          - ON_START_THEN_ADJUST_AT_END_OF_FARE_DAY
          - ON_START_THEN_ADJUST_AT_END_OF_CHARGE_PERIOD
          - AT_END_OF_TRAVEL
          - AT_END_OF_CHARGE_PERIOD
          - FREE
          - ANY_TIME
          - OTHER
          examples:
          - BEFORE_TRAVEL
        compatibleWithVersionRef:
          type: string
          description: CompatibleWithVersionRef
        conditionSummary:
          $ref: '#/components/schemas/ConditionSummary'
        created:
          type: string
          description: SalesPackage create datetime.
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        fareStructureType:
          type: string
          description: FareStructureType.
          enum:
          - CAPPED_FLAT_FARE
          - CAPPED_POINT_TO_POINT_FARE
          - CAPPED_ZONAL_FARE
          - LINE_FLAT_FARE
          - NETWORK_FLAT_FARE
          - POINT_TO_POINT_FARE
          - POINT_TO_POINT_DISTANCE_FARE
          - STAGE_FARE
          - ZONE_FLAT_FARE
          - ZONE_SEQUENCE_FARE
          - ZONE_TO_ZONE_FARE
          - ZONE_COUNT_FARE
          - PENALTY_FARE
          - OTHER
          examples:
          - ZONE_TO_ZONE_FARE
        fareTableRefs:
          type: array
          description: FareTableRef.
          items:
            $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - RUT:PreassignedFareProduct:RuterSingleTicket
        limitingRuleRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        modification:
          type: string
          description: Modification status.
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          examples:
          - PreassignedFareProduct
        operatorRef:
          type: string
          description: OperatorRef.
          examples:
          - RUT:Authority:RUT
        organisation:
          type: string
          description: Organisation who own the product.
        organisationId:
          type: string
          description: Organisation related to the fareProduct
        privateCode:
          type: string
          description: PrivateCode.
        status:
          type: string
          description: Status
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        typeOfFareProduct:
          $ref: '#/components/schemas/TypeOfFareProduct'
        validityConditions:
          type: array
          description: ValidityCondition.
          items:
            $ref: '#/components/schemas/ValidityCondition'
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version
          examples:
          - NSB:Version:V1
      description: A FARE PRODUCT response consisting of one or several VALIDABLE ELEMENTs, specific to a CHARGING MOMENT
    TypeOfAccessRightAssignment:
      required:
      - changed
      - created
      - fareFrameRef
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        changed:
          type: string
          description: Changed datetime.
          readOnly: true
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
          description: Created datetime.
          readOnly: true
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - ENT:TypeOfAccessRightAssignment:ActivationPolicyAssignment
        modification:
          type: string
          description: Modification status.
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - TypeOfAccessRightAssignment
        status:
          type: string
          description: Type of access right assignment status.
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Type of access right assignment version.
          examples:
          - NSB:Version:V1
      description: A classification of Access Right Assignments.
    VersionOfObjectRef:
      required:
      - nameOfClass
      - ref
      - version
      type: object
      properties:
        nameOfClass:
          minLength: 1
          type: string
          description: Name of class.
        ref:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: The netex id reference to the object.
        version:
          type: string
          description: Version.
      description: Fare frame ref.
    GenericParameterAssignment:
      required:
      - changed
      - created
      - fareFrameRef
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        canIgnoreInOffering:
          type: boolean
          description: Indicates whether gpa leaf node is supposed to be ignored when generating offer.
          examples:
          - true
        changed:
          type: string
          description: Changed datetime.
        chargingBasisType:
          type: string
          description: ChargingBasisType.
          enum:
          - FREE
          - DISCOUNTED
          - NORMAL
          - ANY
          examples:
          - FREE
        comparisonOperatorVariant:
          type: string
          description: 'Deprecated: this parameter will be ignored'
          examples:
          - E
        compatibleWithVersionRef:
          type: string
          description: CompatibleWithVersionRef.
          examples:
          - NSB:Version:V1
        created:
          type: string
          description: Created datetime.
        derivedFromVersionRef:
          type: string
          description: Derived from version.
          examples:
          - NSB:Version:V1
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        fareProductRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        fareStructureElementRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:GenericParameterAssignment:AllowedOperators
        includes:
          type: array
          description: Includes genericParameterAssignments.
          items:
            $ref: '#/components/schemas/GenericParameterAssignment'
        includesGroupingType:
          type: string
          description: Includes grouping type.
          enum:
          - AND
          - OR
          - XOR
          - NOT
          examples:
          - AND
        limitationGroupingType:
          type: string
          description: Limitation grouping type.
          enum:
          - AND
          - OR
          - XOR
          - NOT
          examples:
          - AND
        limitations:
          type: array
          description: Limitations as UsageParameters.
          items:
            $ref: '#/components/schemas/VersionOfObjectRef'
        modification:
          type: string
          description: Modification status.
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class
          examples:
          - GenericParameterAssignment
        parentParameterAssignmentRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        requiredElements:
          type: array
          description: Required elements.
          items:
            type: string
        requiredInContext:
          type: string
          description: Required in context.
          enum:
          - OFFERING
          - BOOKING
          - RESERVATION
          - SALE
          - FULFILMENT
          - ACTIVATION
          - CONSUMPTION
          - REVALIDATION
        requiredType:
          type: string
          description: Required type.
          enum:
          - SERVICE_JOURNEY_REF
          - TARIFF_ZONE_REF
          - PASSENGER_SEAT_REF
          - USER_PROFILE_REF
          - USAGE_VALIDITY_PERIOD_REF
          - DATED_SERVICE_JOURNEY_REF
          - DYNAMIC_DISTANCE_MATRIX_ELEMENT
          - USAGE_VALIDITY_PERIOD
          - DISTANCE_MATRIX_ELEMENT_REF
          - SCHEDULED_STOP_POINT_REF
          - GROUP_TICKET_REF
          - GROUP_TICKET
          - GROUP_OF_TARIFF_ZONES_REF
          - FARE_ZONE_REF
          examples:
          - SERVICE_JOURNEY_REF
        salesPackageRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        status:
          type: string
          description: Status
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        temporalValidityParameters:
          type: array
          description: Temporal validity parameter.
          items:
            $ref: '#/components/schemas/TemporalValidityParameter'
        typeOfAccessRightAssignment:
          $ref: '#/components/schemas/TypeOfAccessRightAssignment'
        validableElementRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        validityParameterAssignmentType:
          type: string
          description: Validity parameter assignment type.
          enum:
          - EQ
          - NE
          - GT
          - LT
          - GE
          - LE
          examples:
          - EQ
        validityParameterGroupingType:
          type: string
          description: Validity parameter grouping type.
          enum:
          - AND
          - OR
          - XOR
          - NOT
          examples:
          - AND
        validityParameterSetSelectionType:
          type: string
          description: Validity parameter set operator.
          enum:
          - ONE_OF_ANY_ONE_SET
          - ONE_OF_EACH_SET
          - SOME_OF_ANY_SET
          - ALL_OF_ONE_SET
          - ALL_OF_ALL_SETS
        validityParameters:
          type: array
          description: Validity parameters as scoping validity parameters
          items:
            $ref: '#/components/schemas/ScopingValidityParameter'
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version
          examples:
          - NSB:Version:V2
      description: A GenericParameterAssignment
    TypeOfFareProduct:
      required:
      - changed
      - created
      - fareFrameRef
      - id
      - nameOfClass
      - version
      type: object
      properties:
        changed:
          type: string
          description: Changed datetime.
          readOnly: true
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
          description: Created datetime.
          readOnly: true
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:TypeOfFareProduct:Ordinary
        modification:
          type: string
          description: Modification status.
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - TypeOfFareProduct
        status:
          type: string
          description: Type of fare product status.
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Type of fare product version.
          examples:
          - NSB:Version:V1
      description: A classification of FARE PRODUCTs.
    ValidityCondition:
      required:
      - changed
      - created
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        changed:
          type: string
          description: Changed datetime.
          readOnly: true
        created:
          type: string
          description: Created datetime.
          readOnly: true
        fromDate:
          type: string
          description: From Date.
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:ValidBetween:2018
        modification:
          type: string
          description: Modification status.
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - ValidBetween
        status:
          type: string
          description: Status.
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        toDate:
          type: string
          description: To Date.
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Version.
          examples:
          - NSB:Version:V1
      description: A condition of the validity of the priceable object
    AccessRightInProduct:
      required:
      - fareFrameRef
      - id
      - preassignedFareProductRef
      - validableElementRef
      - version
      type: object
      properties:
        accessNumber:
          type: integer
          description: The actual access number
          format: int32
        accessNumberIsLimited:
          type: boolean
          description: Flag indicating if access number is limited
        changed:
          type: string
          description: Changed datetime.
          readOnly: true
        compatibleWithVersionRef:
          type: string
          description: Compatible with version.
        created:
          type: string
          description: Created datetime.
          readOnly: true
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        description:
          type: array
          description: Description represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        fareFrameRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        id:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Id.
          examples:
          - NSB:AccessRightInProduct:Ordinary
        isFirstInSequence:
          type: boolean
          description: Whether element is first in sequence
        isLastInSequence:
          type: boolean
          description: Whether element is last in sequence
        limitedAccessNumber:
          type: integer
          description: Flag indicating whether this rights gives an unlimited number of accesses or not
          format: int32
        maximumAccess:
          type: integer
          description: Maximum number of times use of this element may occur in a given trip
          format: int32
        minimumAccess:
          type: integer
          description: Minimum number of times use of this element must occur in a given trip
          format: int32
        modification:
          type: string
          description: Modification status.
          readOnly: true
          enum:
          - NEW
          - REVISE
          - DELETE
          examples:
          - NEW
        name:
          type: array
          description: Name represented in different languages. Language codes are ISO-639.
          items:
            $ref: '#/components/schemas/TextInLanguage'
        nameOfClass:
          type: string
          description: Name of class.
          readOnly: true
          examples:
          - Refunding
        orderOfElement:
          type: integer
          description: The actual order in the sequence
          format: int32
        preassignedFareProductRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        status:
          type: string
          description: Access right in product status.
          readOnly: true
          enum:
          - DRAFT
          - PROPOSED
          - VERSIONED
          - DEPRECATED
          examples:
          - DRAFT
        validableElementRef:
          $ref: '#/components/schemas/VersionOfObjectRef'
        version:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
          description: Access right in product version.
          examples:
          - NSB:Version:V1
      description: A VALIDABLE ELEMENT as a part of a PRE-ASSIGNED FARE PRODUCT, including its possible order in the set of all VALIDABLE ELEMENTs grouped together to define the access right assigned to that PRE-ASSIGNED FARE PRODUCT.
    ScopingValidityParameter:
      required:
      - changed
      - created
      - fareFrameRef
      - genericParameterAssignmentRef
      - id
      - modification
      - nameOfClass
      - status
      - version
      type: object
      properties:
        authorityRef:
          type: string
          description: AuthorityRef.
          examples:
          - NSB:Authority:NSB
        changed:
          type: string
          description: Changed datetime.
        compatibleWithVersionRef:
          type: string
          description: CompatibleWithVersionRef.
        created:
          type: string
          description: Created datetime.
        derivedFromVersionRef:
          type: string
          description: Derived from version.
        distributionChannelRef:
          type: string
          description: Distribution channel ref.
          examples:
          - ENT:DistributionChannel:App
        facilitySetRef:
          type: string
          description: facilitySetRef.
        fareClasses:
          type: array
          description: 'FareClasses. Enum as string with the following values: FIRST_CLASS, SECOND_CLASS, THIRD_CLASS, ECONOMY_CLASS, BUSINESS_CLASS, TURISTA, PREFERENTE, STANDARD_CLASS, PREMIUM_CLASS, ANY, UNKNOWN'
