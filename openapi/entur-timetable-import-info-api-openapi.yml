openapi: 3.2.0
info:
  title: Entur Timetable Import Info API
  version: 2026.04.0
  contact:
    name: Entur
    url: https://developer.entur.org
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/software/page/eupl
  description: 'Operations tagged timetable-import-info across 2 of this provider''s published API definitions: entur-timetable-import-info-openapi.json, entur-timetable-import-info-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.entur.io/timetable-public/v1
  description: Production server
- url: https://api.staging.entur.io/timetable-public/v1
  description: Staging server
- url: https://api.dev.entur.io/timetable-public/v1
  description: Development server
tags:
- name: timetable-import-info
  description: Status of the latest import dates for timetable datasets by codespace
paths:
  /timetable-import-info/import_date:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - timetable-import-info
      summary: Return the date of the latest NeTEx import for all codespaces
      description: Returns a map of codespace identifiers to their latest import timestamps
      operationId: getAllImportDates
      responses:
        '200':
          description: Successfully retrieved import dates
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              examples:
                default:
                  value:
                    avi: '2021-04-21T11:51:59'
                    rut: '2021-05-15T09:30:00'
                    atb: '2021-06-10T14:20:30'
            text/plain:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
    servers:
    - url: https://api.entur.io/timetable-public/v1
      description: Production server
    - url: https://api.staging.entur.io/timetable-public/v1
      description: Staging server
    - url: https://api.dev.entur.io/timetable-public/v1
      description: Development server
  /timetable-import-info/import_date/{codespace}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - timetable-import-info
      summary: Return the date of the latest NeTEx import for a given codespace
      description: Returns the import date for a specific codespace identifier
      operationId: getImportDateByCodespace
      parameters:
      - name: codespace
        in: path
        description: Codespace of the data provider (e.g., 'avi', 'rut', 'atb')
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          default:
            value: avi
      responses:
        '200':
          description: Successfully retrieved import date
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: '2021-04-21T11:51:59'
        '404':
          description: Unknown codespace - no import data available
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: Codespace not found
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
    servers:
    - url: https://api.entur.io/timetable-public/v1
      description: Production server
    - url: https://api.staging.entur.io/timetable-public/v1
      description: Staging server
    - url: https://api.dev.entur.io/timetable-public/v1
      description: Development server
components:
  parameters:
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
x-refined-from:
- entur-timetable-import-info-openapi.json
- entur-timetable-import-info-openapi.yml
