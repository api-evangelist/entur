      title: Transaction
      required:
      - amount
      - createdAt
      - currency
      - status
      - transactionId
      type: object
      properties:
        amount:
          type: string
          description: 'Amount to pay, represented in the standard currency unit. Maximum (totalDigits: 18, fractionDigits: 5) according to ISO 20022. The integer and fractional digits are separated by a dot. Deprecated and will be removed in next version of API. Use summary instead.'
          examples:
          - '450.00'
        cardNumber:
          type: string
          description: Last 4 digits in card number (PAN - Personal Account Number)
          examples:
          - '0004'
        createdAt:
          type: string
          description: Timestamp for when transaction was first created.
          format: date-time
          readOnly: true
          examples:
          - '2025-09-30T22:00:00Z'
        currency:
          type: string
          description: 3-letter currency code. (ISO 4217)
          default: NOK
          examples:
          - NOK
        operationLog:
          type: array
          description: Log of each successful operation made on the transaction. Failing operations will not be included.
          items:
            $ref: '#/components/schemas/TransactionOperationResponse'
          examples:
          - - amount: '450.00'
              distributionChannelId: ENT:DistributionChannel:Test
              operation: CREATE
              pos: '18930345'
              timestamp: '2025-08-24T14:15:22Z'
              error:
                code: '25'
                source: Netaxept
                message: Transaction not found.
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        paymentTypeFee:
          deprecated: true
          allOf:
          - $ref: '#/components/schemas/PaymentTypeFee'
        paymentTypeGroup:
          $ref: '#/components/schemas/PaymentTypeGroup'
        paymentId:
          type: integer
          description: ID of the payment this transaction belongs to.
          format: int64
          examples:
          - 42
        paymentAgreementId:
          type: integer
          description: ID of the payment agreement associated with this transaction, if any.
          format: int64
          examples:
          - 456
        recurringPaymentId:
          type: integer
          description: Reference to the saved payment agreement this transaction will use, if any was specified.
          format: int64
          examples:
          - 123
        rrn:
          type: string
          description: Reconciliation reference number used to track a transaction through different economy systems.
          examples:
          - 000012345678
        status:
          $ref: '#/components/schemas/TransactionStatus'
        summary:
          $ref: '#/components/schemas/TransactionSummary'
        transactionData:
          type: object
          additionalProperties:
            type: string
          description: Extra transaction data from external client. Only relevant for clients using the import flow.
          examples:
          - extraData: any extra data you want to add
        transactionId:
          type: integer
          description: ID of the specific transaction.
          format: int64
          examples:
          - 1
        updatedAt:
          type: string
          description: Timestamp for when transaction was last updated.
          format: date-time
          readOnly: true
          examples:
          - '2025-09-30T22:00:00Z'
      description: Payment transaction information
      examples:
      - amount: '450.00'
        cardNumber: '0004'
        createdAt: '2025-01-12T16:08:03Z'
        currency: NOK
        operationLog:
        - amount: '450.00'
          distributionChannelId: ENT:DistributionChannel:Test
          operation: CREATE
          pos: '18930345'
          timestamp: '2025-08-24T14:15:22Z'
          error:
            code: '25'
            source: Netaxept
            message: Transaction not found.
        paymentType: VISA
        paymentTypeFee:
          amount: '450.00'
          currency: NOK
          name: ENT:PaymentTypeFee:Collector
          reason: Walley Invoice
          taxAmount: '25.00'
          taxCode: '3'
          taxRate: '25.00'
        paymentTypeGroup: PAYMENTCARD
        paymentId: 42
        recurringPaymentId: 1
        rrn: '000123456123'
        status: CREATED
        summary:
          capturedAmount: '450.00'
          creditedAmount: '450.00'
          remainingAmountToCapture: '0.00'
          remainingAmountToCredit: '0.00'
        transactionData:
          extraData: any extra data you want to add
        transactionId: 10
        updatedAt: '2025-01-12T16:13:13Z'
  parameters:
    dciHeader:
      name: Entur-Distribution-Channel
      in: header
      description: Distribution channel identifier.
      required: false
      style: simple
      explode: false
      schema:
        type: string
    paginationPerPageParam:
      name: perPage
      in: query
      description: Selects the number of elements per page
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
        default: 30
    posHeader:
      name: Entur-POS
      in: header
      description: Point-of-sale identifier.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    paginationPageParam:
      name: page
      in: query
      description: Selects a specific page in the collection
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
        default: 1
    paymentIdPathParam:
      name: paymentId
      in: path
      description: paymentId
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
    transactionIdPathParam:
      name: transactionId
      in: path
      description: transactionId
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
    onBehalfOfHeader:
      name: Entur-On-Behalf-Of
      in: header
      description: Identifier of the organisation on whose behalf the request is made. Use of this header requires a separate agreement before use.
      required: false
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
