components:
  schemas:
    LegRequest:
      required:
      - datedServiceJourneyId
      - destinationNsrCode
      - originNsrCode
      type: object
      properties:
        datedServiceJourneyId:
          type: string
          description: Dated service journey ID for the leg.
        originNsrCode:
          type: string
          description: NSR code where the traveller leg starts.
        destinationNsrCode:
          type: string
          description: NSR code where the traveller leg ends.
      description: Leg of a trip. Each leg results in a new reservation.
    ReservationResponseV1:
      required:
      - createdAt
      - createdBy
      - datedServiceJourneyId
      - destinationNsrCode
      - organisationId
      - originNsrCode
      - reference
      - reservationLines
      - status
      - updatedAt
      - version
      - versionedAt
      - versionedAtDatedServiceJourneyVersion
      type: object
      properties:
        orderId:
          type:
          - string
          - 'null'
          description: The 'id' of the order the reservation belongs to
          examples:
          - A1B2C3D4
        reference:
          type: string
          description: The reference for this reservation
          format: uuid
          examples:
          - c129cc9c-76e4-4f28-a4e2-5af96550627a
        version:
          type: integer
          description: The `version` of the reservation. Starts with `1`.
          format: int32
          examples:
          - 1
        datedServiceJourneyId:
          type: string
          description: Id of the dated service journey
        versionedAtDatedServiceJourneyVersion:
          type: integer
          description: The `version` of the datedServiceJouney at the time the reservation was versioned
          format: int32
        originNsrCode:
          type: string
          description: Origin `NSR code` of the `reservation`
        destinationNsrCode:
          type: string
          description: Destination `NSR code` of the `reservation`
        organisationId:
          type: integer
          description: The organisation id of the order which the `reservation` belongs to.
          format: int64
          examples:
          - 20
        status:
          type: string
          description: Describes the `reservation` status.
          enum:
          - DRAFT
          - CONFIRMED
          - CANCELLED
          - DEPRECATED
          examples:
          - DRAFT
        rebookingStatus:
          type:
          - string
          - 'null'
          description: Describes the `rebooking` status of the reservation.
          enum:
          - ACCEPTED
          - MANUAL
          - SUGGESTED
          - REBOOKED_DRAFT
          - REJECTED
          examples:
          - ACCEPTED
        notificationRule:
          type:
          - string
          - 'null'
          description: Rule for what type of notification is sent to reservation owner on departure closures
          enum:
          - CANCELLED_WITHOUT_REPLACEMENT
          - CANCELLED_WITH_REPLACEMENT
          - REPLACED_TO_OTHER_SERVICE
          examples:
          - CANCELLED_WITHOUT_REPLACEMENT
        info:
          type:
          - string
          - 'null'
          description: Additional free text information about the reservation.
          examples:
          - Unable to rebook this reservation due to no available seats.
        createdAt:
          type: string
          description: When this reservation was initially created
          format: date-time
          examples:
          - '2011-12-03T10:15:30+01:00'
        createdBy:
          type: integer
          description: The organisation id this version of the `reservation` was created by.This id is determined by the authentication used by the client.
          format: int64
          examples:
          - 20
        versionedAt:
          type: string
          description: When this version of this reservation was created
          format: date-time
          examples:
          - '2011-12-03T10:15:30+01:00'
        updatedAt:
          type: string
          description: When this was previously updated. This includes status changes, reservation line changes and so on.
          format: date-time
          examples:
          - '2011-12-03T10:15:30+01:00'
        updatedBy:
          type:
          - integer
          - 'null'
          description: The organisation id of the organisation that last updated this `reservation`.This id is determined by the authentication used by the client.
          format: int64
          examples:
          - 20
        reservationLines:
          type: array
          items:
            $ref: '#/components/schemas/ReservationLineResponseV1'
    CreateReservationLinesBySeatingPropertiesRequest:
      required:
      - seatingPropertiesToReserve
      type: object
      properties:
        seatingPropertiesToReserve:
          $ref: '#/components/schemas/SeatingPropertiesRequestV1'
        numberOfTravellers:
          type:
          - integer
          - 'null'
          description: The properties required by the traveller(s).
          format: int32
        mustReserveWholeCompartment:
          type: boolean
          description: Whether to reserve a whole compartment to this traveller. If not provided, or set to false, a single seat with the provided properties will be reserved instead.
          default: false
          examples:
          - true
        orderLineId:
          type:
          - string
          - 'null'
          description: OrderLine ID to reserve seats for
          examples:
          - d4a599f6-6b0b-473f-a182-79f87a4a8689
      description: List of SeatingProperties to allocate for.
    TravelIntentionVersionResponseV1:
      required:
      - destinationNsrCode
      - originNsrCode
      - originalDatedServiceJourneyId
      - reservations
      - snoozed
      - status
      - travelIntentionVersion
      - versionedAt
      type: object
      properties:
        travelIntentionVersion:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - SUCCESS
          - NO_JOURNEY
          - REJECTED
          - NO_SEATS
        snoozed:
          type: boolean
        originalDatedServiceJourneyId:
          type: string
        originNsrCode:
          type: string
        destinationNsrCode:
          type: string
        versionedAt:
          type: string
          format: date-time
        info:
          type:
          - string
          - 'null'
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/ReservationResponseV1'
