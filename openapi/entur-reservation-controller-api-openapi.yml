openapi: 3.2.0
info:
  title: Entur Reservation Controller API
  version: 2026.09.0
  description: 'Operations tagged reservation-controller across 2 of this provider''s published API definitions: entur-seating-manager-openapi.json, entur-seatingservices-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.entur.io/seating-manager
- url: https://api.entur.io/seatingservices
tags:
- name: reservation-controller
paths:
  /v1-beta/reservations/{reference}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      operationId: getReservation
      parameters:
      - name: reference
        in: path
        description: The `reference` of the reservation that will be fetched
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The `reference` of the reservation that will be fetched
          format: uuid
          examples:
          - c129cc9c-76e4-4f28-a4e2-5af96550627a
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
      summary: Get reservation
      x-summary-source: derived
    put:
      tags:
      - reservation-controller
      summary: Update a reservation with reservation lines
      description: '# Update a reservation with reservation lines.

        The draft reservation version containing only the requested reservation lines will be returned.


        If reservationLineRequests (body) is empty, then the draft reservation will contain no reservation lines.'
      operationId: fullUpdateReservation
      parameters:
      - name: reference
        in: path
        description: The `reference` of the reservation that will be updated.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The `reference` of the reservation that will be updated.
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationLineRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    patch:
      tags:
      - reservation-controller
      operationId: updateReservation
      parameters:
      - name: reference
        in: path
        description: The `reference` of the reservation that will be updated.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          description: The `reference` of the reservation that will be updated.
          format: uuid
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
      summary: Update reservation
      x-summary-source: derived
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      operationId: getReservationsOnSeatingOffer
      parameters:
      - name: datedServiceJourneyId
        in: query
        description: The `datedServiceJourney` of the reservation that will be fetched
        required: true
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: VYG:DatedServiceJourney:61_21-12-02
      - name: reservationStatus
        in: query
        description: The `reservation status` of the reservation that will be fetched. Defaults to DRAFT and CONFIRMED.
        required: false
        style: form
        explode: true
        schema:
          type: string
          description: The `reservation status` of the reservation that will be fetched. Defaults to DRAFT and CONFIRMED.
          enum:
          - DRAFT
          - CONFIRMED
          - CANCELLED
          - DEPRECATED
          examples:
          - DRAFT,CONFIRMED
        examples:
          default:
            value: DRAFT,CONFIRMED
      - name: rebookingStatuses
        in: query
        description: The `rebooking statuses` of the reservation that will be fetched. Defaults to all.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACCEPTED
            - MANUAL
            - SUGGESTED
            - REBOOKED_DRAFT
            - REJECTED
            - NONE
        examples:
          default:
            value: NONE
      - name: updatedAfter
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: origin
        in: query
        description: NSR code of the origin stop place. When combined with destination, returns only reservations onboard the requested leg.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: NSR:StopPlace:337
      - name: destination
        in: query
        description: NSR code of the destination stop place. When combined with origin, returns only reservations onboard the requested leg.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: NSR:StopPlace:669
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
      summary: Get reservations on seating offer
      x-summary-source: derived
    post:
      tags:
      - reservation-controller
      summary: Create a reservation from origin to destination on a DatedServiceJourney
      description: This endpoint can be used to create a reservation, optionally with the supplied reservation linesAn organisation id will be stored, this id determined by the authentication used by the client
      operationId: createReservation
      parameters:
      - name: ownerOrganisationId
        in: query
        description: The organisation to be set as owner of the reservation. Only Entur may specify ownerOrganisation, otherwise the requesting organisation will be set as owner of the reservation.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          description: The organisation to be set as owner of the reservation. Only Entur may specify ownerOrganisation, otherwise the requesting organisation will be set as owner of the reservation.
          format: int64
          examples:
          - 1
        examples:
          default:
            value: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/{reference}/reservation-lines/replace:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - reservation-controller
      summary: Replace reservation lines
      description: Replace existing reservation lines connected with new allocated reservation lines.
      operationId: replaceOrderLines
      parameters:
      - name: reference
        in: path
        description: UUID for the reservation we want to replace reservationLines on.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceReservationLinesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/{reference}/reservation-line:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - reservation-controller
      summary: Add reservation lines
      description: 'Adds reservation lines connected to the given reservation.

        The response is a list of all reservation lines that exists on the reservation after adding the ones in the request.'
      operationId: addReservationLines
      parameters:
      - name: reference
        in: path
        description: UUID for the reservation we want to add reservation lines to.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      - name: groupOverride
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: List with  reservation lines to add
              items:
                $ref: '#/components/schemas/CreateReservationLinesBySeatingPropertiesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    delete:
      tags:
      - reservation-controller
      summary: Remove reservation lines
      description: 'Removes reservation lines connected to the given reservation.

        The response is a list of UUIDs representing the reservation line references that got removed.'
      operationId: removeReservationLines
      parameters:
      - name: reference
        in: path
        description: UUID for the reservation we want to remove reservation lines from.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: List with UUIDs of reservation lines to cancel
              items:
                type: string
                format: uuid
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/{reference}/rebooking-notification:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - reservation-controller
      summary: Notifies customer about rebooked seats
      description: Triggers a notification to the customer about rebooked seats.
      operationId: triggerRebookingMessage
      parameters:
      - name: reference
        in: path
        description: UUID for the reservation we want to trigger a notification for.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      responses:
        '204':
          description: No Content
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/allocate:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - reservation-controller
      summary: Create reservation and reserve seats by seating properties
      description: Create reservation and reserve seats allocated by seating properties. If the optional orderLineId is provided for a set of seating properties, the reservation line(s) allocated by the seating properties will be associated to the orderLineId
      operationId: allocateReservationBySeatingProperties
      parameters:
      - name: ownerOrganisationId
        in: query
        description: The organisation to be set as owner of the reservation. Only Entur may specify ownerOrganisation, otherwise the requesting organisation will be set as owner of the reservation.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          description: The organisation to be set as owner of the reservation. Only Entur may specify ownerOrganisation, otherwise the requesting organisation will be set as owner of the reservation.
          format: int64
          examples:
          - 1
        examples:
          default:
            value: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationBySeatingPropertiesRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/allocate/trip:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - reservation-controller
      summary: Create reservations for a sequence of legs and reserve seats by seating…
      description: Create reservation and reserve seats allocated by seating properties. If the optional orderLineId is provided for a set of seating properties, the reservation line(s) allocated by the seating properties will be associated to the orderLineId
      operationId: allocateReservationForTripBySeatingProperties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripReservationBySeatingPropertiesRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/{reference}/reservation-lines/{reservationLineReference}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    patch:
      tags:
      - reservation-controller
      summary: Update a reservation line in a reservation
      description: '# Update a reservation line in a reservation.

        The result will depend on the reservation status.

        - **ReservationStatus:DRAFT** : The draft reservation version will contain the updated reservation line and existing lines.

        - **ReservationStatus:CONFIRMED** : A new draft reservation version containing only the updated reservation line.

        - **ReservationStatus:CANCELLED** : No operation.'
      operationId: partialUpdateReservation
      parameters:
      - name: reference
        in: path
        description: The `reference` of the reservation the `reservation` that will be updated.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      - name: reservationLineReference
        in: path
        description: The `reference` of the `reservationLine` to be updated.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchReservationLineRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationLineResponse'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/travel-intentions/{originalDatedServiceJourneyId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      summary: Fetch grouped reservations for a travel intention
      description: 'Fetches all travel intentions connected to the given original dated service journey id, grouped by travel intention reference with their full rebooking history.

        Each group contains all versions of the travel intention and the reservations belonging to each version. Filters on reservation status and rebooking status are

        applied only to the latest version of each travel intention — groups where the latest version does not match are excluded entirely. The fullHistory parameter

        controls how many versions are included per group: when true (default), all versions are returned; when false, only the two most recent versions are returned.'
      operationId: getGroupedReservations
      parameters:
      - name: originalDatedServiceJourneyId
        in: path
        description: The ID of the original dated service journey — the departure the travel intentions were initially created for and that connects all related travel intentions and their reservations together.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          default:
            value: VYG:DatedServiceJourney:64_BRG-OSL_22-06-03
      - name: reservationStatus
        in: query
        description: The `reservation status` to filter on. If not specified, all statuses are included.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - CONFIRMED
            - CANCELLED
            - DEPRECATED
        examples:
          default:
            value: DRAFT
      - name: rebookingStatusFilter
        in: query
        description: The `rebooking statuses` to filter on. Defaults to all statuses if not specified.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACCEPTED
            - MANUAL
            - SUGGESTED
            - REBOOKED_DRAFT
            - REJECTED
            - NONE
        examples:
          default:
            value: MANUAL
      - name: fullHistory
        in: query
        description: Whether to return the full version history of each travel intention. If false, only the two most recent versions are returned. Defaults to full history.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
        examples:
          default:
            value: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TravelIntentionResponseV1'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/reservation-line/{reservationLineReference}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      operationId: getReservationByReservationLineReference
      parameters:
      - name: reservationLineReference
        in: path
        description: The `reference` of the reservation line that will be fetched
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
      summary: Get reservation by reservation line reference
      x-summary-source: derived
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/orderId/{orderId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      summary: Get reservations by orderId
      description: Fetches the newest version of all reservations connected to the orderId
      operationId: getReservationsByOrderId
      parameters:
      - name: orderId
        in: path
        description: The orderId of the reservations that will be fetched
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          default:
            value: CHRT56
      - name: reservationStatuses
        in: query
        description: Optional reservation statuses to filter on. If not supplied, defaults to DRAFT, CONFIRMED and CANCELLED, falling back to DEPRECATED if no active reservations exist for the orderId
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - CONFIRMED
            - CANCELLED
            - DEPRECATED
        examples:
          default:
            value: CONFIRMED,DEPRECATED
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/debug/{reference}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      summary: Get all versions of reservation
      description: Fetches all versions of reservation with given reference
      operationId: getAllReservationVersions
      parameters:
      - name: reference
        in: path
        description: The `reference` of the reservation that will be fetched with all versions
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
        examples:
          default:
            value: c129cc9c-76e4-4f28-a4e2-5af96550627a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
    servers:
    - url: https://api.entur.io/seating-manager
  /v1-beta/reservations/by-statuses:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      operationId: getReservationsOnSeatingOfferByStatuses
      parameters:
      - name: datedServiceJourneyId
        in: query
        description: The `datedServiceJourney` of the reservation that will be fetched
        required: true
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: VYG:DatedServiceJourney:61_21-12-02
      - name: reservationStatus
        in: query
        description: The `reservation status` of the reservations that will be fetched. Defaults to DRAFT and CONFIRMED.
        required: false
        style: form
        explode: true
        schema:
          type: array
          description: The `reservation status` of the reservations that will be fetched. Defaults to DRAFT and CONFIRMED.
          items:
            type: string
            description: The `reservation status` of the reservations that will be fetched. Defaults to DRAFT and CONFIRMED.
            enum:
            - DRAFT
            - CONFIRMED
            - CANCELLED
            - DEPRECATED
            examples:
            - DRAFT,CONFIRMED
          examples:
          - DRAFT,CONFIRMED
        examples:
          default:
            value: DRAFT,CONFIRMED
      - name: rebookingStatuses
        in: query
        description: The `rebooking statuses` of the reservation that will be fetched. Defaults to all.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - ACCEPTED
            - MANUAL
            - SUGGESTED
            - REBOOKED_DRAFT
            - REJECTED
            - NONE
        examples:
          default:
            value: NONE
      - name: updatedAfter
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: origin
        in: query
        description: NSR code of the origin stop place. When combined with destination, returns only reservations onboard the requested stretch.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: NSR:StopPlace:337
      - name: destination
        in: query
        description: NSR code of the destination stop place. When combined with origin, returns only reservations onboard the requested stretch.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: NSR:StopPlace:669
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
      security:
      - bearer-key: []
      summary: Get reservations on seating offer by statuses
      x-summary-source: derived
    servers:
    - url: https://api.entur.io/seating-manager
  /v1/reservations/{reservationId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - reservation-controller
      operationId: getV1ReservationsByReservationId
      parameters:
      - name: reservationId
        in: path
        required: true
