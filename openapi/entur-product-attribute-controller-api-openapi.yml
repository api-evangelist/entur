openapi: 3.2.0
info:
  title: Entur Product Attribute Controller API
  version: 2026.09.0
  description: 'Operations tagged product-attribute-controller across 2 of this provider''s published API definitions: entur-seatingservices-openapi.json, entur-seatingservices-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.entur.io/seatingservices
tags:
- name: product-attribute-controller
paths:
  /v1/product-attributes/{attribute-id}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    put:
      tags:
      - product-attribute-controller
      operationId: updateProductAttributes
      parameters:
      - name: attribute-id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductAttributeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAttributeResponse'
      summary: Update product attributes
      x-summary-source: derived
    delete:
      tags:
      - product-attribute-controller
      operationId: deleteProductAttributes
      parameters:
      - name: attribute-id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: No Content
      summary: Delete product attributes
      x-summary-source: derived
    servers:
    - url: https://api.entur.io/seatingservices
  /v1/product-attributes:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - product-attribute-controller
      operationId: getProductAttributes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeqProductAttributeResponse'
      summary: Get product attributes
      x-summary-source: derived
    post:
      tags:
      - product-attribute-controller
      operationId: createProductAttributes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeqProductAttributeRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeqProductAttributeResponse'
      summary: Create product attributes
      x-summary-source: derived
    servers:
    - url: https://api.entur.io/seatingservices
components:
  schemas:
    UpdateProductAttributeRequest: {}
    SeqProductAttributeResponse:
      type: object
      properties:
        traversableAgain:
          type: boolean
        empty:
          type: boolean
    ProductAttributeResponse: {}
    SeqProductAttributeRequest:
      type: object
      properties:
        traversableAgain:
          type: boolean
        empty:
          type: boolean
  parameters:
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    bearer-key:
      type: http
      scheme: Bearer
      bearerFormat: jwt
x-refined-from:
- entur-seatingservices-openapi.json
- entur-seatingservices-openapi.yml
