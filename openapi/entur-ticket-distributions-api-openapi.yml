      title: ValidableElement
      required:
      - elementId
      - legIds
      type: object
      properties:
        elementId:
          type: string
          description: 'The elementId as found on the validableElement. NOTE: This is NOT the same as validableElementRef.id'
        legIds:
          type: array
          description: list of legIds that belong to this validableElement
          items:
            type: string
