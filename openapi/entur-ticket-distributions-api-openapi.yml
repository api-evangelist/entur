    Carnet:
      title: Carnet
      required:
      - remainingCount
      - totalCount
      - usedCount
      type: object
      properties:
        totalCount:
          type: integer
          description: Total number of tickets purchased.
          format: int32
        usedCount:
          type: integer
          description: Number of tickets that have been activated.
          format: int32
        remainingCount:
          type: integer
          description: Number of tickets left, totalCount minus usedCount.
          format: int32
      description: Carnet (klippekort) details, only present on the main ticket of an id-based carnet. Each ticket on the carnet is one trip (TRIP_CARNET) or one pass (PASS_CARNET).
    Mode:
      title: Mode
      type: string
      description: Travel mode for Leg.
      enum:
      - AIR
      - BICYCLE
      - BUS
      - CABLEWAY
      - CAR
      - WATER
      - FUNICULAR
      - LIFT
      - LINKSWITCH
      - RAIL
      - METRO
      - TRAM
      - TRANSIT
      - FOOT
      - COACH
