      title: TariffZone
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    SupplementProduct:
      title: SupplementProduct
      required:
      - id
      - price
      - product
      type: object
      properties:
        datedServiceJourneyRefs:
          type: array
          items:
            type: string
        id:
          type: integer
          format: int64
        price:
          $ref: '#/components/schemas/Price'
        product:
          $ref: '#/components/schemas/FareProduct'
        supplementType:
          type: string
          description: Type to indicate if for instance the product is some kind of passenger or just a seat allocation. Mirrors the supplement types defined in NeTEx and configured on supplement products in Entur Product catalog.
          enum:
          - ANIMAL
          - BICYCLE
          - DOG
          - EVENT_ADD_ON
          - EXTRA_LUGGAGE
          - JOURNEY_ADD_ON
          - JOURNEY_EXTENSION
          - MEAL
          - OTHER
          - PARKING
          - PASSENGER_SPOT
          - PASSENGER_VEHICLE_SPOT
          - PENALTY
          - SEAT_RESERVATION
          - TOP_UP
          - UPGRADE
          - WIFI
        parking:
          $ref: '#/components/schemas/Parking'
