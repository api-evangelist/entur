      title: TicketDistributionStatus
      type: string
      enum:
      - CREATED
      - DISTRIBUTED
      - CANCELLED
      - PICKED_UP
      - VALIDATED
      - EXPIRED
      - FAILED
      - ACTIVATED
  parameters:
    dciHeader:
      name: Entur-Distribution-Channel
      in: header
      description: A header containing a distribution channel reference
      required: false
      style: simple
      explode: false
      schema:
        type: string
        examples:
        - ENT:DistributionChannel:App
    posHeader:
      name: Entur-Pos
      in: header
      description: A header containing a point-of-sale reference
      required: true
      style: simple
      explode: false
      schema:
        type: string
        examples:
        - MyApplication
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    languageHeader:
      name: Accepts-Language
      in: header
      description: A header used to select language
      required: false
      style: simple
      explode: false
      schema:
        type: string
        description: Current supported languages are 'nob', 'nno' and 'eng'
      examples:
        default:
          value: nob
    orderIdPathParam:
      name: orderId
      in: path
      description: orderId
      required: true
      style: simple
      explode: false
      schema:
        type: string
        examples:
        - NTA2JGR7
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
