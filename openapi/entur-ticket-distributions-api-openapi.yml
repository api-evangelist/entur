openapi: 3.2.0
info:
  title: Ticket Distributions API
  description: Easy way to manage and distribute new tickets to ticketing systems.
  version: 2026.10.0
servers:
- url: https://api.staging.entur.io/sales
  description: Staging test environment
- url: https://api.dev.entur.io/sales
  description: Development test environment
- url: https://api.entur.io/sales
  description: Production environment
security:
- authHeader: []
tags:
- name: Ticket Distributions
  description: Services regarding ticket distribution level.
paths:
  /v1/ticket-distributions/{orderId}/summary:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Ticket Distributions
      summary: Get summary of distribution data for an order
      description: Returns a list of the distinct summary data for the orderId. This service/endpoint is useful to just retrieve external distribution data for an order when you may not have access to all order data.
      operationId: getTicketDistributionSummary
      parameters:
      - $ref: '#/components/parameters/orderIdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDistributionSummary'
        '404':
          $ref: '#/components/responses/notFound'
  /v1/ticket-distributions/{orderId}/distribute:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - Ticket Distributions
      summary: Deprecated.
      description: Distribute a set of ticket distribution groups to NOD for pick up as QR-code and animation.
      operationId: distributeTicketDistributions
      parameters:
      - $ref: '#/components/parameters/posHeader'
      - name: deliverAfter
        in: query
        description: The earliest time it should be possible to pick up the ticket
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/orderIdPathParam'
      - name: qrChecksumType
        in: query
        description: The QR Code checksum type
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDistributionGroup'
        '400':
          $ref: '#/components/responses/badRequest'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      deprecated: true
  /v1/ticket-distributions/{orderId}/distribute-travel-card:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - Ticket Distributions
      summary: Deprecated.
      description: Distribute a set of ticket distribution groups to NOD for pick up on travel card.
      operationId: distributeTicketDistributionsToTravelCard
      parameters:
      - $ref: '#/components/parameters/posHeader'
      - $ref: '#/components/parameters/orderIdPathParam'
      requestBody:
        description: requestBody
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTravelCardRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDistributionGroup'
        '400':
          $ref: '#/components/responses/badRequest'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
      deprecated: true
  /v1/ticket-distributions/{orderId}/generate:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - Ticket Distributions
      summary: Generate ticket distributions
      description: Generate a set of ticket distribution groups which later will be distributed to a ticket system.
      operationId: generateTicketDistributions
      parameters:
      - $ref: '#/components/parameters/languageHeader'
      - $ref: '#/components/parameters/dciHeader'
      - $ref: '#/components/parameters/posHeader'
      - $ref: '#/components/parameters/orderIdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDistributionGroup'
        '400':
          $ref: '#/components/responses/badRequest'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internalServerError'
components:
  schemas:
    FareProduct:
      title: FareProduct
      required:
      - id
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        organisation:
          type: integer
          format: int64
        version:
          type: string
        validableElements:
          type: array
          items:
            $ref: '#/components/schemas/ValidableElement'
    DistributionDetails:
      title: DistributionDetails
      type: object
      properties:
        clientSecret:
          type: string
        orderGroupId:
          type: string
        fareContractRef:
          type: string
          description: Reference to an account-based-ticketing farecontract
        customerAccountRef:
          type: string
          description: Reference to an account-based-ticketing customer account
        distributedAsPdf:
          type: boolean
          description: Is set to true if distributed as a PDF by ticket-distribution
    Leg:
      title: Leg
      required:
      - arrivalTime
      - departureTime
      - fromStopPlace
      - mode
      - serviceJourneyRef
      - subMode
      - toStopPlace
      type: object
      properties:
        arrivalTime:
          type: string
          format: date-time
        departureTime:
          type: string
          format: date-time
        toStopPlace:
          $ref: '#/components/schemas/StopPlace'
        fromStopPlace:
          $ref: '#/components/schemas/StopPlace'
        mode:
          $ref: '#/components/schemas/Mode'
        subMode:
          $ref: '#/components/schemas/SubMode'
        datedServiceJourneyRef:
          type: string
        serviceJourneyRef:
          type: string
        legId:
          type: string
    Parking:
      title: Parking
      required:
      - vehicles
      type: object
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
      description: Parking data for a PARKING supplement product.
    Topology:
      title: Topology
      type: object
      properties:
        datedServiceJourneyRef:
          type: array
          items:
            type: string
        distance:
          type: integer
          format: int32
        fromStopPlace:
          type: string
        fromStopPlaceExt:
          type: integer
          format: int64
        fromStopPlaceName:
          type: string
        fromTariffZone:
          type: string
          deprecated: true
        fromTariffZoneExt:
          type: integer
          format: int32
          deprecated: true
        fromTariffZoneName:
          type: string
          deprecated: true
        groupOfTariffZones:
          type: array
          items:
            $ref: '#/components/schemas/GroupOfTariffZone'
        toStopPlace:
          type: string
        toStopPlaceExt:
          type: integer
          format: int64
        toStopPlaceName:
          type: string
        toTariffZone:
          type: string
          deprecated: true
        toTariffZoneExt:
          type: integer
          format: int32
          deprecated: true
        toTariffZoneName:
          type: string
          deprecated: true
        viaTariffZones:
          type: array
          deprecated: true
          items:
            $ref: '#/components/schemas/TariffZone'
        zoneType:
          type: string
          enum:
          - POINT_TO_POINT
          - RING
        fromFareZone:
          $ref: '#/components/schemas/FareZone'
        toFareZone:
          $ref: '#/components/schemas/FareZone'
        viaFareZones:
          type: array
          items:
            $ref: '#/components/schemas/FareZone'
    Price:
      title: Price
      required:
      - amount
      - taxAmount
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
        taxAmount:
          type: string
        taxRate:
          type: string
    Entitlement:
      title: Entitlement
      required:
      - entitlementProductId
      type: object
      properties:
        contractId:
          type: string
        entitlementProductId:
          type: string
    GroupOfTariffZone:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      description: Reference to a group of tariff zones with display name.
    Reservation:
      title: Reservation
      required:
      - externalReservationId
      - id
      - seats
      type: object
      properties:
        datedServiceJourneyId:
          type: string
        externalReservationId:
          type: string
        id:
          type: integer
          format: int64
        seats:
          type: array
          items:
            $ref: '#/components/schemas/Seat'
    Distribution:
      title: Distribution
      type: object
      properties:
        customerAccountRef:
          type: string
          description: Reference to an account-based-ticketing customer account
        fareContractRef:
          type: string
          description: Reference to an account-based-ticketing farecontract
    SubMode:
      title: SubMode
      type: string
      description: The transport sub mode (e.g., localBus or expressBus) used when traversing this leg. Null if leg is not a ride
      default: UNDEFINED
      enum:
      - UNKNOWN
      - UNDEFINED
      - INTERNATIONAL_FLIGHT
      - DOMESTIC_FLIGHT
      - INTERCONTINENTAL_FLIGHT
      - DOMESTIC_SCHEDULED_FLIGHT
      - SHUTTLE_FLIGHT
      - INTERCONTINENTAL_CHARTER_FLIGHT
      - INTERNATIONAL_CHARTER_FLIGHT
      - ROUND_TRIP_CHARTER_FLIGHT
      - SIGHTSEEING_FLIGHT
      - HELICOPTER_SERVICE
      - DOMESTIC_CHARTER_FLIGHT
      - SCHENGEN_AREA_FLIGHT
      - AIRSHIP_SERVICE
      - SHORT_HAUL_INTERNATIONAL_FLIGHT
      - CANAL_BARGE
      - LOCAL_BUS
      - REGIONAL_BUS
      - EXPRESS_BUS
      - NIGHT_BUS
      - POST_BUS
      - SPECIAL_NEEDS_BUS
      - MOBILITY_BUS
      - MOBILITY_BUS_FOR_REGISTERED_DISABLED
      - SIGHTSEEING_BUS
      - SHUTTLE_BUS
      - HIGH_FREQUENCY_BUS
      - DEDICATED_LANE_BUS
      - SCHOOL_BUS
      - SCHOOL_AND_PUBLIC_SERVICE_BUS
      - RAIL_REPLACEMENT_BUS
      - DEMAND_AND_RESPONSE_BUS
      - AIRPORT_LINK_BUS
      - INTERNATIONAL_COACH
      - NATIONAL_COACH
      - SHUTTLE_COACH
      - REGIONAL_COACH
      - SPECIAL_COACH
      - SCHOOL_COACH
      - SIGHTSEEING_COACH
      - TOURIST_COACH
      - COMMUTER_COACH
      - FUNICULAR
      - STREET_CABLE_CAR
      - ALL_FUNICULAR_SERVICES
      - UNDEFINED_FUNICULAR
      - METRO
      - TUBE
      - URBAN_RAILWAY
      - CITY_TRAM
      - LOCAL_TRAM
      - REGIONAL_TRAM
      - SIGHTSEEING_TRAM
      - SHUTTLE_TRAM
      - TRAIN_TRAM
      - TELECABIN
      - CABLE_CAR
      - LIFT
      - CHAIR_LIFT
      - DRAG_LIFT
      - TELECABIN_LINK
      - LOCAL
      - HIGH_SPEED_RAIL
      - SUBURBAN_RAILWAY
      - REGIONAL_RAIL
      - INTERREGIONAL_RAIL
      - LONG_DISTANCE
      - INTERNATIONAL
      - SLEEPER_RAIL_SERVICE
      - NIGHT_RAIL
      - CAR_TRANSPORT_RAIL_SERVICE
      - TOURIST_RAILWAY
      - AIRPORT_LINK_RAIL
      - RAIL_SHUTTLE
      - REPLACEMENT_RAIL_SERVICE
      - SPECIAL_TRAIN
      - CROSS_COUNTRY_RAIL
      - RACK_AND_PINION_RAILWAY
      - INTERNATIONAL_CAR_FERRY
      - NATIONAL_CAR_FERRY
      - REGIONAL_CAR_FERRY
      - LOCAL_CAR_FERRY
      - INTERNATIONAL_PASSENGER_FERRY
      - NATIONAL_PASSENGER_FERRY
      - REGIONAL_PASSENGER_FERRY
      - LOCAL_PASSENGER_FERRY
      - POST_BOAT
      - TRAIN_FERRY
      - ROAD_FERRY_LINK
      - AIRPORT_BOAT_LINK
      - HIGH_SPEED_VEHICLE_SERVICE
      - HIGH_SPEED_PASSENGER_SERVICE
      - SIGHTSEEING_SERVICE
      - SCHOOL_BOAT
      - CABLE_FERRY
      - RIVER_BUS
      - SCHEDULED_FERRY
      - SHUTTLE_FERRY_SERVICE
      - COMMUNAL_TAXI
      - CHARTER_TAXI
      - WATER_TAXI
      - RAIL_TAXI
      - BIKE_TAXI
      - BLACK_CAB
      - MINI_CAB
      - ALL_TAXI_SERVICES
      - HIRE_CAR
      - HIRE_VAN
      - HIRE_MOTORBIKE
      - HIRE_CYCLE
      - ALL_HIRE_VEHICLES
      examples:
      - LOCAL
    StopPlace:
      title: StopPlace
      required:
      - ref
      type: object
      properties:
        ref:
          type: string
        name:
          type: string
    Vehicle:
      title: Vehicle
      required:
      - licencePlateNumber
      type: object
      properties:
        licencePlateNumber:
          type: string
          examples:
          - AA12345
      description: A vehicle registered for a parking reservation.
    ApiError:
      title: ApiError
      required:
      - error
      - exception
      - message
      - path
      - status
      - timestamp
      - title
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          examples:
          - '2025-01-01T12:00:00Z'
        status:
          type: integer
          format: int32
          examples:
          - 400
        title:
          type: string
          description: Short, human-readable summary of the problem
        error:
          type: string
        exception:
          type: string
        message:
          type: string
          examples:
          - Validation failed
        path:
          type: string
          examples:
          - /v1/ticket-distributions/XYZ123/distribute
      examples:
      - timestamp: '2025-01-01T12:00:00Z'
        status: 400
        title: Bad Request
        error: Bad Request
        exception: ValidationException
        message: Validation failed
        path: /v1/ticket-distributions/XYZ123
    SalesPackage:
      title: SalesPackage
      required:
      - id
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
    FareZone:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      description: Reference to fare zone with display name. Will eventually replace tariff zones.
    Group:
      title: Group
      required:
      - id
      - userProfileSummary
      type: object
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
        userProfiles:
          type: string
          description: Deprecated in favour of new type userProfileSummary.
          deprecated: true
        version:
          type: string
        userProfileSummary:
          type: array
          description: A collection of all the different user profiles in the group.
          items:
            $ref: '#/components/schemas/UserProfileInGroup'
          default: []
    UserProfile:
      title: UserProfile
      required:
      - id
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
    Seat:
      title: Seat
      required:
      - externalSeatId
      - id
      - railcarNumber
      - seatNumber
      - seatType
      type: object
      properties:
        externalSeatId:
          type: string
        id:
          type: integer
          format: int64
        railcarNumber:
          type: string
        seatCode:
          type: string
          description: Deprecated. Better use the more flexible types in seatingProperties which mirrors the properties from seating manager.
          deprecated: true
        seatNumber:
          type: string
        seatType:
          type: string
          description: Deprecated. Better use the more flexible types in seatingProperties which mirrors the properties from seating manager.
          deprecated: true
        seatingProperties:
          title: SeatingProperties
          required:
          - baggageType
          - mobilityFacilities
          - nuisanceFacilities
          - passengerCommsFacilities
          - sanitaryFacilities
          type: object
          properties:
            fareClass:
              type: string
              description: Fare class of the seat. Netex enumeration.
              enum:
              - UNKNOWN
              - FIRST_CLASS
              - SECOND_CLASS
              - THIRD_CLASS
              - PREFERENTE
              - PREMIUM_CLASS
              - BUSINESS_CLASS
              - STANDARD_CLASS
              - TURISTA
              - ECONOMY_CLASS
              - ANY
              examples:
              - FIRST_CLASS
            groupBooking:
              type: string
              description: Group booking permission of the seat. Netex enumeration.
              enum:
              - GROUPS_ALLOWED
              - GROUPS_NOT_ALLOWED
              - GROUPS_ALLOWED_WITH_RESERVATION
              - GROUP_BOOKINGS_RESTRICTED
              - UNKNOWN
              examples:
              - GROUPS_ALLOWED
            accommodationFacility:
              type: string
              description: Accommodation property of the seat. Netex enumeration.
              enum:
              - UNKNOWN
              - STANDING
              - SEATING
              - FOLDING_SEAT
              - SLEEPER
              - SINGLE_SLEEPER
              - DOUBLE_SLEEPER
              - SPECIAL_SLEEPER
              - COUCHETTE
              - SINGLE_COUCHETTE
              - DOUBLE_COUCHETTE
              - SPECIAL_SEATING
              - RECLINING_SEATS
              - BABY_COMPARTMENT
              - FAMILY_CARRIAGE
              - RECREATION_AREA
              - PANORAMA_COACH
              - PULLMAN_COACH
              - PUSHCHAIR
              - WHEELCHAIR
              examples:
              - SINGLE_SLEEPER
            seatAttachment:
              type: string
              description: Attachment of the seat. Netex enumeration.
              enum:
              - REVERSIBLE
              - FIXED
              - FOLDING
              - REMOVABLE
              - OTHER
              examples:
              - REVERSIBLE
            seatPosition:
              type: string
              description: Position of the seat. Netex enumeration.
              enum:
              - WINDOW
              - AISLE
              - MIDDLE
              - UPPER_BERTH
              - MIDDLE_BERTH
              - LOWER_BERTH
              - OTHER
              examples:
              - MIDDLE_BERTH
            relativeDirection:
              type: string
              description: Relative direction of the seat. Netex enumeration.
              enum:
              - BOTH
              - FORWARDS
              - BACKWARDS
              examples:
              - BACKWARDS
            nuisanceFacilities:
              uniqueItems: true
              type: array
              description: Set of possible nuisance factors of the seat. Netex enumerations.
              items:
                type: string
                description: Set of possible nuisance factors of the seat. Netex enumerations.
                enum:
                - UNKNOWN
                - SMOKING
                - NO_SMOKING
                - FAMILY_AREA
                - CHILDFREE_AREA
                - ANIMALS_ALLOWED
                - NO_ANIMALS
                - BREASTFEEDING_FRIENDLY
                - MOBILE_PHONE_USE_ZONE
                - MOBILE_PHONE_FREE_ZONE
                examples:
                - FAMILY_AREA
              examples:
              - - FAMILY_AREA
                - SMOKING
            passengerCommsFacilities:
              uniqueItems: true
              type: array
              description: Set of possible communication facilities available for passenger in the seat. Netex enumerations.
              items:
                type: string
                description: Set of possible communication facilities available for passenger in the seat. Netex enumerations.
                enum:
                - UNKNOWN
                - FREE_WIFI
                - PUBLIC_WIFI
                - POWER_SUPPLY_SOCKETS
                - TELEPHONE
                - AUDIO_ENTERTAINMENT
                - VIDEO_ENTERTAINMENT
                - BUSINESS_SERVICES
                - INTERNET
                - POST_OFFICE
                - POST_BOX
                examples:
                - POWER_SUPPLY_SOCKETS
              examples:
              - - POWER_SUPPLY_SOCKETS
                - TELEPHONE
            sanitaryFacilities:
              uniqueItems: true
              type: array
              description: Set of possible sanitary facilities available for passenger in the seat. Netex enumerations.
              items:
                type: string
                description: Set of possible sanitary facilities available for passenger in the seat. Netex enumerations.
                enum:
                - NONE
                - TOILET
                - WHEELCHAIR_ACCESS_TOILET
                - SHOWER
                - WASHING_AND_CHANGE_FACILITIES
                - BABY_CHANGE
                - WHEELCHAIR_BABY_CHANGE
                - SHOE_SHINER
                - OTHER
                examples:
                - TOILET
              examples:
              - - TOILET
                - SHOWER
            mobilityFacilities:
              uniqueItems: true
              type: array
              description: Set of possible mobility facilities available for passenger in the seat. Netex enumerations.
              items:
                type: string
                description: Set of possible mobility facilities available for passenger in the seat. Netex enumerations.
                enum:
                - UNKNOWN
                - LOW_FLOOR
                - STEP_FREE_ACCESS
                - SUITABLE_FOR_PUSHCHAIRS
                - SUITABLE_FOR_WHEELCHAIRS
                - SUITABLE_FOR_HEAVILIY_DISABLED
                - BOARDING_ASSISTANCE
                - ONBOARD_ASSISTANCE
                - UNACCOMPANIED_MINOR_ASSISTANCE
                - TACTILE_PLATFORM_EDGES
                - TACTILE_GUIDING_STRIPS
                examples:
                - SUITABLE_FOR_WHEELCHAIRS
              examples:
              - - SUITABLE_FOR_WHEELCHAIRS
                - LOW_FLOOR
            baggageType:
              uniqueItems: true
              type: array
              description: Set of possible baggage types possible for passenger in the seat. Netex enumerations.
              items:
                type: string
                description: Set of possible baggage types possible for passenger in the seat. Netex enumerations.
                enum:
                - HANDBAG
                - HAND_LUGGAGE
                - SMALL_SUITCASE
                - SUITCASE
                - TRUNK
                - OVERSIZE_ITEM
                - BICYCLE
                - MOTORCYCLE
                - SPORTING_EQUIPMENT
                - SKIS
                - MUSICAL_INSTRUMENT
                - PUSH_CHAIR
                - WHEELCHAIR
                - MOTORIZED_WHEELCHAIR
                - LARGE_MOTORIZED_WHEELCHAIR
                - SMALL_ANIMAL
                - ANIMAL
                - GAME
                - OTHER
                examples:
                - HANDBAG
              examples:
              - - HANDBAG
                - SUITCASE
          description: Properties of a seat. They describe both physical and logical properties of a seat.Physical properties are for example position of the seat.Logical properties describe properties that the operator use when selling the seat. For example fare class.
    Customer:
      title: Customer
      required:
      - customerId
      - entitlements
      - id
      type: object
      properties:
        customerId:
          type: string
          description: The id of the customer in the external system
          examples:
          - '12345678901'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        id:
          type: integer
          description: The internal id of the customer
          format: int64
          examples:
          - 1
    UserProfileInGroup:
      required:
      - count
      - userProfileId
      type: object
      properties:
        userProfileId:
          type: string
          description: Reference to the product register.
        userProfileVersion:
          type: string
        count:
          type: integer
          description: The number of travellers with given user profile.
        name:
          type: string
          description: Display name of user profile for requested language. Defaults to norwegian name.
      description: A representation of a user profile to summarize parts of a group product.
    TicketDistribution:
      title: TicketDistribution
      required:
      - authority
      - combinedTicket
      - customers
      - distributionStatus
      - endOfValidity
      - id
      - loyaltyProgram
      - networkId
      - orderLineVersion
      - price
      - productTemplate
      - provider
      - purchaseDate
      - reservations
      - startOfValidity
      - supplementProducts
      - tariffCode
      - ticketType
      - ticketWithZones
      - topology
      - type
      type: object
      properties:
        arrivalTime:
          type: string
          format: date-time
        authority:
          $ref: '#/components/schemas/Authority'
        combinedTicket:
          type: boolean
        createdAt:
          type: string
          format: date-time
        customers:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        deliverAfter:
          type: string
          format: date-time
        departureTime:
          type: string
          format: date-time
        distributionDetails:
          $ref: '#/components/schemas/DistributionDetails'
        distributionStatus:
