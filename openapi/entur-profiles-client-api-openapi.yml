openapi: 3.2.0
info:
  title: Customers Profiles client API
  description: Documentation of the Customers API
  termsOfService: https://entur.org
  contact:
    name: Entur Team Personalisering
    url: https://enturas.atlassian.net/wiki/spaces/CULP/overview
    email: team.personalisering@entur.org
  version: 2026.10.0
servers:
- url: https://api.entur.io/customers/v2
security:
- jwt: []
tags:
- name: Profiles client
  description: Api for creating, fetching, modifying and deleting customers and related information.
paths:
  /profiles/{customerNumber}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Profiles client
      summary: Find customer by customer number
      description: Gets a customer with related information. If the passed customer number is for a merged and passive customer, the result will instead be the active, merged customer. Thus, you may find a customer with a different customer number than you specified in the URL.
      operationId: findCustomerByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: includeECards
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: includePersonnelTicket
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: includePreferences
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: includeDeleted
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      - name: includeNotes
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:les
          - customers-profile-global:les
          - customers-profile-jdir:les
    put:
      tags:
      - Profiles client
      summary: Update customer
      description: Updates a customer with the added data. If an address is not specified in the request, it will not be changed. After the update is complete, an UPDATE event will be added to the customer-changes queue.
      operationId: updateCustomerByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPutRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
  /profiles/{customerNumber}/restore:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    put:
      tags:
      - Profiles client
      summary: Restore deactivated customer
      description: Restores a deactivated customer. This means reinstating the status it had before deletion. If another customer has been registered for the same organisation with the same email address since marking for deactivation, the restoration will fail.
      operationId: restoreDeactivatedCustomerByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
  /profiles/{customerNumber}/preferences:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Profiles client
      summary: Find all preferences for customer
      description: Get all customer preferences for the given customer number.
      operationId: findAllPreferencesForCustomerByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:les
          - customers-profile-global:les
          - customers-profile-jdir:les
    put:
      tags:
      - Profiles client
      summary: Bulk update customer preferences
      description: Replaces all a customers preferences with the supplied list. All existing preferences will be deleted! Use with caution.
      operationId: bulkUpdateCustomerPreferencesByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCustomerPreferenceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomerPreferenceResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
    post:
      tags:
      - Profiles client
      summary: Create customer preference
      description: Create a new customer preference. This will fail if the customer already has that preference set.
      operationId: createCustomerPreferenceByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPreferenceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPreferenceResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
  /profiles/{customerNumber}/preferences/{preferenceId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Profiles client
      summary: Find a specific preference for customer
      description: Get a specific customer preference by preference Id.
      operationId: findSpecificPreferenceForCustomerByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: preferenceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPreferenceResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:les
          - customers-profile-global:les
          - customers-profile-jdir:les
    put:
      tags:
      - Profiles client
      summary: Update a customer preference
      description: Set a new value for a given customer preference. This will fail if the customer doesn't have this preference set already.
      operationId: updateCustomerPreferenceByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: preferenceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPreferenceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPreferenceResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
    delete:
      tags:
      - Profiles client
      summary: Delete a customer preference
      description: Deletes the given customer preference from the database.
      operationId: deleteCustomerPreferenceByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: preferenceId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
  /profiles/{customerNumber}/postal-addresses/{postalAddressId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    put:
      tags:
      - Profiles client
      summary: Update postal address
      description: Updates an existing postal address on the customer.
      operationId: updatePostalAddressByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: postalAddressId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostalAddressRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostalAddressResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
    delete:
      tags:
      - Profiles client
      summary: Delete postal address
      description: Deletes the given postal address from the customer.
      operationId: deletePostalAddressByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: postalAddressId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
  /profiles/{customerNumber}/merge-personnel-ticket-profile/{pticketCustomerNumber}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    put:
      tags:
      - Profiles client
      summary: Merge customers
      description: Merge a personnel ticket customer with a standard customer. Given the customer number to a profile that has been created solely for being the recipient of a personnel ticket, you can merge that profile into an active profile. In practice this deletes the personnel ticket profile and transfers any tickets onto the current profile.
      operationId: mergeCustomersByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: pticketCustomerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
  /profiles/{customerNumber}/ecard-ownerships/{ecardOperator}/{ecardNumber}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Profiles client
      summary: Find specific E-card
      description: Get a specific ecard by customer number and ecard information.
      operationId: findSpecificEcardByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: ecardOperator
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      - name: ecardNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcardOwnershipResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:les
          - customers-profile-global:les
          - customers-profile-jdir:les
    put:
      tags:
      - Profiles client
      summary: Update E-card registration
      description: Update an existing E-card for a customer. Can also be used to set a new owner of the E-card. The internal logic is 'find the customer who owns this E-card. Then, see if this is the same customer who is specified in the URL. If it isn't, move the card to this new customer.' Regardless of whether the card is moved, all fields are overwritten with the supplied info. Also note that it isn't possible to switch the card ownership to a customer from another organisation.
      operationId: updateEcardRegistrationByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: ecardOperator
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int32
      - name: ecardNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EcardOwnershipRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcardOwnershipResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:endre
          - customers-profile-global:endre
          - customers-profile-jdir:endre
  /profiles/{customerNumber}/delete:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    put:
      tags:
      - Profiles client
      summary: Deactivate customer
      description: Deactivates a customer. In practice this means mark them for deletion and set the expiration date. Another process is responsible for the actual removal from the database. While a customer is deactivated, it's still possible to look them up, by specifying the includeDeleted flag.
      operationId: deactivateCustomerByCustomerNumber
      parameters:
      - name: customerNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      - name: expirationDate
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
        examples:
          default:
            value: '2018-02-12T13:23:53+01:00'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:slett
          - customers-profile-global:slett
          - customers-profile-jdir:slett
  /profiles:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - Profiles client
      summary: Find customers by parameters
      description: A list of customers matching the search criteria. Always includes postalAddresses and personnelTickets if available.
      operationId: findCustomersByParameters
      parameters:
      - name: firstName
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: surname
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: email
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: countryCode
        in: query
        description: Ignored unless telephoneNumberNoCountryCode is also set.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          default:
            value: '+47'
      - name: telephoneNumber
        in: query
        description: Ignored if countryCode and telephoneNumberNoCountryCode are set.
        required: false
        deprecated: true
        style: form
        explode: true
        schema:
          type: string
      - name: telephoneNumberNoCountryCode
        in: query
        description: Telephone number with no country code prefix. Ignored unless countryCode is also set.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: landlineNumber
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: dateOfBirth
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: yyyy-MM-dd
        examples:
          default:
            value: '2018-02-12'
      - name: postalAddress
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: postCode
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: ticketRightOwner
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: ticketRightBearer
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: organisationId
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: maxResultSet
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: includeTemporary
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: invoiceOrganisationId
        in: query
        description: Organisation ID from Brønnøysund, for invoice profiles
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
        examples:
          default:
            value: 123456785
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      x-entur-permissions:
        value:
          any:
          - customers-profile:les
          - customers-profile-global:les
          - customers-profile-jdir:les
    post:
      tags:
      - Profiles client
      summary: Create a customer
