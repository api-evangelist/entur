openapi: 3.2.0
info:
  title: Seating Services Dated Service Journey Controller V 1 API
  description: API exposing services to handle seat reservations
  version: 2026.09.0
servers:
- url: https://api.entur.io/seatingservices
tags:
- name: dated-service-journey-controller-v-1
paths:
  /v1/dated-service-journeys/{datedServiceJourneyId}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    patch:
      tags:
      - dated-service-journey-controller-v-1
      operationId: setDatedServiceJourneyStatus
      parameters:
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatedServiceJourneyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatedServiceJourneyResponse'
      summary: Set dated service journey status
      x-summary-source: derived
  /v1/dated-service-journeys/{datedServiceJourneyId}/seats:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - dated-service-journey-controller-v-1
      operationId: getAvailableSeatsInATrain
      parameters:
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: origin
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: destination
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: requestScrolling
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: F
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeqRailcarResponseV1'
      summary: Get available seats in ATrain
      x-summary-source: derived
  /v1/dated-service-journeys/{datedServiceJourneyId}/railcars:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - dated-service-journey-controller-v-1
      operationId: getRailcars
      parameters:
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: origin
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: destination
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: requestScrolling
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: F
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeqRailcarTypeResponseV1'
      deprecated: true
      summary: Get railcars
      x-summary-source: derived
  /v1/dated-service-journeys/{datedServiceJourneyId}/railcars/{railcarNumber}/seats:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - dated-service-journey-controller-v-1
      operationId: getAvailableSeatsInARailcar
      parameters:
      - name: railcarNumber
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: origin
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: destination
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: requestScrolling
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: F
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RailcarResponseV1'
      summary: Get available seats in ARailcar
      x-summary-source: derived
  /v1/dated-service-journeys/{datedServiceJourneyId}/railcars/seats:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - dated-service-journey-controller-v-1
      operationId: getAvailableSeatsInRailcarBySeatTypeId
      parameters:
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: travellers
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: origin
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: destination
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: seatTypeId
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RailcarResponseV1'
      deprecated: true
      summary: Get available seats in railcar by seat type id
      x-summary-source: derived
  /v1/dated-service-journeys/{datedServiceJourneyId}/railcars/configs:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - dated-service-journey-controller-v-1
      operationId: getRailcarGroupInfo
      parameters:
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeqRailcarTypeInfoResponseV1'
      summary: Get railcar group info
      x-summary-source: derived
components:
  schemas:
    RailcarResponseV1: {}
    SeqRailcarTypeResponseV1:
      type: object
      properties:
        traversableAgain:
          type: boolean
        empty:
          type: boolean
    SeqRailcarTypeInfoResponseV1:
      type: object
      properties:
        traversableAgain:
          type: boolean
        empty:
          type: boolean
    UpdateDatedServiceJourneyRequest:
      type: object
      properties:
        closed:
          type: boolean
    SeqRailcarResponseV1:
      type: object
      properties:
        traversableAgain:
          type: boolean
        empty:
          type: boolean
    DatedServiceJourneyResponse:
      type: object
      properties:
        closed:
          type: boolean
  parameters:
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    bearer-key:
      type: http
      scheme: Bearer
      bearerFormat: jwt
