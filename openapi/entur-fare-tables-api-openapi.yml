    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - fare-tables
      summary: Retrieves a fare table by id
      operationId: fare-tables_getByIdV2
      parameters:
      - name: id
        in: path
        description: The unique id to identify a fare table
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: startDate
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: endDate
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: The version status of the fare table
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: The language code from ISO-639-3
