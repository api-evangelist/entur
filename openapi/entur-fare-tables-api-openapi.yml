  /fare-tables/{id}:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - fare-tables
      summary: Retrieves a fare table by id
      description: Note! Only fare tables with active versions will be fetched
      operationId: fare-tables_getById
      parameters:
      - name: id
        in: path
        description: The unique id to identify a fare table
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: version
        in: query
        description: The id for the version of the fare table
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: languageCode
        in: query
        description: The language code from ISO-639-3
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: minimizeDataLoad
        in: query
        description: if set to true fare table cells will be omitted
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: validOnDate
        in: query
        description: Return the version valid on the given date (ISO-8601). Overrides 'version'. In prod returns the VERSIONED element; in staging/dev PROPOSED is preferred over VERSIONED.
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: date-time
      - name: If-None-Match
        in: header
        description: Used to make conditional requests. It allows the client to provide an ETag value, and the server will process the request only if the ETag does not match the current version of the resource.
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the fare table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareTable'
        '304':
          description: Not Modified
        '400':
          description: Bad request
          content:
            application/problem+json:
