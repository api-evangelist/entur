    - url: https://api.dev.entur.io/products
      description: Development environment
  /fare-tables/{ftId}/cells/{cellId}/fare-prices:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    patch:
      tags:
      - fare-tables
      summary: Updates a FarePrice for FareTable
      operationId: fare-tables_updateFarePriceForFareTable
      parameters:
      - name: ftId
        in: path
        description: The  id to identify a fare table
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
      - name: cellId
        in: path
        description: The  id to identify a cell
        required: true
        style: simple
        explode: false
        schema:
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
      - name: version
        in: query
        required: true
        style: form
        explode: true
        schema:
          minLength: 1
          pattern: ^([A-Z]{3}):([A-Za-z]*):([0-9A-Za-z_\-]*)$
          type: string
      - name: fareTableVersionId
        in: query
        description: The versjon of the fare table
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarePriceUpdate'
        required: true
      responses:
        '204':
          description: Entity updated successfully
        '400':
          description: Validation errors
          content:
            application/problem+json:
              schema:
                type: string
        '401':
          description: Missing Authorization
          content:
            application/problem+json:
              schema:
