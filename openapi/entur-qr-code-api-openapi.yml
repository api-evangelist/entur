openapi: 3.2.0
info:
  title: Entur shared mobility QR Code API
  description: This is the API for Entur shared mobility. It is used to communicate with the Entur shared mobility platform. The API is based on the TOMP-API standard and is used to manage bookings, payments, and other operations related to shared mobility. The API is designed to be easy to use and understand, with clear documentation and examples. The API is also designed to be secure, with support for OAuth2 authentication and authorization.
  contact:
    name: Team Delingsmobilitet
  version: 2026.09.2
servers:
- url: https://api.entur.io/shared-mobility/v1
  description: Generated server url
security:
- Authorization: []
tags:
- name: QR Code
paths:
  /qr-code:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - QR Code
      description: Get information based on QR code URL
      operationId: getQrCodeInfo
      parameters:
      - name: Accept-Language
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      - name: qrCodeUrl
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: longitude
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: number
          format: float
      - name: latitude
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: number
          format: float
      responses:
        '200':
          description: Asset
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          description: Invalid request data
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Insufficient permissions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Resource conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
      summary: Get qr code info
      x-summary-source: derived
components:
  schemas:
    Operator:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    Asset:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/Operator'
        id:
          type:
          - string
          - 'null'
        systemId:
          type:
          - string
          - 'null'
        stationId:
          type:
          - string
          - 'null'
        formFactor:
          type:
          - string
          - 'null'
          enum:
          - BICYCLE
          - CARGO_BICYCLE
          - CAR
          - MOPED
          - SCOOTER
          - SCOOTER_STANDING
          - SCOOTER_SEATED
          - OTHER
        licensePlate:
          type:
          - string
          - 'null'
        stateOfCharge:
          type:
          - integer
          - 'null'
          format: int32
        currentRangeKm:
          type:
          - integer
          - 'null'
          format: int32
        vehicleMaxRangeInMeters:
          type:
          - integer
          - 'null'
          format: int32
        vehicleCode:
          type:
          - string
          - 'null'
        vehicleTypeId:
          type:
          - string
          - 'null'
        coordinates:
          oneOf:
          - $ref: '#/components/schemas/Coordinates'
          - type: 'null'
        propulsionType:
          type:
          - string
          - 'null'
          enum:
          - HUMAN
          - ELECTRIC_ASSIST
          - ELECTRIC
          - COMBUSTION
          - COMBUSTION_DIESEL
          - HYBRID
          - PLUG_IN_HYBRID
          - HYDROGEN_FUEL_CELL
        stationSlotName:
          type:
          - string
          - 'null'
      required:
      - operator
    ApiError:
      type: object
      properties:
        type:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        exception:
          type: string
        error:
          type: string
        message:
          type: string
        path:
          type: string
      required:
      - detail
      - error
      - exception
      - instance
      - message
      - path
      - status
      - timestamp
      - title
      - type
    Coordinates:
      type: object
      properties:
        longitude:
          type: number
          format: float
        latitude:
          type: number
          format: float
        altitude:
          type:
          - number
          - 'null'
          format: float
      required:
      - latitude
      - longitude
  parameters:
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    Authorization:
      type: http
      description: Authorization header
      scheme: bearer
      bearerFormat: Bearer eyJhbGciOiJIUzI1NiIsInR5cCIf36POk6yJV_adQssw5c
