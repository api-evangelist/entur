openapi: 3.2.0
info:
  title: Seating Services Seat Capacity Controller Beta API
  description: API exposing services to handle seat reservations
  version: 2026.09.0
servers:
- url: https://api.entur.io/seatingservices
tags:
- name: seat-capacity-controller-beta
paths:
  /beta/dated-service-journeys/seat-capacities:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    post:
      tags:
      - seat-capacity-controller-beta
      operationId: getCapacityWithProductInfoPerDeparture_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeqJourneyQuery'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeqSeatCapacityWithProducts'
      deprecated: true
      summary: Get capacity with product info per departure 1
      x-summary-source: derived
  /beta/dated-service-journeys/{datedServiceJourneyId}/total-seat-capacities:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - seat-capacity-controller-beta
      operationId: getTotalCapacity_1
      parameters:
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: origin
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: destination
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalCapacity'
      deprecated: true
      summary: Get total capacity 1
      x-summary-source: derived
components:
  schemas:
    SeqJourneyQuery:
      type: object
      properties:
        traversableAgain:
          type: boolean
        empty:
          type: boolean
    TotalCapacity: {}
    SeqSeatCapacityWithProducts:
      type: object
      properties:
        traversableAgain:
          type: boolean
        empty:
          type: boolean
  parameters:
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    bearer-key:
      type: http
      scheme: Bearer
      bearerFormat: jwt
