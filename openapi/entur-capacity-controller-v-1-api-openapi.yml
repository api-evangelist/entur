openapi: 3.2.0
info:
  title: Seating manager Capacity Controller V 1 API
  description: Seating manager generates seating offers and keeps track of what seats are reserved and/or blocked
  version: 2026.09.0
servers:
- url: https://api.entur.io/seating-manager
security:
- bearer-key: []
tags:
- name: capacity-controller-v-1
paths:
  /v1/capacities/{datedServiceJourneyId}/total:
    parameters:
    - $ref: '#/components/parameters/ET-Client-Name'
    - $ref: '#/components/parameters/X-Correlation-Id'
    get:
      tags:
      - capacity-controller-v-1
      operationId: getTotalCapacity
      parameters:
      - name: datedServiceJourneyId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: fromStopPlaceId
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: seatingPropertiesKey
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - FareClass
            - GroupBooking
            - AccommodationFacility
            - SeatAttachment
            - SeatPosition
            - RelativeDirection
            - NuisanceFacilities
            - PassengerCommsFacilities
            - SanitaryFacilities
            - MobilityFacilities
            - BaggageType
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TotalMaterialCompositionCapacityResponseV1'
      summary: Get total capacity
      x-summary-source: derived
components:
  schemas:
    TotalCapacityEntryResponseV1:
      required:
      - numberOfSeats
      - seatingPropertyKey
      - totalCompartments
      type: object
      properties:
        seatingPropertyKey:
          $ref: '#/components/schemas/SeatingPropertiesResponseV1'
        numberOfSeats:
          type: integer
          format: int32
        totalCompartments:
          type: integer
          format: int32
    SeatingPropertiesResponseV1:
      type: object
      properties:
        fareClass:
          type:
          - string
          - 'null'
          description: Fare class of the seat. Netex enumeration.
          enum:
          - UNKNOWN
          - FIRST_CLASS
          - SECOND_CLASS
          - THIRD_CLASS
          - PREFERENTE
          - PREMIUM_CLASS
          - BUSINESS_CLASS
          - STANDARD_CLASS
          - TURISTA
          - ECONOMY_CLASS
          - ANY
          examples:
          - FIRST_CLASS
        groupBooking:
          type:
          - string
          - 'null'
          description: Group booking permission of the seat. Netex enumeration.
          enum:
          - GROUPS_ALLOWED
          - GROUPS_NOT_ALLOWED
          - GROUPS_ALLOWED_WITH_RESERVATION
          - GROUP_BOOKINGS_RESTRICTED
          - UNKNOWN
          examples:
          - GROUPS_ALLOWED
        accommodationFacility:
          type:
          - string
          - 'null'
          description: Accommodation property of the seat. Netex enumeration.
          enum:
          - UNKNOWN
          - SEATING
          - FOLDING_SEAT
          - SLEEPER
          - SINGLE_SLEEPER
          - DOUBLE_SLEEPER
          - SPECIAL_SLEEPER
          - COUCHETTE
          - SINGLE_COUCHETTE
          - DOUBLE_COUCHETTE
          - SPECIAL_SEATING
          - RECLINING_SEATS
          - BABY_COMPARTMENT
          - FAMILY_CARRIAGE
          - RECREATION_AREA
          - PANORAMA_COACH
          - PULLMAN_COACH
          - PUSHCHAIR
          - WHEELCHAIR
          - STANDING
          examples:
          - SINGLE_SLEEPER
        seatAttachment:
          type:
          - string
          - 'null'
          description: Attachment of the seat. Netex enumeration.
          enum:
          - REVERSIBLE
          - FIXED
          - FOLDING
          - REMOVABLE
          - OTHER
          examples:
          - REVERSIBLE
        seatPosition:
          type:
          - string
          - 'null'
          description: Position of the seat. Netex enumeration.
          enum:
          - WINDOW
          - AISLE
          - MIDDLE
          - UPPER_BERTH
          - MIDDLE_BERTH
          - LOWER_BERTH
          - OTHER
          examples:
          - MIDDLE_BERTH
        relativeDirection:
          type:
          - string
          - 'null'
          description: Relative direction of the seat. Netex enumeration.
          enum:
          - BOTH
          - FORWARDS
          - BACKWARDS
          examples:
          - BACKWARDS
        nuisanceFacilities:
          uniqueItems: true
          type: array
          description: Set of possible nuisance factors of the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible nuisance factors of the seat. Netex enumerations.
            enum:
            - UNKNOWN
            - SMOKING
            - NO_SMOKING
            - FAMILY_AREA
            - CHILDFREE_AREA
            - ANIMALS_ALLOWED
            - NO_ANIMALS
            - BREASTFEEDING_FRIENDLY
            - MOBILE_PHONE_USE_ZONE
            - MOBILE_PHONE_FREE_ZONE
            examples:
            - FAMILY_AREA,SMOKING
          examples:
          - FAMILY_AREA,SMOKING
        passengerCommsFacilities:
          uniqueItems: true
          type: array
          description: Set of possible communication facilities available for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible communication facilities available for passenger in the seat. Netex enumerations.
            enum:
            - UNKNOWN
            - FREE_WIFI
            - PUBLIC_WIFI
            - POWER_SUPPLY_SOCKETS
            - TELEPHONE
            - AUDIO_ENTERTAINMENT
            - VIDEO_ENTERTAINMENT
            - BUSINESS_SERVICES
            - INTERNET
            - POST_OFFICE
            - POST_BOX
            examples:
            - POWER_SUPPLY_SOCKETS,TELEPHONE
          examples:
          - POWER_SUPPLY_SOCKETS,TELEPHONE
        sanitaryFacilities:
          uniqueItems: true
          type: array
          description: Set of possible sanitary facilities available for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible sanitary facilities available for passenger in the seat. Netex enumerations.
            enum:
            - NONE
            - TOILET
            - WHEELCHAIR_ACCESS_TOILET
            - SHOWER
            - WASHING_AND_CHANGE_FACILITIES
            - BABY_CHANGE
            - WHEELCHAIR_BABY_CHANGE
            - SHOE_SHINER
            - OTHER
            examples:
            - TOILET,SHOWER
          examples:
          - TOILET,SHOWER
        mobilityFacilities:
          uniqueItems: true
          type: array
          description: Set of possible mobility facilities available for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible mobility facilities available for passenger in the seat. Netex enumerations.
            enum:
            - UNKNOWN
            - LOW_FLOOR
            - STEP_FREE_ACCESS
            - SUITABLE_FOR_PUSHCHAIRS
            - SUITABLE_FOR_WHEELCHAIRS
            - SUITABLE_FOR_HEAVILIY_DISABLED
            - BOARDING_ASSISTANCE
            - ONBOARD_ASSISTANCE
            - UNACCOMPANIED_MINOR_ASSISTANCE
            - TACTILE_PLATFORM_EDGES
            - TACTILE_GUIDING_STRIPS
            examples:
            - SUITABLE_FOR_WHEELCHAIRS,LOW_FLOOR
          examples:
          - SUITABLE_FOR_WHEELCHAIRS,LOW_FLOOR
        baggageType:
          uniqueItems: true
          type: array
          description: Set of possible baggage types possible for passenger in the seat. Netex enumerations.
          items:
            type: string
            description: Set of possible baggage types possible for passenger in the seat. Netex enumerations.
            enum:
            - HANDBAG
            - HAND_LUGGAGE
            - SMALL_SUITCASE
            - SUITCASE
            - TRUNK
            - OVERSIZE_ITEM
            - BICYCLE
            - MOTORCYCLE
            - SPORTING_EQUIPMENT
            - SKIS
            - MUSICAL_INSTRUMENT
            - PUSH_CHAIR
            - WHEELCHAIR
            - MOTORIZED_WHEELCHAIR
            - LARGE_MOTORIZED_WHEELCHAIR
            - SMALL_ANIMAL
            - ANIMAL
            - GAME
            - OTHER
            examples:
            - HANDBAG,SUITCASE
          examples:
          - HANDBAG,SUITCASE
      description: Properties of a seat. They describe both physical and logical properties of a seat.Physical properties are for example position of the seat.Logical properties describe properties that the operator use when selling the seat. For example fare class.
    TotalMaterialCompositionCapacityResponseV1:
      required:
      - fromStopPlaceId
      - materialCompositionId
      - totalCapacitiesBySeatingProperties
      - untilStopPlaceId
      type: object
      properties:
        materialCompositionId:
          type: string
        fromStopPlaceId:
          type: string
        untilStopPlaceId:
          type: string
        totalCapacitiesBySeatingProperties:
          type: array
          items:
            $ref: '#/components/schemas/TotalCapacityEntryResponseV1'
  parameters:
    ET-Client-Name:
      name: ET-Client-Name
      in: header
      description: 'Entur Client Header.

        It is required that all consumers identify themselves by using this header.

        Entur will deploy strict rate-limiting policies on API-consumers who do not identify with a header and reserves the right to block unidentified consumers.

        The structure of ET-Client-Name should be: `<company>-<application>`.'
      required: false
      style: simple
      explode: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      description: Correlation id
      required: false
      style: simple
      explode: false
      schema:
        type: string
  securitySchemes:
    bearer-key:
      type: http
      scheme: Bearer
      bearerFormat: jwt
