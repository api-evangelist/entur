    openEnded: Boolean
    minAge: Duration

    " Defaults to true here (unlike Query.situations, which defaults to false):\n a live subscriber needs to observe a situation transitioning to\n progress: closed so it can remove it from display. One consequence:\n a new subscriber's initial snapshot also includes situations closed\n within the grace period, not just live ones."
    includeClosed: Boolean = true

