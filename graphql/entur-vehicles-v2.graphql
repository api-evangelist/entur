# Source: introspection of https://api.entur.io/realtime/v2/vehicles/graphql (fetched 2026-10-09)
"""This directive allows results to be deferred during execution"""
directive @defer(
  """Deferred behaviour is controlled by this argument"""
  if: Boolean! = true

  """A unique label that represents the fragment being deferred"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
This directive disables error propagation when a non nullable field returns null for the given operation.
"""
directive @experimental_disableErrorPropagation on QUERY | MUTATION | SUBSCRIPTION

type AffectedLine {
  line: Line
  stops: [AffectedStop]

  " The part of this line's geometry the situation affects. A line has many journey\n patterns, so this is one representative pattern rather than the line as a whole:\n with stops, the span between the first and last affected stop on the first pattern\n they locate on; without stops - meaning the line is affected as a whole - the entire\n route of the line's longest pattern.\n Null when the line has no pattern geometry, when exactly one stop is affected (a\n point is not a span), or when the affected stops locate on none of its patterns."
  affectedPointsOnLink: PointsOnLink
}

type AffectedStop {
  stop: Stop
  stopConditions: [StopConditionEnumeration]
}

type AffectedVehicleJourney {
  serviceJourney: ServiceJourney
  datedServiceJourney: DatedServiceJourney

  """ Context for display. A journey entry is scoped to the journey it names, never to this line.
  """
  line: Line
  operator: Operator
  stops: [AffectedStop]

  " The part of this journey's geometry the situation affects: the span between the first\n and last affected stop, or - when the situation names no stops at all, meaning the\n journey is affected as a whole - the journey's entire route. An empty `stops` list is\n what tells those two cases apart.\n Null when the journey has no pattern geometry, when exactly one stop is affected (a\n point is not a span), or when any affected stop cannot be located on the route - a\n partial span would draw a confident line over the wrong part of it.\n A `datedServiceJourney` the planned data could not resolve - including one whose ref is\n really a ServiceJourney id, which some producers publish in that slot - is still used as\n a journey id here, so this can carry geometry where `datedServiceJourney.serviceJourney`\n is null. The ref itself is left exactly as the producer sent it."
  affectedPointsOnLink: PointsOnLink
}

type Affects {
  stopPoints: [Stop]
  stopPlaces: [Stop]
  operators: [Operator]
  vehicleModes: [VehicleModeEnumeration]

  " The journey-to-stops pairing SIRI carries: a situation is often tagged on a journey\n AND the stops it is affected at, and is only relevant to a traveller whose trip visits\n them. Every journey the situation names appears here, so this is the only place to read\n them from - there is no flat serviceJourneys list beside it."
  vehicleJourneys: [AffectedVehicleJourney]

  " Every line the situation names as affected in its own right, with the stops it is\n affected at. A line named only as context for an affected journey is not here - it is\n on that journey's entry."
  affectedLines: [AffectedLine]
}

input BoundingBox {
  minLat: Float!
  minLon: Float!
  maxLat: Float!
  maxLon: Float!
}

