  stopPoint: Stop
  order: Int
  aimedArrivalTime: DateTime
  aimedArrivalTimeEpochSecond: Float
  aimedDepartureTime: DateTime
  aimedDepartureTimeEpochSecond: Float
  expectedArrivalTime: DateTime
  expectedArrivalTimeEpochSecond: Float
  expectedDepartureTime: DateTime
  expectedDepartureTimeEpochSecond: Float
  actualArrivalTime: DateTime
  actualArrivalTimeEpochSecond: Float
  actualDepartureTime: DateTime
  actualDepartureTimeEpochSecond: Float
  callType: CallTypeEnumeration
  cancellation: Boolean
  arrivalBoardingActivity: String
  departureBoardingActivity: String
  forBoarding: Boolean
  occupancyStatus: OccupancyStatus

  " Situations affecting this stop while the vehicle is here. A situation on a quay that\n ends before the vehicle arrives is not included. A situation affecting several of the\n journey's stops is reported against every one of them."
  situations: [Situation]
}

