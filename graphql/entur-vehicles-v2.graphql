  operator: Operator
  codespace: Codespace
  originRef: String
  originName: String
  destinationRef: String
  destinationName: String
  mode: VehicleModeEnumeration
  vehicleId: String
  occupancyStatus: OccupancyStatus
  line: Line
  lastUpdated: DateTime
  lastUpdatedEpochSecond: Float
  expiration: DateTime
  expirationEpochSecond: Float
  monitored: Boolean
  cancellation: Boolean

  """ Reported status of the vehicle"""
  vehicleStatus: VehicleStatusEnumeration
  calls: [Call]

  " Situations affecting this journey as a whole: those naming the journey, its dated\n journey or its line and overlapping the journey. A situation reported against one of\n the journey's calls is not repeated here, so select calls { situations } as well to\n see every disruption affecting this journey. Closed situations are never included."
  situations: [Situation]
}

