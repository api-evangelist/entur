"""
A line's colours as published in NeTEx, with no defaulting or normalisation. Mirrors Journey Planner's Line.presentation.
"""
type Presentation {
  """
  Six hex digits without '#', e.g. 76A300. Null when the line publishes none.
  """
  colour: String

  """Six hex digits without '#'. Null when the line publishes none."""
  textColour: String
}

type ProgressBetweenStops {
  linkDistance: Float
  percentage: Float
}

type Query {
  vehicles(
    serviceJourneyId: String

    """ Date as in "Operating date" when realtime-updates are referenced by ServiceJourneyId + Date
    """
    date: String
    serviceJourneyIdAndDates: [ServiceJourneyIdAndDate]
    datedServiceJourneyId: String
    datedServiceJourneyIds: [String]
    operatorRef: String
    codespaceId: String
    mode: VehicleModeEnumeration
    vehicleId: String
    vehicleIds: [String]
    lineRef: String
    lineName: String
    monitored: Boolean
    boundingBox: BoundingBox

    """ Maximum age of data in the response as Duration (e.g. `PT1M`). If lastUpdated is older than this, it will not be included in the response.
    """
    maxDataAge: Duration

    """
    Include vehicles whose reported coordinates are known to be invalid (e.g. 0,0).
    Such vehicles are excluded by default.
    """
    includeInvalidLocations: Boolean = false
  ): [VehicleUpdate]
  timetables(serviceJourneyIdAndDates: [ServiceJourneyIdAndDate], datedServiceJourneyIds: [String], codespaceId: String, mode: VehicleModeEnumeration, lineRef: String, monitored: Boolean, cancellation: Boolean): [EstimatedTimetableUpdate] @deprecated(reason: "Experimental.")
  situations(
    situationNumbers: [String]
    codespaceId: String
    operatorRef: String
    lineRef: String

    """ Matches affected stop points and stop places alike."""
    stopRef: String
    serviceJourneyId: String
    datedServiceJourneyId: String
    mode: VehicleModeEnumeration
    severity: SeverityEnumeration
    reportType: String

    """ When true, only situations that are valid at the time of the request."""
    validNow: Boolean

    """ When true, only situations where no validity period carries an end time.
    """
    openEnded: Boolean

    """ Only situations created longer ago than this, as Duration (e.g. `P30D`).
    """
    minAge: Duration
    includeClosed: Boolean = false
  ): [Situation]
  lines(codespaceId: String): [Line]
  codespaces: [Codespace]
  serviceJourney(id: String!): ServiceJourney

  " Looks up service journeys in the planned data. At least one of `ids`, `lineRef` or `codespaceId` is required.\n `ids` accepts ServiceJourney ids as well as DatedServiceJourney ids (resolved to the journey and its operating date);\n results keep the order of `ids`, unknown ids are skipped. `lineRef` and `codespaceId` further narrow the result."
  serviceJourneys(ids: [String!], lineRef: String, codespaceId: String): [ServiceJourney]

  """ A dated service journey from the planned data, or null if the id is unknown.
  """
  datedServiceJourney(id: String!): DatedServiceJourney

  """ Dated service journeys from the planned data. Results keep the order of `ids`, unknown ids are skipped.
  """
  datedServiceJourneys(ids: [String!]!): [DatedServiceJourney]
  operators(codespaceId: String): [Operator]
}

