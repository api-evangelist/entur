type Situation {
  situationNumber: String!
  participantRef: String
  codespace: Codespace

  " The subscription stream is only eventually consistent: two concurrent updates\n to the same situation can be published in reverse version order. Clients should\n keep the highest version seen per situationNumber and discard a regression."
  version: Int
  sourceType: String
  progress: WorkflowStatusEnumeration
  severity: SeverityEnumeration
  priority: Int
  reportType: String
  keywords: [String]
  planned: Boolean
  creationTime: DateTime
  versionedAtTime: DateTime
  validityPeriods: [ValidityPeriod]
  summary: [TranslatedString]
  description: [TranslatedString]
  advice: [TranslatedString]
  detail: [TranslatedString]
  infoLinks: [InfoLink]
  affects: Affects
  lastUpdated: DateTime
  lastUpdatedEpochSecond: Float

  """ Null when the situation never expires."""
  expiration: DateTime
  expirationEpochSecond: Float

  """ True when no validity period carries an end time."""
  openEnded: Boolean

  """ Time elapsed since creationTime. Null when creationTime is absent."""
  age: Duration
}

